<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f0e8">
<title>KFC｜車輛巡檢後台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#c8102e;
  --black:#242424;
  --gray:#77736d;
  --linen:#f4f0e8;
  --paper:#fff;
  --line:#ddd8ce;
  --green:#356b4b;
  --green-bg:#eef5f0;
  --danger:#b42318;
  --danger-bg:#fff0ee;
  --yellow:#9a6b00;
  --yellow-bg:#fff8df;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--linen);
  color:var(--black);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Helvetica Neue",
    Arial,
    sans-serif;
  text-align:center;
}

button,
input{
  font-family:inherit;
}

.page{
  width:100%;
  max-width:900px;
  margin:auto;
  padding-bottom:50px;
}

/* ===== Header ===== */

.header{
  background:var(--paper);
  padding:30px 20px 26px;
  border-bottom:1px solid var(--line);
  text-align:center;
}

.eyebrow{
  color:var(--gray);
  font-size:12px;
  letter-spacing:4px;
  margin-bottom:8px;
}

.title-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
}

.title{
  margin:0;
  font-size:34px;
  font-weight:800;
}

.kfc{
  color:var(--red);
  font-size:28px;
  font-weight:900;
}

.date{
  margin-top:10px;
  color:var(--gray);
  font-size:14px;
}

/* ===== Section ===== */

.section{
  padding:22px 16px 0;
}

.section-title{
  margin-bottom:14px;
  font-size:20px;
  font-weight:800;
}

/* ===== Summary ===== */

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.summary-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 8px;
}

.summary-card.clickable{
  cursor:pointer;
  transition:.12s;
}

.summary-card.clickable:active{
  transform:scale(.98);
  background:#faf8f3;
}

.summary-label{
  color:var(--gray);
  font-size:13px;
  margin-bottom:8px;
}

.summary-number{
  font-size:30px;
  font-weight:800;
}

.summary-card.done .summary-number{
  color:var(--green);
}

.summary-card.abnormal .summary-number{
  color:var(--danger);
}

/* ===== Search ===== */

.search-box{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}

.search-input{
  width:100%;
  height:54px;
  border:2px solid #d8d3ca;
  border-radius:14px;
  padding:0 16px;
  font-size:18px;
  text-align:center;
  outline:none;
}

.search-input:focus{
  border-color:var(--red);
}

/* ===== Vehicle List ===== */

.vehicle-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.vehicle-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  text-align:center;
  transition:.12s;
}

.vehicle-card:active{
  transform:scale(.99);
}

.vehicle-card.is-abnormal{
  border:2px solid #e2aaa4;
  background:#fffafa;
}

.vehicle-card.oil-warning{
  border:2px solid #e1c66e;
  background:#fffdf5;
}

.vehicle-card.oil-danger{
  border:2px solid #d9958d;
  background:#fffafa;
}

.vehicle-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.plate{
  font-size:22px;
  font-weight:800;
  letter-spacing:1px;
}

.center{
  font-size:14px;
  color:var(--gray);
  font-weight:700;
}

.status,
.oil-status{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:6px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.status-normal,
.oil-normal{
  background:var(--green-bg);
  color:var(--green);
}

.status-abnormal,
.oil-danger{
  background:var(--danger-bg);
  color:var(--danger);
}

.status-none,
.oil-none{
  background:#f1eee8;
  color:var(--gray);
}

.oil-warning{
  background:var(--yellow-bg);
  color:var(--yellow);
}

.vehicle-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:15px;
  gap:8px;
  color:var(--gray);
  font-size:14px;
}

.vehicle-info>div{
  padding:8px 4px;
}

.vehicle-info strong{
  display:block;
  margin-top:4px;
  color:var(--black);
  font-size:15px;
}

/* ===== Empty / Loading ===== */

.empty,
.loading{
  padding:40px 20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  color:var(--gray);
}

/* ===== Modal ===== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:700px;
  max-height:88vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:25px 25px 0 0;
  padding:24px 18px 35px;
}

.modal-title{
  font-size:25px;
  font-weight:800;
}

.modal-subtitle{
  color:var(--gray);
  margin-top:5px;
  font-size:14px;
}

/* ===== Oil ===== */

.oil-panel{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#faf9f6;
  border:1px solid var(--line);
}

.oil-panel-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px;
}

.oil-panel-info{
  color:var(--gray);
  font-size:14px;
  line-height:1.8;
}

.oil-panel-status{
  margin-top:10px;
  font-size:17px;
  font-weight:800;
}

.oil-action{
  width:100%;
  height:50px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

/* ===== History ===== */

.history{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}

.history-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:#faf9f6;
}

.history-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.history-date{
  font-size:14px;
  color:var(--gray);
}

.history-mileage{
  margin-top:12px;
  font-size:18px;
  font-weight:800;
}

.history-abnormal{
  margin-top:10px;
  padding:12px;
  border-radius:11px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

.history-normal{
  margin-top:10px;
  padding:10px;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  font-weight:700;
}

/* ===== Close ===== */

.close-btn{
  width:100%;
  height:52px;
  margin-top:20px;
  border:0;
  border-radius:15px;
  background:var(--black);
  color:#fff;
  font-size:17px;
  font-weight:700;
}

/* ===== Mobile ===== */

@media(max-width:600px){

  .summary{
    grid-template-columns:repeat(2,1fr);
  }

  .summary-number{
    font-size:27px;
  }

  .title{
    font-size:28px;
  }

  .kfc{
    font-size:24px;
  }

  .plate{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- Header -->
  <header class="header">

    <div class="eyebrow">
      KFC DELIVERY CENTER
    </div>

    <div class="title-row">

      <h1 class="title">
        車輛巡檢後台
      </h1>

      <div class="kfc">
        KFC
      </div>

    </div>

    <div id="todayDate" class="date"></div>

  </header>


  <!-- 今日巡檢 -->
  <section class="section">

    <div class="section-title">
      今日巡檢
    </div>

    <div class="summary">

      <div class="summary-card">
        <div class="summary-label">
          車輛總數
        </div>

        <div id="totalCount" class="summary-number">
          —
        </div>
      </div>


      <div class="summary-card done">

        <div class="summary-label">
          已巡檢
        </div>

        <div id="doneCount" class="summary-number">
          —
        </div>

      </div>


      <!-- 未巡檢：可點 -->
      <div id="pendingCard" class="summary-card clickable">

        <div class="summary-label">
          未巡檢
        </div>

        <div id="pendingCount" class="summary-number">
          —
        </div>

      </div>


      <!-- 今日異常：可點 -->
      <div id="abnormalCard" class="summary-card abnormal clickable">

        <div class="summary-label">
          今日異常
        </div>

        <div id="abnormalCount" class="summary-number">
          —
        </div>

      </div>

    </div>

  </section>


  <!-- 查詢 -->
  <section class="section">

    <div class="section-title">
      查詢車輛
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        type="text"
        inputmode="text"
        placeholder="輸入車牌搜尋"
        autocomplete="off"
      >

    </div>

  </section>


  <!-- 車輛列表 -->
  <section class="section">

    <div class="section-title">
      車輛列表
    </div>

    <div id="vehicleList" class="vehicle-list">

      <div class="loading">
        載入車輛資料中…
      </div>

    </div>

  </section>

</div>


<!-- ==========================================
     快速列表 Modal
========================================== -->

<div id="quickModal" class="modal">

  <div class="modal-content">

    <div
      class="modal-title"
      id="quickModalTitle">
    </div>

    <div
      class="modal-subtitle"
      id="quickModalSubtitle">
    </div>

    <div
      id="quickList"
      class="history">
    </div>

    <button
      id="closeQuickModal"
      class="close-btn">
      關閉
    </button>

  </div>

</div>


<!-- ==========================================
     車輛詳細紀錄 Modal
========================================== -->

<div id="modal" class="modal">

  <div class="modal-content">

    <div
      class="modal-title"
      id="modalTitle">
    </div>

    <div
      class="modal-subtitle"
      id="modalSubtitle">
    </div>

    <div id="oilPanel"></div>

    <div
      id="history"
      class="history">
    </div>

    <button
      id="closeModal"
      class="close-btn">
      關閉
    </button>

  </div>

</div>


<script>

/* ==========================================
   Supabase
========================================== */

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   機油設定
========================================== */

const OIL_INTERVAL = 1500;

const OIL_WARNING_DISTANCE = 300;


/* ==========================================
   DOM
========================================== */

const vehicleList =
  document.getElementById("vehicleList");

const searchInput =
  document.getElementById("searchInput");

const totalCount =
  document.getElementById("totalCount");

const doneCount =
  document.getElementById("doneCount");

const pendingCount =
  document.getElementById("pendingCount");

const abnormalCount =
  document.getElementById("abnormalCount");

const pendingCard =
  document.getElementById("pendingCard");

const abnormalCard =
  document.getElementById("abnormalCard");

const todayDate =
  document.getElementById("todayDate");


/* Quick Modal */

const quickModal =
  document.getElementById("quickModal");

const quickModalTitle =
  document.getElementById("quickModalTitle");

const quickModalSubtitle =
  document.getElementById("quickModalSubtitle");

const quickList =
  document.getElementById("quickList");

const closeQuickModal =
  document.getElementById("closeQuickModal");


/* Detail Modal */

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalSubtitle =
  document.getElementById("modalSubtitle");

const oilPanel =
  document.getElementById("oilPanel");

const historyContainer =
  document.getElementById("history");

const closeModal =
  document.getElementById("closeModal");


/* ==========================================
   全域資料
========================================== */

let vehicles = [];

let todayReports = [];

let latestReports = [];


/* ==========================================
   日期
========================================== */

const now = new Date();

const todayStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

const tomorrowStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + 1
  );


todayDate.textContent =
  now.toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"long"
    }
  );


/* ==========================================
   載入資料
========================================== */

async function loadData(){

  vehicleList.innerHTML =
    '<div class="loading">載入資料中…</div>';

  try{

    /* 車輛 */

    const vr =
      await db
        .from("vehicles")
        .select("*")
        .eq("active", true)
        .order(
          "plate4",
          {
            ascending:true
          }
        );


    if(vr.error){

      throw vr.error;

    }


    vehicles =
      vr.data || [];


    /* 今日巡檢 */

    const tr =
      await db
        .from("inspection_reports")
        .select("*")
        .gte(
          "reported_at",
          todayStart.toISOString()
        )
        .lt(
          "reported_at",
          tomorrowStart.toISOString()
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(tr.error){

      throw tr.error;

    }


    todayReports =
      tr.data || [];


    /* 每台車最新巡檢 */

    const results =
      await Promise.all(

        vehicles.map(

          async v => {

            const r =
              await db
                .from("inspection_reports")
                .select("*")
                .eq(
                  "vehicle_id",
                  v.id
                )
                .order(
                  "reported_at",
                  {
                    ascending:false
                  }
                )
                .limit(1);


            if(
              r.error ||
              !r.data ||
              !r.data.length
            ){

              return null;

            }


            return r.data[0];

          }

        )

      );


    latestReports =
      results.filter(Boolean);


    updateSummary();

    renderVehicles();

  }

  catch(e){

    console.error(e);

    vehicleList.innerHTML = `
      <div class="empty">

        <strong>
          資料讀取失敗
        </strong>

        <br><br>

        ${escapeHtml(
          e.message || "未知錯誤"
        )}

      </div>
    `;

  }

}


/* ==========================================
   上方統計
========================================== */

function updateSummary(){

  const map =
    new Map();


  /*
    同一台車今天可能巡檢多次
    只算一台
  */

  todayReports.forEach(

    r => {

      if(
        !map.has(r.vehicle_id)
      ){

        map.set(
          r.vehicle_id,
          r
        );

      }

    }

  );


  totalCount.textContent =
    vehicles.length;


  doneCount.textContent =
    map.size;


  pendingCount.textContent =
    Math.max(
      vehicles.length - map.size,
      0
    );


  let n = 0;


  map.forEach(

    r => {

      if(
        r.overall_status ===
        "abnormal"
      ){

        n++;

      }

    }

  );


  abnormalCount.textContent =
    n;

}


/* ==========================================
   找今日紀錄
========================================== */

function todayReport(v){

  return todayReports.find(
    r => r.vehicle_id === v.id
  );

}


/* ==========================================
   找最新紀錄
========================================== */

function latestReport(v){

  return latestReports.find(
    r => r.vehicle_id === v.id
  );

}


/* ==========================================
   機油狀態
========================================== */

function oilStatus(v){

  const latest =
    latestReport(v);

  const current =
    latest
      ? Number(latest.mileage || 0)
      : null;

  const last =
    v.last_oil_change_mileage;


  /*
    尚未設定基準
  */

  if(
    last === null ||
    last === undefined
  ){

    return {

      type:"none",

      order:4,

      text:"尚未設定換油基準",

      current,

      last:null,

      remaining:null

    };

  }


  /*
    沒有目前里程
  */

  if(current === null){

    return {

      type:"none",

      order:4,

      text:"等待里程",

      current,

      last:Number(last),

      remaining:null

    };

  }


  const remaining =
    OIL_INTERVAL -
    (
      current -
      Number(last)
    );


  /*
    已到換油里程
  */

  if(remaining <= 0){

    return {

      type:"danger",

      order:1,

      text:
        `需要換油 ${Math.abs(remaining)} km`,

      current,

      last:Number(last),

      remaining

    };

  }


  /*
    300 km 內
  */

  if(
    remaining <=
    OIL_WARNING_DISTANCE
  ){

    return {

      type:"warning",

      order:3,

      text:
        `距離換油 ${remaining} km`,

      current,

      last:Number(last),

      remaining

    };

  }


  /*
    正常
  */

  return {

    type:"normal",

    order:5,

    text:
      `距離換油 ${remaining} km`,

    current,

    last:Number(last),

    remaining

  };

}


/* ==========================================
   車輛排序
========================================== */

function sortOrder(v){

  const oil =
    oilStatus(v);

  const today =
    todayReport(v);


  /*
    1. 需要換油
    2. 今日異常
    3. 快換油
    4. 未巡檢
    5. 正常
  */

  if(
    oil.type === "danger"
  ){

    return 1;

  }


  if(
    today &&
    today.overall_status ===
    "abnormal"
  ){

    return 2;

  }


  if(
    oil.type === "warning"
  ){

    return 3;

  }


  if(!today){

    return 4;

  }


  return 5;

}


/* ==========================================
   點擊「異常 / 未巡檢」
========================================== */

function openQuickList(type){

  const isAbnormal =
    type === "abnormal";


  let list;


  /*
    今日異常
  */

  if(isAbnormal){

    list =
      vehicles.filter(

        v => {

          const report =
            todayReport(v);

          return (
            report &&
            report.overall_status ===
            "abnormal"
          );

        }

      );

  }

  /*
    未巡檢
  */

  else{

    list =
      vehicles.filter(

        v => {

          return !todayReport(v);

        }

      );

  }


  /* Modal 標題 */

  quickModalTitle.textContent =
    isAbnormal
      ? "今日異常車輛"
      : "尚未巡檢車輛";


  quickModalSubtitle.textContent =
    `共 ${list.length} 台｜點選車輛可查看詳細紀錄`;


  /* 沒有車 */

  if(!list.length){

    quickList.innerHTML = `

      <div class="empty">

        目前沒有
        ${isAbnormal
          ? "今日異常"
          : "未巡檢"
        }
        車輛

      </div>

    `;

  }

  else{

    list.sort(

      (a,b) =>
        String(a.plate4 || "")
          .localeCompare(
            String(b.plate4 || "")
          )

    );


    quickList.innerHTML = "";


    list.forEach(

      v => {

        const t =
          todayReport(v);

        const latest =
          latestReport(v);

        const oil =
          oilStatus(v);


        const card =
          document.createElement("div");


        card.className =
          "history-card";


        card.style.cursor =
          "pointer";


        card.innerHTML = `

          <div class="history-top">

            <div class="plate">

              ${escapeHtml(
                v.full_plate ||
                v.plate4 ||
                ""
              )}

            </div>


            <div class="center">

              CENTER｜
              ${escapeHtml(
                v.center ||
                "未設定"
              )}

            </div>


            <div class="status ${
              isAbnormal
                ? "status-abnormal"
                : "status-none"
            }">

              ${
                isAbnormal
                  ? "今日異常"
                  : "今日未巡檢"
              }

            </div>

          </div>


          <div class="vehicle-info">

            <div>

              目前里程

              <strong>

                ${
                  latest
                    ? Number(
                        latest.mileage
                      ).toLocaleString()
                      + " km"
                    : "尚無資料"
                }

              </strong>

            </div>


            <div>

              機油

              <strong>

                ${escapeHtml(
                  oil.text
                )}

              </strong>

            </div>

          </div>

        `;


        /*
          點車輛
          關閉快速列表
          開啟詳細紀錄
        */

        card.addEventListener(
          "click",
          () => {

            quickModal.classList.remove(
              "show"
            );

            openHistory(v);

          }
        );


        quickList.appendChild(card);

      }

    );

  }


  quickModal.classList.add(
    "show"
  );

}


/* ==========================================
   車輛列表
========================================== */

function renderVehicles(){

  const key =
    searchInput.value
      .trim()
      .toUpperCase();


  let list =
    vehicles.filter(

      v => {

        if(!key){

          return true;

        }


        return (

          String(
            v.plate4 || ""
          )
          .toUpperCase()
          .includes(key)

          ||

          String(
            v.full_plate || ""
          )
          .toUpperCase()
          .includes(key)

        );

      }

    );


  /*
    排序
  */

  list.sort(

    (a,b) => {

      const order =
        sortOrder(a) -
        sortOrder(b);


      if(order !== 0){

        return order;

      }


      return String(
        a.plate4 || ""
      ).localeCompare(
        String(
          b.plate4 || ""
        )
      );

    }

  );


  /*
    沒資料
  */

  if(!list.length){

    vehicleList.innerHTML =
      '<div class="empty">找不到符合的車輛</div>';

    return;

  }


  vehicleList.innerHTML =
    "";


  list.forEach(

    v => {

      const t =
        todayReport(v);

      const latest =
        latestReport(v);

      const oil =
        oilStatus(v);


      /*
        巡檢狀態
      */

      const statusClass =
        t

          ? (
              t.overall_status ===
              "abnormal"

                ? "status-abnormal"

                : "status-normal"
            )

          : "status-none";


      const statusText =
        t

          ? (
              t.overall_status ===
              "abnormal"

                ? "今日異常"

                : "今日正常"
            )

          : "今日未巡檢";


      /*
        機油樣式
      */

      const oilClass =
        oil.type === "danger"

          ? "oil-danger"

          : oil.type === "warning"

            ? "oil-warning"

            : oil.type === "normal"

              ? "oil-normal"

              : "oil-none";


      /*
        Card
      */

      const card =
        document.createElement("div");


      card.className =
        "vehicle-card"

        +

        (
          t &&
          t.overall_status ===
          "abnormal"

            ? " is-abnormal"

            : ""
        )

        +

        (
          oil.type ===
          "warning"

            ? " oil-warning"

            : ""
        )

        +

        (
          oil.type ===
          "danger"

            ? " oil-danger"

            : ""
        );


      card.innerHTML = `

        <div class="vehicle-top">

          <div class="plate">

            ${escapeHtml(
              v.full_plate ||
              v.plate4 ||
              ""
            )}

          </div>


          <div class="center">

            CENTER｜
            ${escapeHtml(
              v.center ||
              "未設定"
            )}

          </div>


          <div class="status ${statusClass}">

            ${statusText}

          </div>


          <div class="oil-status ${oilClass}">

            🛢️
            ${escapeHtml(
              oil.text
            )}

          </div>

        </div>


        <div class="vehicle-info">

          <div>

            最新里程

            <strong>

              ${
                latest

                  ? Number(
                      latest.mileage
                    ).toLocaleString()
                    + " km"

                  : "尚無資料"
              }

            </strong>

          </div>


          <div>

            最近巡檢

            <strong>

              ${
                latest

                  ? formatDateTime(
                      latest.reported_at
                    )

                  : "尚無紀錄"
              }

            </strong>

          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        () => openHistory(v)
      );


      vehicleList.appendChild(
        card
      );

    }

  );

}


/* ==========================================
   車輛詳細紀錄
========================================== */

async function openHistory(v){

  modalTitle.textContent =
    v.full_plate ||
    v.plate4 ||
    "";


  modalSubtitle.textContent =
    `CENTER｜${
      v.center ||
      "未設定"
    }　・　巡檢歷史紀錄`;


  renderOilPanel(v);


  historyContainer.innerHTML =
    '<div class="loading">載入歷史紀錄中…</div>';


  modal.classList.add(
    "show"
  );


  try{

    const r =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "vehicle_id",
          v.id
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(r.error){

      throw r.error;

    }


    const reports =
      r.data || [];


    if(!reports.length){

      historyContainer.innerHTML =
        '<div class="empty">尚無巡檢紀錄</div>';

      return;

    }


    historyContainer.innerHTML =
      "";


    reports.forEach(

      x => {

        const abnormal =
          x.overall_status ===
          "abnormal";


        const items =
          x.abnormal_items

            ? (
                Array.isArray(
                  x.abnormal_items
                )

                  ? x.abnormal_items.join(
                      "\n"
                    )

                  : String(
                      x.abnormal_items
                    )
              )

            : "";


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        card.innerHTML = `

          <div class="history-top">

            <div class="history-date">

              ${formatDateTime(
                x.reported_at
              )}

            </div>


            <div class="status ${
              abnormal
                ? "status-abnormal"
                : "status-normal"
            }">

              ${
                abnormal
                  ? "異常"
                  : "正常"
              }

            </div>

          </div>


          <div class="history-mileage">

            里程：
            ${Number(
              x.mileage || 0
            ).toLocaleString()}
            km

          </div>


          ${
            abnormal

              ? `

                <div class="history-abnormal">

                  <strong>
                    異常項目
                  </strong>

                  <br>

                  ${escapeHtml(
                    items ||
                    "未填寫異常說明"
                  )}

                </div>

              `

              : `

                <div class="history-normal">

                  本次巡檢全部正常

                </div>

              `
          }

        `;


        historyContainer.appendChild(
          card
        );

      }

    );

  }

  catch(e){

    historyContainer.innerHTML = `

      <div class="empty">

        歷史紀錄讀取失敗

        <br><br>

        ${escapeHtml(
          e.message ||
          "未知錯誤"
        )}

      </div>

    `;

  }

}


/* ==========================================
   機油面板
========================================== */

function renderOilPanel(v){

  const o =
    oilStatus(v);


  const color =
    o.type === "danger"

      ? "var(--danger)"

      : o.type === "warning"

        ? "var(--yellow)"

        : o.type === "normal"

          ? "var(--green)"

          : "var(--gray)";


  oilPanel.innerHTML = `

    <div class="oil-panel">

      <div class="oil-panel-title">

        🛢️ 機油保養

      </div>


      <div class="oil-panel-info">

        CENTER：
        <strong>
          ${escapeHtml(
            v.center ||
            "未設定"
          )}
        </strong>

        <br>


        上次換油里程：
        <strong>

          ${
            o.last !== null

              ? Number(
                  o.last
                ).toLocaleString()
                + " km"

              : "尚未設定"
          }

        </strong>

        <br>


        目前里程：
        <strong>

          ${
            o.current !== null

              ? Number(
                  o.current
                ).toLocaleString()
                + " km"

              : "尚無巡檢里程"
          }

        </strong>

        <br>


        換油週期：
        <strong>

          ${OIL_INTERVAL.toLocaleString()}
          km

        </strong>

      </div>


      <div
        class="oil-panel-status"
        style="color:${color}"
      >

        ${escapeHtml(
          o.text
        )}

      </div>


      <button
        class="oil-action"
        onclick="confirmOilChange('${v.id}')"
      >

        🔧 已更換機油

      </button>

    </div>

  `;

}


/* ==========================================
   確認換油
========================================== */

async function confirmOilChange(id){

  const v =
    vehicles.find(
      x => x.id === id
    );


  const latest =
    v &&
    latestReport(v);


  if(
    !v ||
    !latest
  ){

    alert(
      "這台車目前沒有巡檢里程，無法設定換油基準。"
    );

    return;

  }


  const mileage =
    Number(
      latest.mileage || 0
    );


  const confirmed =
    confirm(

      `確認已更換機油？

CENTER：${
        v.center ||
        "未設定"
      }

目前里程：${
        mileage.toLocaleString()
      } km

系統會以 ${
        mileage.toLocaleString()
      } km 作為下一次換油基準。`

    );


  if(!confirmed){

    return;

  }


  try{

    const r =
      await db
        .from("vehicles")
        .update({

          last_oil_change_mileage:
            mileage

        })
        .eq(
          "id",
          id
        );


    if(r.error){

      throw r.error;

    }


    /*
      更新畫面資料
    */

    v.last_oil_change_mileage =
      mileage;


    renderOilPanel(v);

    renderVehicles();


    alert(

      `完成！

下一次換油里程：
${
        (
          mileage +
          OIL_INTERVAL
        ).toLocaleString()
      } km`

    );

  }

  catch(e){

    alert(
      "更新失敗：\n" +
      (
        e.message ||
        "未知錯誤"
      )
    );

  }

}


/* ==========================================
   日期格式
========================================== */

function formatDateTime(v){

  if(!v){

    return "尚無紀錄";

  }


  const d =
    new Date(v);


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return "日期錯誤";

  }


  return d.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* ==========================================
   HTML 安全處理
========================================== */

function escapeHtml(v){

  return String(v)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================
   事件
========================================== */


/* 搜尋 */

searchInput.addEventListener(
  "input",
  renderVehicles
);


/* 點未巡檢 */

pendingCard.addEventListener(
  "click",
  () => openQuickList(
    "pending"
  )
);


/* 點今日異常 */

abnormalCard.addEventListener(
  "click",
  () => openQuickList(
    "abnormal"
  )
);


/* 關閉快速列表 */

closeQuickModal.addEventListener(
  "click",
  () => {

    quickModal.classList.remove(
      "show"
    );

  }
);


/* 點背景關閉 */

quickModal.addEventListener(
  "click",
  e => {

    if(
      e.target === quickModal
    ){

      quickModal.classList.remove(
        "show"
      );

    }

  }
);


/* 關閉詳細紀錄 */

closeModal.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );

  }
);


/* 點背景關閉詳細紀錄 */

modal.addEventListener(
  "click",
  e => {

    if(
      e.target === modal
    ){

      modal.classList.remove(
        "show"
      );

    }

  }
);


/* ==========================================
   啟動
========================================== */

loadData();

</script>
