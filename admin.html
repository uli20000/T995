<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e8">
<title>KFC｜車輛巡檢後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#c8102e;
  --black:#242424;
  --gray:#77736d;
  --linen:#f4f0e8;
  --paper:#fff;
  --line:#ddd8ce;
  --green:#356b4b;
  --green-bg:#eef5f0;
  --danger:#b42318;
  --danger-bg:#fff0ee;
  --yellow:#9a6b00;
  --yellow-bg:#fff8df;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--linen);
  color:var(--black);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
  text-align:center;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
.page{width:100%;max-width:900px;margin:auto;padding-bottom:60px}

.header{
  background:var(--paper);
  padding:28px 20px 24px;
  border-bottom:1px solid var(--line);
}
.eyebrow{color:var(--gray);font-size:12px;letter-spacing:4px;margin-bottom:8px}
.title-row{display:flex;justify-content:center;align-items:center;gap:14px}
.title{margin:0;font-size:32px;font-weight:800}
.kfc{color:var(--red);font-size:27px;font-weight:900}
.date{margin-top:9px;color:var(--gray);font-size:14px}

.section{padding:20px 16px 0}
.section-title{margin-bottom:12px;font-size:20px;font-weight:800}

.summary{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
}
.summary-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px 7px;
}
.summary-card.clickable{cursor:pointer}
.summary-label{color:var(--gray);font-size:13px;margin-bottom:7px}
.summary-number{font-size:29px;font-weight:800}
.summary-card.done .summary-number{color:var(--green)}
.summary-card.abnormal .summary-number{color:var(--danger)}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
.action-btn{
  height:48px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  font-size:15px;
  font-weight:700;
}
.action-btn.danger{
  color:var(--danger);
  border-color:#e1b4af;
  background:#fffafa;
}
.action-btn:disabled{opacity:.55}

.search-box{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
}
.search-input{
  width:100%;
  height:52px;
  border:2px solid #d8d3ca;
  border-radius:13px;
  padding:0 15px;
  font-size:18px;
  text-align:center;
  outline:none;
}
.search-input:focus{border-color:var(--red)}

.vehicle-list{display:flex;flex-direction:column;gap:10px}
.vehicle-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  cursor:pointer;
  transition:.12s;
}
.vehicle-card:active{transform:scale(.99)}
.vehicle-card.has-unresolved{border:2px solid var(--danger);background:#fffafa}
.vehicle-card.is-abnormal{border:2px solid #e2aaa4;background:#fffafa}
.vehicle-card.oil-warning{border:2px solid #e1c66e;background:#fffdf5}
.vehicle-card.oil-danger{border:2px solid #d9958d;background:#fffafa}

.vehicle-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}
.plate{font-size:22px;font-weight:800;letter-spacing:1px}
.center{font-size:14px;color:var(--gray);font-weight:700}

.status,.oil-status,.badge{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
}
.status-normal,.oil-normal{background:var(--green-bg);color:var(--green)}
.status-abnormal,.oil-danger{background:var(--danger-bg);color:var(--danger)}
.status-none,.oil-none{background:#f1eee8;color:var(--gray)}
.oil-warning{background:var(--yellow-bg);color:var(--yellow)}
.priority-badge{padding:5px 11px;border-radius:20px;background:var(--danger);color:#fff;font-size:12px;font-weight:800}
.unresolved-badge{padding:6px 12px;border-radius:20px;background:var(--danger-bg);color:var(--danger);font-size:13px;font-weight:800}

.vehicle-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:14px;
  gap:8px;
  color:var(--gray);
  font-size:14px;
}
.vehicle-info>div{padding:7px 3px}
.vehicle-info strong{display:block;margin-top:4px;color:var(--black);font-size:15px}

.empty,.loading{
  padding:38px 18px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:17px;
  color:var(--gray);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:1000;
}
.modal.show{display:flex}
.modal-content{
  width:100%;
  max-width:700px;
  max-height:91vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:24px 24px 0 0;
  padding:23px 17px 34px;
}
.modal-title{font-size:24px;font-weight:800}
.modal-subtitle{margin-top:5px;color:var(--gray);font-size:14px}

.quick-list,.history{display:flex;flex-direction:column;gap:10px;margin-top:17px}
.quick-item{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  background:#faf9f6;
  cursor:pointer;
}
.quick-plate{font-size:21px;font-weight:800}
.quick-center{margin-top:4px;color:var(--gray);font-size:14px}
.quick-detail{
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:#fff;
  color:var(--gray);
  font-size:14px;
  line-height:1.6;
}

.oil-panel{
  margin-top:17px;
  padding:17px;
  border-radius:17px;
  background:#faf9f6;
  border:1px solid var(--line);
}
.oil-panel-title{font-size:17px;font-weight:800;margin-bottom:9px}
.oil-panel-info{color:var(--gray);font-size:14px;line-height:1.8}
.oil-panel-status{margin-top:9px;font-size:17px;font-weight:800}
.oil-action{
  width:100%;
  height:48px;
  margin-top:12px;
  border:0;
  border-radius:13px;
  background:var(--red);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

.history-card{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  background:#faf9f6;
}
.history-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}
.history-date{font-size:14px;color:var(--gray)}
.history-mileage{margin-top:11px;font-size:17px;font-weight:800}
.history-normal{
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  font-weight:700;
}
.history-abnormal{
  margin-top:9px;
  padding:11px;
  border-radius:10px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
}
.unresolved-box{
  margin-top:10px;
  padding:12px;
  border-radius:11px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.7;
}
.resolution-note{
  width:100%;
  min-height:82px;
  margin-top:10px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:11px;
  resize:vertical;
  text-align:center;
  font-size:15px;
  outline:none;
}
.resolve-btn{
  width:100%;
  height:47px;
  margin-top:9px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font-size:16px;
  font-weight:800;
}
.resolved-box{
  margin-top:10px;
  padding:12px;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  line-height:1.8;
}
.close-btn{
  width:100%;
  height:50px;
  margin-top:18px;
  border:0;
  border-radius:14px;
  background:var(--black);
  color:#fff;
  font-size:16px;
  font-weight:700;
}

@media(max-width:700px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .summary-card:first-child{grid-column:span 2}
  .summary-number{font-size:27px}
  .title{font-size:28px}
  .kfc{font-size:24px}
  .action-row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="page">

<header class="header">
  <div class="eyebrow">KFC DELIVERY CENTER</div>
  <div class="title-row">
    <h1 class="title">車輛巡檢後台</h1>
    <div class="kfc">KFC</div>
  </div>
  <div id="todayDate" class="date"></div>
</header>

<section class="section">

  <div class="section-title">今日巡檢</div>

  <div class="summary">

    <div class="summary-card">
      <div class="summary-label">車輛總數</div>
      <div id="totalCount" class="summary-number">—</div>
    </div>

    <div class="summary-card done">
      <div class="summary-label">已巡檢</div>
      <div id="doneCount" class="summary-number">—</div>
    </div>

    <div id="unresolvedCard" class="summary-card abnormal clickable">
      <div class="summary-label">待處理異常</div>
      <div id="unresolvedCount" class="summary-number">—</div>
    </div>

    <div id="pendingCard" class="summary-card clickable">
      <div class="summary-label">未巡檢</div>
      <div id="pendingCount" class="summary-number">—</div>
    </div>

    <div id="abnormalCard" class="summary-card abnormal clickable">
      <div class="summary-label">今日異常</div>
      <div id="abnormalCount" class="summary-number">—</div>
    </div>

  </div>

  <div class="action-row">

    <button id="refreshBtn" class="action-btn">
      ↻ 重新整理資料
    </button>

    <button id="cleanupBtn" class="action-btn danger">
      🗑️ 清理 2 個月前巡檢資料
    </button>

  </div>

</section>

<section class="section">

  <div class="section-title">查詢車輛</div>

  <div class="search-box">
    <input
      id="searchInput"
      class="search-input"
      type="text"
      inputmode="text"
      placeholder="輸入車牌搜尋"
      autocomplete="off">
  </div>

</section>

<section class="section">

  <div class="section-title">車輛列表</div>

  <div id="vehicleList" class="vehicle-list">
    <div class="loading">載入車輛資料中…</div>
  </div>

</section>

</div>


<!-- 快速列表 -->

<div id="quickModal" class="modal">

  <div class="modal-content">

    <div id="quickModalTitle" class="modal-title"></div>

    <div id="quickModalSubtitle" class="modal-subtitle"></div>

    <div id="quickList" class="quick-list"></div>

    <button id="closeQuickModal" class="close-btn">
      關閉
    </button>

  </div>

</div>


<!-- 車輛詳細 -->

<div id="modal" class="modal">

  <div class="modal-content">

    <div id="modalTitle" class="modal-title"></div>

    <div id="modalSubtitle" class="modal-subtitle"></div>

    <div id="oilPanel"></div>

    <div id="history" class="history"></div>

    <button id="closeModal" class="close-btn">
      關閉
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const OIL_INTERVAL = 1500;
const OIL_WARNING_DISTANCE = 300;

const vehicleList =
  document.getElementById("vehicleList");

const searchInput =
  document.getElementById("searchInput");

const totalCount =
  document.getElementById("totalCount");

const doneCount =
  document.getElementById("doneCount");

const pendingCount =
  document.getElementById("pendingCount");

const abnormalCount =
  document.getElementById("abnormalCount");

const unresolvedCount =
  document.getElementById("unresolvedCount");

const pendingCard =
  document.getElementById("pendingCard");

const abnormalCard =
  document.getElementById("abnormalCard");

const unresolvedCard =
  document.getElementById("unresolvedCard");

const refreshBtn =
  document.getElementById("refreshBtn");

const cleanupBtn =
  document.getElementById("cleanupBtn");

const todayDate =
  document.getElementById("todayDate");

const quickModal =
  document.getElementById("quickModal");

const quickModalTitle =
  document.getElementById("quickModalTitle");

const quickModalSubtitle =
  document.getElementById("quickModalSubtitle");

const quickList =
  document.getElementById("quickList");

const closeQuickModal =
  document.getElementById("closeQuickModal");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalSubtitle =
  document.getElementById("modalSubtitle");

const oilPanel =
  document.getElementById("oilPanel");

const historyContainer =
  document.getElementById("history");

const closeModal =
  document.getElementById("closeModal");


let vehicles = [];
let allReports = [];
let todayReports = [];
let latestReports = [];
let unresolvedReports = [];


function updateDate(){

  todayDate.textContent =
    new Date().toLocaleDateString(
      "zh-TW",
      {
        year:"numeric",
        month:"long",
        day:"numeric",
        weekday:"long"
      }
    );

}

updateDate();


function getTodayRange(){

  const now = new Date();

  const start = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  const end = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + 1
  );

  return {
    start,
    end
  };

}


async function loadData(){

  vehicleList.innerHTML =
    '<div class="loading">載入資料中…</div>';

  try{

    const vehicleResult =
      await db
        .from("vehicles")
        .select("*")
        .eq("active",true)
        .order(
          "plate4",
          {ascending:true}
        );

    if(vehicleResult.error){
      throw vehicleResult.error;
    }

    vehicles =
      vehicleResult.data || [];

    if(!vehicles.length){

      allReports = [];
      todayReports = [];
      latestReports = [];
      unresolvedReports = [];

      updateSummary();
      renderVehicles();

      return;
    }

    const ids =
      vehicles.map(
        v => v.id
      );

    const reportResult =
      await db
        .from("inspection_reports")
        .select("*")
        .in(
          "vehicle_id",
          ids
        )
        .order(
          "reported_at",
          {ascending:false}
        );

    if(reportResult.error){
      throw reportResult.error;
    }

    allReports =
      reportResult.data || [];

    const {
      start,
      end
    } = getTodayRange();

    todayReports =
      allReports.filter(
        report => {

          const time =
            new Date(
              report.reported_at
            ).getTime();

          return (
            time >= start.getTime()
            &&
            time < end.getTime()
          );

        }
      );

    const latestMap =
      new Map();

    allReports.forEach(
      report => {

        if(
          !latestMap.has(
            report.vehicle_id
          )
        ){

          latestMap.set(
            report.vehicle_id,
            report
          );

        }

      }
    );

    latestReports =
      Array.from(
        latestMap.values()
      );

    unresolvedReports =
      allReports.filter(
        report =>
          report.overall_status === "abnormal"
          &&
          (
            report.resolution_status === "pending"
            ||
            report.resolution_status === null
            ||
            report.resolution_status === undefined
            ||
            report.resolution_status === ""
          )
      );

    updateSummary();
    renderVehicles();

  }catch(error){

    console.error(error);

    vehicleList.innerHTML = `
      <div class="empty">
        <strong>資料讀取失敗</strong>
        <br><br>
        ${escapeHtml(
          error.message || "未知錯誤"
        )}
      </div>
    `;

  }

}


function todayReport(vehicle){

  return (
    todayReports.find(
      r =>
        r.vehicle_id === vehicle.id
    )
    ||
    null
  );

}


function latestReport(vehicle){

  return (
    latestReports.find(
      r =>
        r.vehicle_id === vehicle.id
    )
    ||
    null
  );

}


function unresolvedForVehicle(vehicle){

  return unresolvedReports.filter(
    r =>
      r.vehicle_id === vehicle.id
  );

}


function oilStatus(vehicle){

  const latest =
    latestReport(vehicle);

  const current =
    latest
      ? Number(latest.mileage)
      : null;

  const last =
    vehicle.last_oil_change_mileage !== null
    &&
    vehicle.last_oil_change_mileage !== undefined
      ? Number(
          vehicle.last_oil_change_mileage
        )
      : null;

  if(
    last === null
    ||
    Number.isNaN(last)
  ){

    return {
      type:"none",
      text:"尚未設定換油基準",
      current,
      last:null,
      remaining:null
    };

  }

  if(
    current === null
    ||
    Number.isNaN(current)
  ){

    return {
      type:"none",
      text:"等待里程",
      current:null,
      last,
      remaining:null
    };

  }

  const remaining =
    OIL_INTERVAL -
    (
      current -
      last
    );

  if(remaining <= 0){

    return {
      type:"danger",
      text:
        `需要換油 ${Math.abs(remaining)} km`,
      current,
      last,
      remaining
    };

  }

  if(
    remaining <=
    OIL_WARNING_DISTANCE
  ){

    return {
      type:"warning",
      text:
        `即將換油，剩餘 ${remaining} km`,
      current,
      last,
      remaining
    };

  }

  return {
    type:"normal",
    text:
      `距離換油剩餘 ${remaining} km`,
    current,
    last,
    remaining
  };

}


function updateSummary(){

  const total =
    vehicles.length;

  const inspected =
    new Set(
      todayReports.map(
        r => r.vehicle_id
      )
    );

  const done =
    vehicles.filter(
      v => inspected.has(v.id)
    ).length;

  const pending =
    total - done;

  const abnormal =
    vehicles.filter(
      v => {

        const report =
          todayReport(v);

        return (
          report
          &&
          report.overall_status ===
            "abnormal"
        );

      }
    ).length;

  totalCount.textContent =
    total;

  doneCount.textContent =
    done;

  pendingCount.textContent =
    pending;

  abnormalCount.textContent =
    abnormal;

  unresolvedCount.textContent =
    unresolvedReports.length;

}


function vehiclePriority(vehicle){

  if(
    unresolvedForVehicle(vehicle).length
    >
    0
  ){

    return 1;

  }

  const oil =
    oilStatus(vehicle);

  if(
    oil.type === "danger"
  ){

    return 2;

  }

  const today =
    todayReport(vehicle);

  if(
    today
    &&
    today.overall_status ===
      "abnormal"
  ){

    return 3;

  }

  if(
    oil.type === "warning"
  ){

    return 4;

  }

  if(!today){

    return 5;

  }

  return 6;

}


function renderVehicles(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();

  let list =
    vehicles.filter(
      vehicle => {

        if(!keyword){
          return true;
        }

        return [
          vehicle.plate4,
          vehicle.full_plate,
          vehicle.center
        ]
        .filter(Boolean)
        .some(
          value =>
            String(value)
              .toLowerCase()
              .includes(keyword)
        );

      }
    );

  list.sort(
    (a,b) => {

      const p =
        vehiclePriority(a)
        -
        vehiclePriority(b);

      if(p !== 0){
        return p;
      }

      return String(
        a.plate4 || ""
      ).localeCompare(
        String(
          b.plate4 || ""
        )
      );

    }
  );

  if(!list.length){

    vehicleList.innerHTML =
      '<div class="empty">找不到符合的車輛</div>';

    return;
  }

  vehicleList.innerHTML = "";

  list.forEach(
    vehicle => {

      const today =
        todayReport(vehicle);

      const latest =
        latestReport(vehicle);

      const oil =
        oilStatus(vehicle);

      const unresolved =
        unresolvedForVehicle(
          vehicle
        );

      let statusClass =
        "status-none";

      let statusText =
        "今日未巡檢";

      if(today){

        if(
          today.overall_status ===
            "abnormal"
        ){

          statusClass =
            "status-abnormal";

          statusText =
            "今日異常";

        }else{

          statusClass =
            "status-normal";

          statusText =
            "今日正常";

        }

      }

      let oilClass =
        "oil-none";

      if(
        oil.type === "danger"
      ){

        oilClass =
          "oil-danger";

      }else if(
        oil.type === "warning"
      ){

        oilClass =
          "oil-warning";

      }else if(
        oil.type === "normal"
      ){

        oilClass =
          "oil-normal";

      }

      const card =
        document.createElement("div");

      card.className =
        "vehicle-card"
        +
        (
          unresolved.length
            ? " has-unresolved"
            : ""
        )
        +
        (
          today
          &&
          today.overall_status ===
            "abnormal"
            ? " is-abnormal"
            : ""
        )
        +
        (
          oil.type === "warning"
            ? " oil-warning"
            : ""
        )
        +
        (
          oil.type === "danger"
            ? " oil-danger"
            : ""
        );

      const priority =
        vehiclePriority(
          vehicle
        );

      card.innerHTML = `

        <div class="vehicle-top">

          ${
            priority === 1
              ? `
                <div class="priority-badge">
                  🔴 優先處理
                </div>
              `
              : ""
          }

          <div class="plate">
            ${escapeHtml(
              vehicle.full_plate ||
              vehicle.plate4 ||
              ""
            )}
          </div>

          <div class="center">
            CENTER｜
            ${escapeHtml(
              vehicle.center ||
              "未設定"
            )}
          </div>

          <div class="status ${statusClass}">
            ${statusText}
          </div>

          ${
            unresolved.length
              ? `
                <div class="unresolved-badge">
                  待處理異常
                  ${unresolved.length}
                  筆
                </div>
              `
              : ""
          }

          <div class="oil-status ${oilClass}">
            🛢️
            ${escapeHtml(oil.text)}
          </div>

        </div>

        <div class="vehicle-info">

          <div>
            最新里程
            <strong>
              ${
                latest
                  ? `${Number(
                      latest.mileage
                    ).toLocaleString()} km`
                  : "尚無紀錄"
              }
            </strong>
          </div>

          <div>
            最新巡檢
            <strong>
              ${
                latest
                  ? formatDateTime(
                      latest.reported_at
                    )
                  : "尚無紀錄"
              }
            </strong>
          </div>

        </div>
      `;

      card.addEventListener(
        "click",
        () =>
          openHistory(vehicle)
      );

      vehicleList.appendChild(
        card
      );

    }
  );

}


function openQuickList(type){

  let list = [];

  if(type === "pending"){

    list =
      vehicles.filter(
        v =>
          !todayReport(v)
      );

    quickModalTitle.textContent =
      "尚未巡檢車輛";

  }

  if(type === "abnormal"){

    list =
      vehicles.filter(
        v => {

          const r =
            todayReport(v);

          return (
            r
            &&
            r.overall_status ===
              "abnormal"
          );

        }
      );

    quickModalTitle.textContent =
      "今日異常車輛";

  }

  if(type === "unresolved"){

    list =
      vehicles.filter(
        v =>
          unresolvedForVehicle(v)
            .length > 0
      );

    quickModalTitle.textContent =
      "待處理異常車輛";

  }

  quickModalSubtitle.textContent =
    `共 ${list.length} 台｜點選車輛查看詳細紀錄`;

  quickList.innerHTML = "";

  if(!list.length){

    quickList.innerHTML = `
      <div class="empty">
        ${
          type === "pending"
            ? "目前沒有未巡檢車輛"
            : type === "abnormal"
              ? "目前沒有今日異常車輛"
              : "目前沒有待處理異常車輛"
        }
      </div>
    `;

  }else{

    list.forEach(
      vehicle => {

        const latest =
          latestReport(vehicle);

        const today =
          todayReport(vehicle);

        const unresolved =
          unresolvedForVehicle(
            vehicle
          )[0];

        const item =
          document.createElement("div");

        item.className =
          "quick-item";

        let detail = "";

        if(
          type === "unresolved"
          &&
          unresolved
        ){

          detail = `
            <div class="quick-detail">
              🔴
              ${escapeHtml(
                getAbnormalText(
                  unresolved
                )
              )}
              <br>
              發生時間：
              ${escapeHtml(
                formatDateTime(
                  unresolved.reported_at
                )
              )}
            </div>
          `;

        }else if(
          type === "abnormal"
          &&
          today
        ){

          detail = `
            <div class="quick-detail">
              🔴
              ${escapeHtml(
                getAbnormalText(
                  today
                )
              )}
              <br>
              里程：
              ${Number(
                today.mileage || 0
              ).toLocaleString()}
              km
            </div>
          `;

        }else{

          detail = `
            <div class="quick-detail">
              最新里程：
              ${
                latest
                  ? `${Number(
                      latest.mileage
                    ).toLocaleString()} km`
                  : "尚無紀錄"
              }
            </div>
          `;

        }

        item.innerHTML = `
          <div class="quick-plate">
            ${escapeHtml(
              vehicle.full_plate ||
              vehicle.plate4
            )}
          </div>

          <div class="quick-center">
            CENTER｜
            ${escapeHtml(
              vehicle.center ||
              "未設定"
            )}
          </div>

          ${detail}
        `;

        item.addEventListener(
          "click",
          () => {

            quickModal.classList.remove(
              "show"
            );

            openHistory(
              vehicle
            );

          }
        );

        quickList.appendChild(
          item
        );

      }
    );

  }

  quickModal.classList.add(
    "show"
  );

}


async function openHistory(
  vehicle
){

  modal.classList.add(
    "show"
  );

  modalTitle.textContent =
    vehicle.full_plate ||
    vehicle.plate4 ||
    "車輛";

  modalSubtitle.textContent =
    `CENTER｜${
      vehicle.center ||
      "未設定"
    }`;

  renderOilPanel(
    vehicle
  );

  historyContainer.innerHTML =
    '<div class="loading">讀取歷史紀錄中…</div>';

  try{

    const result =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "vehicle_id",
          vehicle.id
        )
        .order(
          "reported_at",
          {ascending:false}
        );

    if(result.error){
      throw result.error;
    }

    const reports =
      result.data || [];

    if(!reports.length){

      historyContainer.innerHTML = `
        <div class="empty">
          目前沒有巡檢紀錄
        </div>
      `;

      return;
    }

    historyContainer.innerHTML = "";

    reports.forEach(
      report => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "history-card";

        const abnormal =
          report.overall_status ===
            "abnormal";

        card.innerHTML = `

          <div class="history-top">

            <div class="history-date">
              ${escapeHtml(
                formatDateTime(
                  report.reported_at
                )
              )}
            </div>

            <div class="status ${
              abnormal
                ? "status-abnormal"
                : "status-normal"
            }">

              ${
                abnormal
                  ? "異常"
                  : "正常"
              }

            </div>

          </div>

          <div class="history-mileage">
            里程：
            ${Number(
              report.mileage || 0
            ).toLocaleString()}
            km
          </div>

          ${
            abnormal
              ? renderAbnormalHistory(
                  report
                )
              : `
                <div class="history-normal">
                  本次巡檢全部正常
                </div>
              `
          }

        `;

        historyContainer.appendChild(
          card
        );

      }
    );

  }catch(error){

    historyContainer.innerHTML = `
      <div class="empty">
        歷史紀錄讀取失敗
        <br><br>
        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}
      </div>
    `;

  }

}


function renderAbnormalHistory(
  report
){

  const text =
    getAbnormalText(
      report
    );

  if(
    report.resolution_status ===
      "resolved"
  ){

    return `

      <div class="history-abnormal">
        <strong>異常項目</strong>
        <br>
        ${escapeHtml(text)}
      </div>

      <div class="resolved-box">
        🟢 <strong>已解決</strong>
        <br>
        處理時間：
        ${escapeHtml(
          formatDateTime(
            report.resolved_at
          )
        )}

        ${
          report.resolution_note
            ? `
              <br>
              處理備註：
              ${escapeHtml(
                report.resolution_note
              )}
            `
            : ""
        }
      </div>

    `;

  }

  return `

    <div class="history-abnormal">
      <strong>異常項目</strong>
      <br>
      ${escapeHtml(text)}
    </div>

    <div class="unresolved-box">
      🔴 <strong>待處理異常</strong>
      <br>
      此異常尚未結案。
    </div>

    <textarea
      id="note-${report.id}"
      class="resolution-note"
      placeholder="處理備註，例如：已更換前輪胎、已調整煞車、已送修"></textarea>

    <button
      class="resolve-btn"
      onclick="resolveReport('${report.id}')">
      ✅ 標記已解決
    </button>

  `;

}


async function resolveReport(
  reportId
){

  const noteElement =
    document.getElementById(
      `note-${reportId}`
    );

  const note =
    noteElement
      ? noteElement.value.trim()
      : "";

  if(
    !confirm(
      "確認這筆異常已經處理完成嗎？"
    )
  ){

    return;

  }

  try{

    const result =
      await db
        .from("inspection_reports")
        .update({
          resolution_status:"resolved",
          resolved_at:
            new Date().toISOString(),
          resolution_note:
            note || null
        })
        .eq(
          "id",
          reportId
        );

    if(result.error){
      throw result.error;
    }

    alert(
      "✅ 已標記為解決"
    );

    await loadData();

    const report =
      allReports.find(
        r =>
          r.id === reportId
      );

    if(report){

      const vehicle =
        vehicles.find(
          v =>
            v.id ===
            report.vehicle_id
        );

      if(vehicle){

        await openHistory(
          vehicle
        );

      }

    }

  }catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}


function renderOilPanel(
  vehicle
){

  const oil =
    oilStatus(
      vehicle
    );

  let color =
    "var(--gray)";

  if(oil.type === "danger"){
    color =
      "var(--danger)";
  }else if(oil.type === "warning"){
    color =
      "var(--yellow)";
  }else if(oil.type === "normal"){
    color =
      "var(--green)";
  }

  oilPanel.innerHTML = `

    <div class="oil-panel">

      <div class="oil-panel-title">
        🛢️ 機油保養
      </div>

      <div class="oil-panel-info">

        CENTER：
        <strong>
          ${escapeHtml(
            vehicle.center ||
            "未設定"
          )}
        </strong>

        <br>

        上次換油里程：
        <strong>
          ${
            oil.last !== null
              ? `${oil.last.toLocaleString()} km`
              : "尚未設定"
          }
        </strong>

        <br>

        目前里程：
        <strong>
          ${
            oil.current !== null
              ? `${oil.current.toLocaleString()} km`
              : "尚無巡檢里程"
          }
        </strong>

        <br>

        換油週期：
        <strong>
          ${OIL_INTERVAL.toLocaleString()} km
        </strong>

      </div>

      <div
        class="oil-panel-status"
        style="color:${color}">
        ${escapeHtml(
          oil.text
        )}
      </div>

      <button
        class="oil-action"
        onclick="confirmOilChange('${vehicle.id}')">

        🔧 已更換機油

      </button>

    </div>

  `;

}


async function confirmOilChange(
  vehicleId
){

  const vehicle =
    vehicles.find(
      v =>
        v.id ===
        vehicleId
    );

  const latest =
    vehicle
      ? latestReport(vehicle)
      : null;

  if(
    !vehicle ||
    !latest
  ){

    alert(
      "這台車目前沒有巡檢里程，無法設定換油基準。"
    );

    return;
  }

  const mileage =
    Number(
      latest.mileage || 0
    );

  if(
    !confirm(
      `確認已更換機油？

CENTER：
${vehicle.center || "未設定"}

目前里程：
${mileage.toLocaleString()} km

系統會以此里程作為新的換油基準。`
    )
  ){

    return;

  }

  try{

    const result =
      await db
        .from("vehicles")
        .update({
          last_oil_change_mileage:
            mileage
        })
        .eq(
          "id",
          vehicleId
        );

    if(result.error){
      throw result.error;
    }

    vehicle.last_oil_change_mileage =
      mileage;

    renderOilPanel(
      vehicle
    );

    renderVehicles();

    alert(
      `完成！

下一次換油里程：
${
  (
    mileage +
    OIL_INTERVAL
  ).toLocaleString()
} km`
    );

  }catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}


/* =========================
   清理 2 個月前資料
========================= */

async function cleanupOldReports(){

  const cutoff =
    new Date();

  cutoff.setMonth(
    cutoff.getMonth() - 2
  );

  try{

    const countResult =
      await db
        .from("inspection_reports")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .lt(
          "reported_at",
          cutoff.toISOString()
        );

    if(countResult.error){
      throw countResult.error;
    }

    const count =
      countResult.count || 0;

    if(count === 0){

      alert(
        "目前沒有 2 個月以前的巡檢資料。"
      );

      return;
    }

    const confirmed =
      confirm(
        `確定要清理嗎？

將刪除：
${count} 筆

範圍：
${cutoff.toLocaleDateString("zh-TW")} 以前的巡檢資料

只會刪除巡檢紀錄，
不會刪除車輛資料，
也不會刪除換油基準。`
      );

    if(!confirmed){
      return;
    }

    cleanupBtn.disabled = true;
    cleanupBtn.textContent =
      "🗑️ 清理中…";

    const result =
      await db.rpc(
        "cleanup_old_inspection_reports"
      );

    if(result.error){
      throw result.error;
    }

    const deleted =
      result.data &&
      result.data.deleted_count !== undefined
        ? result.data.deleted_count
        : count;

    alert(
      `清理完成！

已刪除：
${deleted} 筆巡檢資料`
    );

    await loadData();

  }catch(error){

    alert(
      "清理失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }finally{

    cleanupBtn.disabled = false;
    cleanupBtn.textContent =
      "🗑️ 清理 2 個月前巡檢資料";

  }

}


function getAbnormalText(
  report
){

  if(
    !report ||
    !report.abnormal_items
  ){

    return "異常未填寫";

  }

  if(
    Array.isArray(
      report.abnormal_items
    )
  ){

    return report.abnormal_items.join(
      "、"
    );

  }

  return String(
    report.abnormal_items
  );

}


function formatDateTime(
  value
){

  if(!value){
    return "尚無紀錄";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "日期錯誤";

  }

  return date.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
