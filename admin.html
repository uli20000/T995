<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e8">
<title>KFC｜車輛巡檢後台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#c8102e;
  --black:#242424;
  --gray:#77736d;
  --linen:#f4f0e8;
  --paper:#fff;
  --line:#ddd8ce;
  --green:#356b4b;
  --green-bg:#eef5f0;
  --danger:#b42318;
  --danger-bg:#fff0ee;
  --yellow:#9a6b00;
  --yellow-bg:#fff8df;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--linen);
  color:var(--black);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Helvetica Neue",
    Arial,
    sans-serif;
  text-align:center;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.page{
  width:100%;
  max-width:900px;
  margin:auto;
  padding-bottom:50px;
}

/* =========================
   Header
========================= */

.header{
  background:var(--paper);
  padding:30px 20px 26px;
  border-bottom:1px solid var(--line);
}

.eyebrow{
  color:var(--gray);
  font-size:12px;
  letter-spacing:4px;
  margin-bottom:8px;
}

.title-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
}

.title{
  margin:0;
  font-size:34px;
  font-weight:800;
}

.kfc{
  color:var(--red);
  font-size:28px;
  font-weight:900;
}

.date{
  margin-top:10px;
  color:var(--gray);
  font-size:14px;
}

/* =========================
   Section
========================= */

.section{
  padding:22px 16px 0;
}

.section-title{
  margin-bottom:14px;
  font-size:20px;
  font-weight:800;
}

/* =========================
   Summary
========================= */

.summary{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.summary-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 8px;
}

.summary-card.clickable{
  cursor:pointer;
  transition:.12s;
}

.summary-card.clickable:active{
  transform:scale(.98);
}

.summary-label{
  color:var(--gray);
  font-size:13px;
  margin-bottom:8px;
}

.summary-number{
  font-size:30px;
  font-weight:800;
}

.summary-card.done .summary-number{
  color:var(--green);
}

.summary-card.abnormal .summary-number{
  color:var(--danger);
}

/* =========================
   Search
========================= */

.search-box{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}

.search-input{
  width:100%;
  height:54px;
  border:2px solid #d8d3ca;
  border-radius:14px;
  padding:0 16px;
  font-size:18px;
  text-align:center;
  outline:none;
}

.search-input:focus{
  border-color:var(--red);
}

/* =========================
   Refresh
========================= */

.refresh-btn{
  width:100%;
  height:46px;
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  color:var(--black);
  font-size:15px;
  font-weight:700;
}

.refresh-btn:disabled{
  opacity:.6;
}

/* =========================
   Vehicle List
========================= */

.vehicle-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.vehicle-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  text-align:center;
  transition:.12s;
}

.vehicle-card:active{
  transform:scale(.99);
}

.vehicle-card.has-unresolved{
  border:2px solid var(--danger);
  background:#fffafa;
}

.vehicle-card.is-abnormal{
  border:2px solid #e2aaa4;
  background:#fffafa;
}

.vehicle-card.oil-warning{
  border:2px solid #e1c66e;
  background:#fffdf5;
}

.vehicle-card.oil-danger{
  border:2px solid #d9958d;
  background:#fffafa;
}

.vehicle-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.plate{
  font-size:22px;
  font-weight:800;
  letter-spacing:1px;
}

.center{
  font-size:14px;
  color:var(--gray);
  font-weight:700;
}

.status,
.oil-status{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:6px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.status-normal,
.oil-normal{
  background:var(--green-bg);
  color:var(--green);
}

.status-abnormal,
.oil-danger{
  background:var(--danger-bg);
  color:var(--danger);
}

.status-none,
.oil-none{
  background:#f1eee8;
  color:var(--gray);
}

.oil-warning{
  background:var(--yellow-bg);
  color:var(--yellow);
}

.unresolved-badge{
  margin-top:6px;
  padding:6px 12px;
  border-radius:20px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:13px;
  font-weight:800;
}

.priority-badge{
  padding:5px 11px;
  border-radius:20px;
  background:var(--danger);
  color:#fff;
  font-size:12px;
  font-weight:800;
}

.vehicle-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:15px;
  gap:8px;
  color:var(--gray);
  font-size:14px;
}

.vehicle-info>div{
  padding:8px 4px;
}

.vehicle-info strong{
  display:block;
  margin-top:4px;
  color:var(--black);
  font-size:15px;
}

/* =========================
   Empty / Loading
========================= */

.empty,
.loading{
  padding:40px 20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  color:var(--gray);
}

/* =========================
   Modal
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:25px 25px 0 0;
  padding:24px 18px 35px;
}

.modal-title{
  font-size:25px;
  font-weight:800;
}

.modal-subtitle{
  color:var(--gray);
  margin-top:5px;
  font-size:14px;
}

/* =========================
   Quick List
========================= */

.quick-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}

.quick-item{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:#faf9f6;
  cursor:pointer;
}

.quick-item:active{
  transform:scale(.99);
}

.quick-plate{
  font-size:21px;
  font-weight:800;
}

.quick-center{
  margin-top:5px;
  color:var(--gray);
  font-size:14px;
}

.quick-detail{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#fff;
  color:var(--gray);
  font-size:14px;
  line-height:1.6;
}

/* =========================
   Oil
========================= */

.oil-panel{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#faf9f6;
  border:1px solid var(--line);
}

.oil-panel-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px;
}

.oil-panel-info{
  color:var(--gray);
  font-size:14px;
  line-height:1.8;
}

.oil-panel-status{
  margin-top:10px;
  font-size:17px;
  font-weight:800;
}

.oil-action{
  width:100%;
  height:50px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

/* =========================
   History
========================= */

.history{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}

.history-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:#faf9f6;
}

.history-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.history-date{
  font-size:14px;
  color:var(--gray);
}

.history-mileage{
  margin-top:12px;
  font-size:18px;
  font-weight:800;
}

.history-normal{
  margin-top:10px;
  padding:10px;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  font-weight:700;
}

.history-abnormal{
  margin-top:10px;
  padding:12px;
  border-radius:11px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
}

.unresolved-box{
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.7;
}

.resolution-note{
  width:100%;
  min-height:90px;
  margin-top:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  resize:vertical;
  text-align:center;
  font-size:15px;
  outline:none;
  background:#fff;
}

.resolution-note:focus{
  border-color:var(--red);
}

.resolve-btn{
  width:100%;
  height:48px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

.resolved-box{
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  line-height:1.8;
}

/* =========================
   Close
========================= */

.close-btn{
  width:100%;
  height:52px;
  margin-top:20px;
  border:0;
  border-radius:15px;
  background:var(--black);
  color:#fff;
  font-size:17px;
  font-weight:700;
}

/* =========================
   Mobile
========================= */

@media(max-width:700px){

  .summary{
    grid-template-columns:repeat(2,1fr);
  }

  .summary-card:first-child{
    grid-column:span 2;
  }

  .summary-number{
    font-size:27px;
  }

  .title{
    font-size:28px;
  }

  .kfc{
    font-size:24px;
  }

  .plate{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="header">

    <div class="eyebrow">

    </div>

    <div class="title-row">

      <h1 class="title">
        車輛巡檢後台
      </h1>

      <div class="kfc">
        KFC
      </div>

    </div>

    <div
      id="todayDate"
      class="date">
    </div>

  </header>


  <!-- =====================
       今日巡檢
  ====================== -->

<!-- =========================
     快速列表 Modal
========================= -->

<div

    <div

  </div>

</div>


<!-- =========================
     詳細資料 Modal
========================= -->

<div
  id="modal"
  class="modal">

  <div class="modal-content">

    <div
      id="modalTitle"
      class="modal-title">
    </div>

    <div
      id="modalSubtitle"
      class="modal-subtitle">
    </div>

    <div id="oilPanel"></div>

    <div

    </div>

    <button

<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   系統設定
===================================================== */

const OIL_INTERVAL = 1500;

const OIL_WARNING_DISTANCE = 300;


/* =====================================================
   DOM
===================================================== */

const vehicleList =
  document.getElementById(
    "vehicleList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const totalCount =
  document.getElementById(
    "totalCount"
  );

const doneCount =
  document.getElementById(
    "doneCount"
  );

const pendingCount =
  document.getElementById(
    "pendingCount"
  );

const abnormalCount =
  document.getElementById(
    "abnormalCount"
  );

const unresolvedCount =
  document.getElementById(
    "unresolvedCount"
  );

const pendingCard =
  document.getElementById(
    "pendingCard"
  );

const abnormalCard =
  document.getElementById(
    "abnormalCard"
  );

const unresolvedCard =
  document.getElementById(
    "unresolvedCard"
  );

const refreshBtn =
  document.getElementById(
    "refreshBtn"
  );

const todayDate =
  document.getElementById(
    "todayDate"
  );


/* Quick Modal */

const quickModal =
  document.getElementById(
    "quickModal"
  );

const quickModalTitle =
  document.getElementById(
    "quickModalTitle"
  );

const quickModalSubtitle =
  document.getElementById(
    "quickModalSubtitle"
  );

const quickList =
  document.getElementById(
    "quickList"
  );

const closeQuickModal =
  document.getElementById(
    "closeQuickModal"
  );


/* Detail Modal */

const modal =
  document.getElementById(
    "modal"
  );

const modalTitle =
  document.getElementById(
    "modalTitle"
  );

const modalSubtitle =
  document.getElementById(
    "modalSubtitle"
  );

const oilPanel =
  document.getElementById(
    "oilPanel"
  );

const historyContainer =
  document.getElementById(
    "history"
  );

const closeModal =
  document.getElementById(
    "closeModal"
  );


/* =====================================================
   全域資料
===================================================== */

let vehicles = [];

let allReports = [];

let todayReports = [];

let latestReports = [];

let unresolvedReports = [];


/* =====================================================
   日期
===================================================== */

function getTodayRange(){

  const now =
    new Date();

  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const end =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1
    );

  return {
    start,
    end
  };

}


function updateDate(){

  todayDate.textContent =
    new Date().toLocaleDateString(
      "zh-TW",
      {
        year:"numeric",
        month:"long",
        day:"numeric",
        weekday:"long"
      }
    );

}

updateDate();


/* =====================================================
   載入資料
===================================================== */

async function loadData(){

  vehicleList.innerHTML =
    '<div class="loading">載入資料中…</div>';

  try{

    /* =========================
       1. 車輛
    ========================= */

    const vehicleResult =
      await db
        .from("vehicles")
        .select("*")
        .eq("active", true)
        .order(
          "plate4",
          {
            ascending:true
          }
        );


    if(vehicleResult.error){

      throw vehicleResult.error;

    }


    vehicles =
      vehicleResult.data || [];


    /* =========================
       沒有車輛
    ========================= */

    if(!vehicles.length){

      allReports = [];

      todayReports = [];

      latestReports = [];

      unresolvedReports = [];

      updateSummary();

      renderVehicles();

      return;

    }


    const vehicleIds =
      vehicles.map(
        vehicle => vehicle.id
      );


    /* =========================
       2. 巡檢資料
    ========================= */

    const reportResult =
      await db
        .from("inspection_reports")
        .select("*")
        .in(
          "vehicle_id",
          vehicleIds
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(reportResult.error){

      throw reportResult.error;

    }


    allReports =
      reportResult.data || [];


    /* =========================
       3. 今日巡檢
    ========================= */

    const {
      start,
      end
    } =
      getTodayRange();


    todayReports =
      allReports.filter(
        report => {

          const time =
            new Date(
              report.reported_at
            ).getTime();

          return (
            time >=
              start.getTime()
            &&
            time <
              end.getTime()
          );

        }
      );


    /* =========================
       4. 每台車最新紀錄
    ========================= */

    const latestMap =
      new Map();


    for(
      const report
      of allReports
    ){

      if(
        !latestMap.has(
          report.vehicle_id
        )
      ){

        latestMap.set(
          report.vehicle_id,
          report
        );

      }

    }


    latestReports =
      Array.from(
        latestMap.values()
      );


    /* =========================
       5. 待處理異常

       pending：
       尚未結案

       NULL：
       舊資料還沒有 resolution_status
       也要視為待處理
    ========================= */

    unresolvedReports =
      allReports.filter(
        report => {

          if(
            report.overall_status !==
            "abnormal"
          ){

            return false;

          }

          return (
            report.resolution_status ===
              "pending"
            ||
            report.resolution_status ===
              null
            ||
            report.resolution_status ===
              undefined
            ||
            report.resolution_status ===
              ""
          );

        }
      );


    updateSummary();

    renderVehicles();


  }catch(error){

    console.error(error);

    vehicleList.innerHTML = `

      <div class="empty">

        <strong>
          資料讀取失敗
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}

      </div>

    `;

  }

}


/* =====================================================
   今日紀錄
===================================================== */

function todayReport(
  vehicle
){

  return (
    todayReports.find(
      report =>
        report.vehicle_id ===
        vehicle.id
    )
    ||
    null
  );

}


/* =====================================================
   最新紀錄
===================================================== */

function latestReport(
  vehicle
){

  return (
    latestReports.find(
      report =>
        report.vehicle_id ===
        vehicle.id
    )
    ||
    null
  );

}


/* =====================================================
   待處理異常
===================================================== */

function unresolvedForVehicle(
  vehicle
){

  return unresolvedReports.filter(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


function latestUnresolved(
  vehicle
){

  const list =
    unresolvedForVehicle(
      vehicle
    );

  return list.length
    ? list[0]
    : null;

}


/* =====================================================
   機油狀態
===================================================== */

function oilStatus(
  vehicle
){

  const latest =
    latestReport(
      vehicle
    );


  const current =
    latest
      ? Number(
          latest.mileage
        )
      : null;


  const last =
    vehicle.last_oil_change_mileage !==
      null
    &&
    vehicle.last_oil_change_mileage !==
      undefined
      ? Number(
          vehicle.last_oil_change_mileage
        )
      : null;


  /* 尚未設定基準 */

  if(
    last === null
    ||
    Number.isNaN(last)
  ){

    return {

      type:"none",

      text:
        "尚未設定換油基準",

      current,

      last:null,

      remaining:null

    };

  }


  /* 沒有里程 */

  if(
    current === null
    ||
    Number.isNaN(current)
  ){

    return {

      type:"none",

      text:
        "等待里程",

      current:null,

      last,

      remaining:null

    };

  }


  const remaining =
    OIL_INTERVAL -
    (
      current -
      last
    );


  /* 到期 */

  if(
    remaining <= 0
  ){

    return {

      type:"danger",

      text:
        `需要換油 ${Math.abs(
          remaining
        )} km`,

      current,

      last,

      remaining

    };

  }


  /* 300 km 內 */

  if(
    remaining <=
    OIL_WARNING_DISTANCE
  ){

    return {

      type:"warning",

      text:
        `即將換油，剩餘 ${remaining} km`,

      current,

      last,

      remaining

    };

  }


  return {

    type:"normal",

    text:
      `距離換油剩餘 ${remaining} km`,

    current,

    last,

    remaining

  };

}


/* =====================================================
   統計
===================================================== */

function updateSummary(){

  const total =
    vehicles.length;


  const inspectedIds =
    new Set(
      todayReports.map(
        report =>
          report.vehicle_id
      )
    );


  const done =
    vehicles.filter(
      vehicle =>
        inspectedIds.has(
          vehicle.id
        )
    ).length;


  const pending =
    total -
    done;


  const abnormal =
    vehicles.filter(
      vehicle => {

        const report =
          todayReport(
            vehicle
          );

        return (
          report
          &&
          report.overall_status ===
            "abnormal"
        );

      }
    ).length;


  totalCount.textContent =
    total;

  doneCount.textContent =
    done;

  pendingCount.textContent =
    pending;

  abnormalCount.textContent =
    abnormal;

  unresolvedCount.textContent =
    unresolvedReports.length;

}


/* =====================================================
   車輛優先順序

   1. 待處理異常
   2. 換油到期
   3. 今日異常
   4. 換油警告
   5. 今日未巡檢
   6. 正常
===================================================== */

function vehiclePriority(
  vehicle
){

  if(
    unresolvedForVehicle(
      vehicle
    ).length > 0
  ){

    return 1;

  }


  const oil =
    oilStatus(
      vehicle
    );


  if(
    oil.type ===
    "danger"
  ){

    return 2;

  }


  const today =
    todayReport(
      vehicle
    );


  if(
    today
    &&
    today.overall_status ===
      "abnormal"
  ){

    return 3;

  }


  if(
    oil.type ===
    "warning"
  ){

    return 4;

  }


  if(!today){

    return 5;

  }


  return 6;

}

   車輛列表
===================================================== */

function renderVehicles(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  let list =
    vehicles.filter(
      vehicle => {

        if(!keyword){

          return true;

        }


        return [

          vehicle.plate4,

          vehicle.full_plate,

          vehicle.center

        ]
        .filter(Boolean)
        .some(
          value =>
            String(value)
              .toLowerCase()
              .includes(keyword)
        );

      }
    );


  list.sort(
    (a,b) => {

      const priority =
        vehiclePriority(a)
        -
        vehiclePriority(b);


      if(
        priority !== 0
      ){

        return priority;

      }


      return String(
        a.plate4 || ""
      ).localeCompare(
        String(
          b.plate4 || ""
        )
      );

    }
  );


  if(!list.length){

    vehicleList.innerHTML =
      '<div class="empty">找不到符合的車輛</div>';

    return;

  }


  vehicleList.innerHTML =
    "";


  list.forEach(
    vehicle => {

      const today =
        todayReport(
          vehicle
        );


      const latest =
        latestReport(
          vehicle
        );


      const oil =
        oilStatus(
          vehicle
        );


      const unresolved =
        unresolvedForVehicle(
          vehicle
        );


      let statusClass =
        "status-none";


      let statusText =
        "今日未巡檢";


      if(today){

        if(
          today.overall_status ===
            "abnormal"
        ){

          statusClass =
            "status-abnormal";

          statusText =
            "今日異常";

        }else{

          statusClass =
            "status-normal";

          statusText =
            "今日正常";

        }

      }


      let oilClass =
        "oil-none";


      if(
        oil.type ===
        "danger"
      ){

        oilClass =
          "oil-danger";

      }
      else if(
        oil.type ===
        "warning"
      ){

        oilClass =
          "oil-warning";

      }
      else if(
        oil.type ===
        "normal"
      ){

        oilClass =
          "oil-normal";

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "vehicle-card"

        (
          unresolved.length
            ? " has-unresolved"
            : ""
        )
        +
        (
          today
          &&
          today.overall_status ===
            "abnormal"
            ? " is-abnormal"
            : ""
        )
        +
        (
          oil.type ===
            "warning"
            ? " oil-warning"
            : ""
        )
        +
        (
          oil.type ===
            "danger"
            ? " oil-danger"
            : ""
        );


      const priority =
        vehiclePriority(
          vehicle
        );


      card.innerHTML = `

        <div class="vehicle-top">

          ${
            priority === 1
              ? `
                <div class="priority-badge">
                  🔴 優先處理
                </div>
              `
              : ""
          }


          <div class="plate">

            ${escapeHtml(
              vehicle.full_plate
              ||
              vehicle.plate4
              ||
              ""
            )}

          </div>


          <div class="center">

            CENTER｜
            ${escapeHtml(
              vehicle.center
              ||
              "未設定"
            )}

          </div>


          <div class="status ${statusClass}">

            ${statusText}

          </div>


          ${

async function openHistory(

){

    "show"

    vehicle.full_plate

    vehicle.plate4
    ||

        .eq(

        )
        .order(

                formatDateTime(
                  report.reported_at

              )}

                  report
                )

              : `

                <div class="history-normal">

                  本次巡檢全部正常

                </div>

              `
          }

        historyContainer.appendChild(

/* =====================================================
   異常內容
===================================================== */

function getAbnormalText(
  report
){

  if(
    !report
    ||
    !report.abnormal_items
  ){

    return "異常未填寫";

  }


  if(
    Array.isArray(
      report.abnormal_items
    )
  ){

    return report.abnormal_items.join(
      "、"
    );

  }


  return String(
    report.abnormal_items
  );

}


/* =====================================================
   標記已解決
===================================================== */

async function resolveReport(
  reportId
){

  const noteElement =
    document.getElementById(
      `note-${reportId}`
    );


  const note =
    noteElement
      ? noteElement.value.trim()
      : "";


  if(
    !confirm(
      "確認這筆異常已經處理完成嗎？"
    )
  ){

    return;

  }


  try{

    const result =
      await db
        .from(
          "inspection_reports"
        )
        .update({

          resolution_status:
            "resolved",

          resolved_at:
            new Date().toISOString(),

          resolution_note:
            note ||
            null

        })
        .eq(
          "id",
          reportId
        );


    if(result.error){

      throw result.error;

    }


    alert(
      "✅ 已標記為解決"
    );


    /*
      重新抓資料
      確保統計與待處理清單同步
    */

    await loadData();


    /*
      找回原本的車輛
    */

    const report =
      allReports.find(
        item =>
          item.id ===
          reportId
      );


    if(report){

      const vehicle =
        vehicles.find(
          item =>
            item.id ===
            report.vehicle_id
        );


      if(vehicle){

        await openHistory(
          vehicle
        );

      }

    }


  }catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}

===================================================== */

async function confirmOilChange(
  vehicleId
){

  const vehicle =
    vehicles.find(
      item =>
        item.id ===
        vehicleId
    );


  const latest =
    vehicle
      ? latestReport(
          vehicle
        )
      : null;


  if(
    !vehicle
    ||
    !latest
  ){

    alert(
      "這台車目前沒有巡檢里程，無法設定換油基準。"
    );

    return;

  }


  const mileage =
    Number(
      latest.mileage ||
      0
    );


  const confirmed =
    confirm(

      `確認已更換機油？

CENTER：
${
  vehicle.center ||
  "未設定"
}

目前里程：
${mileage.toLocaleString()} km

系統會以
${mileage.toLocaleString()} km
作為新的換油基準。`

    );


  if(!confirmed){

    return;

  }


  try{

      await db
        .from("vehicles")
        .update({

          last_oil_change_mileage:

        })
        .eq(

        );


    if(result.error){

    vehicle.last_oil_change_mileage =
      mileage;


    renderOilPanel(

    );

    alert(

下一次換油里程：
${

    mileage +

  ).toLocaleString()
} km`

  }catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}


/* =====================================================
   日期格式
===================================================== */

function formatDateTime(
  value
){

  if(!value){

    return "尚無紀錄";

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "日期錯誤";

  }


  return date.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   HTML 安全處理
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

  "click",
  () =>
    openQuickList(
      "abnormal"
    )
);


unresolvedCard.addEventListener(
  "click",
  () =>
    openQuickList(
      "unresolved"
    )
);


/* =====================================================
   重新整理
===================================================== */

refreshBtn.addEventListener(
  "click",
  async () => {

    refreshBtn.disabled =
      true;

    refreshBtn.textContent =
      "↻ 更新中…";


    await loadData();


    refreshBtn.disabled =
      false;

    refreshBtn.textContent =
      "↻ 重新整理資料";

  }
);


/* =====================================================
   關閉快速列表
===================================================== */

closeQuickModal.addEventListener(
  "click",
  () => {

    quickModal.classList.remove(
      "show"
    );

  }
);


quickModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      quickModal
    ){

      quickModal.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   關閉詳細資料
===================================================== */

closeModal.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );

  }
);


modal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      modal
    ){

      modal.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   啟動
===================================================== */

loadData();

</script>

</body>
</html>
