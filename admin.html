<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f0e8">
<title>KFC｜車輛巡檢後台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#c8102e;
  --black:#242424;
  --gray:#77736d;
  --linen:#f4f0e8;
  --paper:#fff;
  --line:#ddd8ce;
  --green:#356b4b;
  --green-bg:#eef5f0;
  --danger:#b42318;
  --danger-bg:#fff0ee;
  --yellow:#9a6b00;
  --yellow-bg:#fff8df;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--linen);
  color:var(--black);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Helvetica Neue",
    Arial,
    sans-serif;
  text-align:center
}

button,
input,
textarea{
  font-family:inherit
}

.page{
  width:100%;
  max-width:900px;
  margin:auto;
  padding-bottom:50px
}

/* =========================
   Header
========================= */

.header{
  background:var(--paper);
  padding:30px 20px 26px;
  border-bottom:1px solid var(--line);
  text-align:center
}

.eyebrow{
  color:var(--gray);
  font-size:12px;
  letter-spacing:4px;
  margin-bottom:8px
}

.title-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px
}

.title{
  margin:0;
  font-size:34px;
  font-weight:800
}

.kfc{
  color:var(--red);
  font-size:28px;
  font-weight:900
}

.date{
  margin-top:10px;
  color:var(--gray);
  font-size:14px
}

/* =========================
   Section
========================= */

.section{
  padding:22px 16px 0
}

.section-title{
  margin-bottom:14px;
  font-size:20px;
  font-weight:800
}

/* =========================
   Summary
========================= */

.summary{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px
}

.summary-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 8px
}

.summary-card.clickable{
  cursor:pointer;
  transition:.12s
}

.summary-card.clickable:active{
  transform:scale(.98);
  background:#faf8f3
}

.summary-label{
  color:var(--gray);
  font-size:13px;
  margin-bottom:8px
}

.summary-number{
  font-size:30px;
  font-weight:800
}

.summary-card.done .summary-number{
  color:var(--green)
}

.summary-card.abnormal .summary-number{
  color:var(--danger)
}

/* =========================
   Search
========================= */

.search-box{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px
}

.search-input{
  width:100%;
  height:54px;
  border:2px solid #d8d3ca;
  border-radius:14px;
  padding:0 16px;
  font-size:18px;
  text-align:center;
  outline:none
}

.search-input:focus{
  border-color:var(--red)
}

/* =========================
   Vehicle List
========================= */

.vehicle-list{
  display:flex;
  flex-direction:column;
  gap:10px
}

.vehicle-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  text-align:center;
  transition:.12s
}

.vehicle-card:active{
  transform:scale(.99)
}

.vehicle-card.is-abnormal{
  border:2px solid #e2aaa4;
  background:#fffafa
}

.vehicle-card.has-unresolved{
  border:2px solid var(--danger);
  background:#fffafa
}

.vehicle-card.oil-warning{
  border:2px solid #e1c66e;
  background:#fffdf5
}

.vehicle-card.oil-danger{
  border:2px solid #d9958d;
  background:#fffafa
}

.vehicle-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px
}

.plate{
  font-size:22px;
  font-weight:800;
  letter-spacing:1px
}

.center{
  font-size:14px;
  color:var(--gray);
  font-weight:700
}

.status,
.oil-status{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:6px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap
}

.status-normal,
.oil-normal{
  background:var(--green-bg);
  color:var(--green)
}

.status-abnormal,
.oil-danger{
  background:var(--danger-bg);
  color:var(--danger)
}

.status-none,
.oil-none{
  background:#f1eee8;
  color:var(--gray)
}

.oil-warning{
  background:var(--yellow-bg);
  color:var(--yellow)
}

.vehicle-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:15px;
  gap:8px;
  color:var(--gray);
  font-size:14px
}

.vehicle-info>div{
  padding:8px 4px
}

.vehicle-info strong{
  display:block;
  margin-top:4px;
  color:var(--black);
  font-size:15px
}

.unresolved-badge{
  margin-top:6px;
  padding:6px 12px;
  border-radius:20px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:13px;
  font-weight:800
}

/* =========================
   Empty / Loading
========================= */

.empty,
.loading{
  padding:40px 20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  color:var(--gray)
}

/* =========================
   Data Management
========================= */

.maintenance-box{
  margin-top:22px;
  padding:18px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px
}

.cleanup-btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:14px;
  background:#6b6258;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer
}

.cleanup-btn:active{
  transform:scale(.98)
}

.cleanup-hint{
  margin-top:8px;
  color:var(--gray);
  font-size:12px;
  line-height:1.6
}

/* =========================
   Modal
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:1000
}

.modal.show{
  display:flex
}

.modal-content{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:25px 25px 0 0;
  padding:24px 18px 35px
}

.modal-title{
  font-size:25px;
  font-weight:800
}

.modal-subtitle{
  color:var(--gray);
  margin-top:5px;
  font-size:14px
}

/* =========================
   Oil
========================= */

.oil-panel{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#faf9f6;
  border:1px solid var(--line)
}

.oil-panel-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px
}

.oil-panel-info{
  color:var(--gray);
  font-size:14px;
  line-height:1.8
}

.oil-panel-status{
  margin-top:10px;
  font-size:17px;
  font-weight:800
}

.oil-action{
  width:100%;
  height:50px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  font-size:16px;
  font-weight:800
}

/* =========================
   History
========================= */

.history{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px
}

.history-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:#faf9f6
}

.history-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px
}

.history-date{
  font-size:14px;
  color:var(--gray)
}

.history-mileage{
  margin-top:12px;
  font-size:18px;
  font-weight:800
}

.history-abnormal{
  margin-top:10px;
  padding:12px;
  border-radius:11px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap
}

.history-normal{
  margin-top:10px;
  padding:10px;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  font-weight:700
}

/* =========================
   Resolution
========================= */

.resolution-box{
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:#fff8df;
  color:var(--yellow);
  font-size:14px;
  line-height:1.6
}

.resolve-btn{
  width:100%;
  height:46px;
  margin-top:12px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#fff;
  font-size:16px;
  font-weight:800
}

.resolved-box{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  line-height:1.7
}

.resolution-note{
  width:100%;
  min-height:80px;
  margin-top:10px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  resize:vertical;
  text-align:center;
  font-size:15px;
  outline:none
}

.resolution-note:focus{
  border-color:var(--red)
}

/* =========================
   Close
========================= */

.close-btn{
  width:100%;
  height:52px;
  margin-top:20px;
  border:0;
  border-radius:15px;
  background:var(--black);
  color:#fff;
  font-size:17px;
  font-weight:700
}

/* =========================
   Mobile
========================= */

@media(max-width:700px){

  .summary{
    grid-template-columns:repeat(2,1fr)
  }

  .summary-card:first-child{
    grid-column:span 2
  }

  .summary-number{
    font-size:27px
  }

  .title{
    font-size:28px
  }

  .kfc{
    font-size:24px
  }

  .plate{
    font-size:20px
  }
}
</style>
</head>

<body>

<div class="page">

<header class="header">

  <div class="eyebrow">
    KFC DELIVERY CENTER
  </div>

  <div class="title-row">

    <h1 class="title">
      車輛巡檢後台
    </h1>

    <div class="kfc">
      KFC
    </div>

  </div>

  <div
    id="todayDate"
    class="date">
  </div>

</header>


<!-- =========================
     今日巡檢
========================= -->

<section class="section">

  <div class="section-title">
    今日巡檢
  </div>

  <div class="summary">

    <div class="summary-card">

      <div class="summary-label">
        車輛總數
      </div>

      <div
        id="totalCount"
        class="summary-number">
        —
      </div>

    </div>


    <div class="summary-card done">

      <div class="summary-label">
        已巡檢
      </div>

      <div
        id="doneCount"
        class="summary-number">
        —
      </div>

    </div>


    <div
      id="unresolvedCard"
      class="summary-card abnormal clickable">

      <div class="summary-label">
        待處理異常
      </div>

      <div
        id="unresolvedCount"
        class="summary-number">
        —
      </div>

    </div>


    <div
      id="pendingCard"
      class="summary-card clickable">

      <div class="summary-label">
        未巡檢
      </div>

      <div
        id="pendingCount"
        class="summary-number">
        —
      </div>

    </div>


    <div
      id="abnormalCard"
      class="summary-card abnormal clickable">

      <div class="summary-label">
        今日異常
      </div>

      <div
        id="abnormalCount"
        class="summary-number">
        —
      </div>

    </div>

  </div>

</section>


<!-- =========================
     搜尋
========================= -->

<section class="section">

  <div class="section-title">
    查詢車輛
  </div>

  <div class="search-box">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      inputmode="text"
      placeholder="輸入車牌搜尋"
      autocomplete="off">

  </div>

</section>


<!-- =========================
     車輛列表
========================= -->

<section class="section">

  <div class="section-title">
    車輛列表
  </div>

  <div
    id="vehicleList"
    class="vehicle-list">

    <div class="loading">
      載入車輛資料中…
    </div>

  </div>

</section>


<!-- =========================
     資料管理
========================= -->

<section class="section">

  <div class="maintenance-box">

    <div class="section-title">
      資料管理
    </div>

    <button
      id="cleanupButton"
      class="cleanup-btn">

      🗑️ 清理 2 個月前巡檢資料

    </button>

    <div class="cleanup-hint">

      只會刪除 inspection_reports。
      車輛、CENTER、換油資料不會刪除。

    </div>

  </div>

</section>

</div>


<!-- =========================
     快速列表
========================= -->

<div
  id="quickModal"
  class="modal">

  <div class="modal-content">

    <div
      id="quickModalTitle"
      class="modal-title">
    </div>

    <div
      id="quickModalSubtitle"
      class="modal-subtitle">
    </div>

    <div
      id="quickList"
      class="history">
    </div>

    <button
      id="closeQuickModal"
      class="close-btn">

      關閉

    </button>

  </div>

</div>


<!-- =========================
     車輛詳細
========================= -->

<div
  id="modal"
  class="modal">

  <div class="modal-content">

    <div
      id="modalTitle"
      class="modal-title">
    </div>

    <div
      id="modalSubtitle"
      class="modal-subtitle">
    </div>

    <div id="oilPanel"></div>

    <div
      id="history"
      class="history">
    </div>

    <button
      id="closeModal"
      class="close-btn">

      關閉

    </button>

  </div>

</div>


<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   系統設定
===================================================== */

const OIL_INTERVAL = 1500;

const OIL_WARNING_DISTANCE = 300;


/* =====================================================
   DOM
===================================================== */

const cleanupButton =
  document.getElementById(
    "cleanupButton"
  );

const vehicleList =
  document.getElementById(
    "vehicleList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const totalCount =
  document.getElementById(
    "totalCount"
  );

const doneCount =
  document.getElementById(
    "doneCount"
  );

const pendingCount =
  document.getElementById(
    "pendingCount"
  );

const abnormalCount =
  document.getElementById(
    "abnormalCount"
  );

const unresolvedCount =
  document.getElementById(
    "unresolvedCount"
  );

const unresolvedCard =
  document.getElementById(
    "unresolvedCard"
  );

const pendingCard =
  document.getElementById(
    "pendingCard"
  );

const abnormalCard =
  document.getElementById(
    "abnormalCard"
  );

const todayDate =
  document.getElementById(
    "todayDate"
  );


/* Quick Modal */

const quickModal =
  document.getElementById(
    "quickModal"
  );

const quickModalTitle =
  document.getElementById(
    "quickModalTitle"
  );

const quickModalSubtitle =
  document.getElementById(
    "quickModalSubtitle"
  );

const quickList =
  document.getElementById(
    "quickList"
  );

const closeQuickModal =
  document.getElementById(
    "closeQuickModal"
  );


/* Detail Modal */

const modal =
  document.getElementById(
    "modal"
  );

const modalTitle =
  document.getElementById(
    "modalTitle"
  );

const modalSubtitle =
  document.getElementById(
    "modalSubtitle"
  );

const oilPanel =
  document.getElementById(
    "oilPanel"
  );

const historyContainer =
  document.getElementById(
    "history"
  );

const closeModal =
  document.getElementById(
    "closeModal"
  );


/* =====================================================
   全域資料
===================================================== */

let vehicles = [];

let todayReports = [];

let latestReports = [];

let unresolvedReports = [];


/* =====================================================
   日期
===================================================== */

const now =
  new Date();

const todayStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

const tomorrowStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + 1
  );


todayDate.textContent =
  now.toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"long"
    }
  );


/* =====================================================
   載入資料
===================================================== */

async function loadData(){

  vehicleList.innerHTML =
    '<div class="loading">載入資料中…</div>';

  try{

    /* 車輛 */

    const vehicleResult =
      await db
        .from("vehicles")
        .select("*")
        .eq(
          "active",
          true
        )
        .order(
          "plate4",
          {
            ascending:true
          }
        );


    if(
      vehicleResult.error
    ){

      throw vehicleResult.error;

    }


    vehicles =
      vehicleResult.data || [];


    /* 今日巡檢 */

    const todayResult =
      await db
        .from("inspection_reports")
        .select("*")
        .gte(
          "reported_at",
          todayStart.toISOString()
        )
        .lt(
          "reported_at",
          tomorrowStart.toISOString()
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(
      todayResult.error
    ){

      throw todayResult.error;

    }


    todayReports =
      todayResult.data || [];


    /* 待處理異常 */

    const unresolvedResult =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "overall_status",
          "abnormal"
        )
        .eq(
          "resolution_status",
          "pending"
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(
      unresolvedResult.error
    ){

      throw unresolvedResult.error;

    }


    unresolvedReports =
      unresolvedResult.data || [];


    /* 每台車最新紀錄 */

    const results =
      await Promise.all(

        vehicles.map(

          async vehicle => {

            const result =
              await db
                .from(
                  "inspection_reports"
                )
                .select("*")
                .eq(
                  "vehicle_id",
                  vehicle.id
                )
                .order(
                  "reported_at",
                  {
                    ascending:false
                  }
                )
                .limit(1);


            if(
              result.error ||
              !result.data ||
              !result.data.length
            ){

              return null;

            }


            return result.data[0];

          }

        )

      );


    latestReports =
      results.filter(
        Boolean
      );


    updateSummary();

    renderVehicles();

  }

  catch(error){

    console.error(
      error
    );

    vehicleList.innerHTML = `

      <div class="empty">

        <strong>
          資料讀取失敗
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}

      </div>

    `;

  }

}


/* =====================================================
   上方統計
===================================================== */

function updateSummary(){

  const map =
    new Map();


  todayReports.forEach(

    report => {

      if(
        !map.has(
          report.vehicle_id
        )
      ){

        map.set(
          report.vehicle_id,
          report
        );

      }

    }

  );


  totalCount.textContent =
    vehicles.length;


  doneCount.textContent =
    map.size;


  pendingCount.textContent =
    Math.max(
      vehicles.length -
      map.size,
      0
    );


  let abnormal = 0;


  map.forEach(

    report => {

      if(
        report.overall_status ===
        "abnormal"
      ){

        abnormal++;

      }

    }

  );


  abnormalCount.textContent =
    abnormal;


  unresolvedCount.textContent =
    unresolvedReports.length;

}


/* =====================================================
   今日紀錄
===================================================== */

function todayReport(
  vehicle
){

  return todayReports.find(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


/* =====================================================
   最新紀錄
===================================================== */

function latestReport(
  vehicle
){

  return latestReports.find(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


/* =====================================================
   該車待處理異常
===================================================== */

function unresolvedForVehicle(
  vehicle
){

  return unresolvedReports.filter(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


/* =====================================================
   機油狀態
===================================================== */

function oilStatus(
  vehicle
){

  const latest =
    latestReport(
      vehicle
    );


  const current =
    latest
      ? Number(
          latest.mileage ||
          0
        )
      : null;


  const last =
    vehicle.last_oil_change_mileage;


  if(
    last === null ||
    last === undefined
  ){

    return {
      type:"none",
      text:"尚未設定換油基準",
      current,
      last:null,
      remaining:null
    };

  }


  if(
    current === null
  ){

    return {
      type:"none",
      text:"等待里程",
      current,
      last:Number(last),
      remaining:null
    };

  }


  const remaining =
    OIL_INTERVAL -
    (
      current -
      Number(last)
    );


  if(
    remaining <= 0
  ){

    return {
      type:"danger",
      text:
        `需要換油 ${Math.abs(remaining)} km`,
      current,
      last:Number(last),
      remaining
    };

  }


  if(
    remaining <=
    OIL_WARNING_DISTANCE
  ){

    return {
      type:"warning",
      text:
        `距離換油 ${remaining} km`,
      current,
      last:Number(last),
      remaining
    };

  }


  return {
    type:"normal",
    text:
      `距離換油 ${remaining} km`,
    current,
    last:Number(last),
    remaining
  };

}


/* =====================================================
   排序
===================================================== */

function sortOrder(
  vehicle
){

  const unresolved =
    unresolvedForVehicle(
      vehicle
    );


  const oil =
    oilStatus(
      vehicle
    );


  const today =
    todayReport(
      vehicle
    );


  /*
    1. 待處理異常
    2. 需要換油
    3. 今日異常
    4. 即將換油
    5. 未巡檢
    6. 正常
  */

  if(
    unresolved.length
  ){

    return 1;

  }


  if(
    oil.type ===
    "danger"
  ){

    return 2;

  }


  if(
    today &&
    today.overall_status ===
    "abnormal"
  ){

    return 3;

  }


  if(
    oil.type ===
    "warning"
  ){

    return 4;

  }


  if(
    !today
  ){

    return 5;

  }


  return 6;

}

function renderVehicles(){

  const keyword =
    searchInput.value
      .trim()
      .toUpperCase();


  let list =
    vehicles.filter(

      vehicle => {

        if(
          !keyword
        ){

          return true;

        }


        return (

          String(
            vehicle.plate4 ||
            ""
          )
          .toUpperCase()
          .includes(
            keyword
          )

          ||

          String(
            vehicle.full_plate ||
            ""
          )
          .toUpperCase()
          .includes(
            keyword
          )

        );

      }

    );


  list.sort(

    (a,b) => {

      const order =
        sortOrder(a) -
        sortOrder(b);


      if(
        order !== 0
      ){

        return order;

      }


      return String(
        a.plate4 ||
        ""
      ).localeCompare(
        String(
          b.plate4 ||
          ""

      );

    !list.length

        oilStatus(

            ? "oil-warning"

            : oil.type ===
              "normal"

              ? "oil-normal"

              : "oil-none";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "vehicle-card"

        +

        (
          unresolved.length
            ? " has-unresolved"
            : ""
        )

        +

        (
          today &&
          today.overall_status ===
          "abnormal"

            ? " is-abnormal"
            : ""
        )

        +

        (
          oil.type ===
          "warning"
            ? " oil-warning"
            : ""
        )

        +

        (
          oil.type ===
          "danger"
            ? " oil-danger"
            : ""

      card.innerHTML = `

        <div class="vehicle-top">

          <div class="plate">

            ${escapeHtml(
              vehicle.full_plate ||
              vehicle.plate4 ||
              ""
            )}

          </div>

            CENTER｜
            ${escapeHtml(
              vehicle.center ||
              "未設定"

            ${statusText}

          </div>


          ${

                  🔴 待處理異常

/* =====================================================
   異常文字
===================================================== */

function getAbnormalText(
  report
){

  if(
    !report ||
    !report.abnormal_items
  ){

    return "異常未填寫";

  }


  if(
    Array.isArray(
      report.abnormal_items
    )
  ){

    return report.abnormal_items.join(
      "、"
    );

  }


  return String(
    report.abnormal_items
  );

}


/* =====================================================
   標記已解決
===================================================== */

async function resolveReport(
  reportId
){

  const noteElement =
    document.getElementById(
      `note-${reportId}`
    );


  const note =
    noteElement
      ? noteElement.value.trim()
      : "";


  if(
    !confirm(
      "確認這筆異常已經處理完成嗎？"
    )
  ){

    return;

  }


  try{

    const result =
      await db
        .from(
          "inspection_reports"
        )
        .update({

          resolution_status:
            "resolved",

          resolved_at:
            new Date().toISOString(),

          resolution_note:
            note || null

        })
        .eq(
          "id",
          reportId
        );


    if(
      result.error
    ){

      throw result.error;

    }


    unresolvedReports =
      unresolvedReports.filter(
        report =>
          report.id !==
          reportId
      );


    updateSummary();

    renderVehicles();


    const report =
      latestReports.find(
        item =>
          item.id ===
          reportId
      );


    let vehicle = null;


    if(
      report
    ){

      vehicle =
        vehicles.find(
          item =>
            item.id ===
            report.vehicle_id
        );

    }


    if(
      vehicle
    ){

      await openHistory(
        vehicle
      );

    }


    alert(
      "✅ 已標記為解決"
    );

  }

  catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}

async function confirmOilChange(
  vehicleId
){

  const vehicle =
    vehicles.find(
      item =>
        item.id ===
        vehicleId
    );


  const latest =
    vehicle
      ? latestReport(
          vehicle
        )
      : null;


  if(
    !vehicle ||
    !latest
  ){

    alert(
      "這台車目前沒有巡檢里程，無法設定換油基準。"
    );

    return;

  }


  const mileage =
    Number(
      latest.mileage ||
      0
    );


  if(
    !confirm(

      `確認已更換機油？

CENTER：
${
        vehicle.center ||
        "未設定"
      }

目前里程：
${
        mileage.toLocaleString()
      } km

系統會以 ${
        mileage.toLocaleString()
      } km 作為新的換油基準。`

    )
  ){

    return;

  }


  try{

    const result =
      await db
        .from(

        .eq(

${

        ).toLocaleString()

    );

  }

  catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}


/* =====================================================
   清理 2 個月前資料
===================================================== */

async function cleanupOldReports(){

  const cutoff =
    new Date();


  cutoff.setMonth(
    cutoff.getMonth() - 2
  );


  const cutoffText =
    cutoff.toLocaleDateString(
      "zh-TW",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    );


  try{

    /*
      先查詢預計刪除筆數
    */

    const check =
      await db
        .from(
          "inspection_reports"
        )
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .lt(
          "reported_at",
          cutoff.toISOString()
        );


    if(
      check.error
    ){

      throw check.error;

    }


    const count =
      check.count || 0;


    /*
      沒有舊資料
    */

    if(
      count === 0
    ){

      alert(

        `目前沒有 2 個月前的巡檢資料。

清除基準：
${cutoffText} 以前`

      );

      return;

    }


    /*
      二次確認
    */

    const confirmed =
      confirm(

        `⚠️ 確定要清理 2 個月前的巡檢資料嗎？

清除基準：
${cutoffText} 以前

預計刪除：
${count.toLocaleString()} 筆

此操作無法復原。

車輛、CENTER、換油資料不會刪除。`

      );


    if(
      !confirmed
    ){

      return;

    }


    /*
      呼叫 Supabase RPC
    */

    const result =
      await db.rpc(
        "cleanup_old_inspection_reports"
      );


    if(
      result.error
    ){

      throw result.error;

    }


    const deleted =
      result.data &&
      result.data.deleted_count !==
      undefined

        ? Number(
            result.data.deleted_count
          )

        : count;


    alert(

      `✅ 清理完成！

已刪除：
${deleted.toLocaleString()} 筆巡檢資料`

    );


    /*
      重新整理後台
    */

    await loadData();

  }

  catch(error){

    console.error(
      error
    );


    alert(

      "清理失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      ) +
      "\n\n請確認 Supabase 已建立 cleanup_old_inspection_reports 函數。"

    );

  }

}


/* =====================================================
   日期
===================================================== */

function formatDateTime(
  value
){

  if(
    !value
  ){

    return "尚無紀錄";

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "日期錯誤";

  }


  return date.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   搜尋
===================================================== */

searchInput.addEventListener(
  "input",
  renderVehicles
);


/* =====================================================
   上方按鈕
===================================================== */

pendingCard.addEventListener(
  "click",
  () =>
    openQuickList(
      "pending"
    )
);


unresolvedCard.addEventListener(
  "click",
  () =>
    openQuickList(
      "unresolved"
    )
);


abnormalCard.addEventListener(
  "click",
  () =>
    openQuickList(
      "abnormal"
    )
);


/* =====================================================
   清理資料
===================================================== */

cleanupButton.addEventListener(
  "click",
  cleanupOldReports
);


/* =====================================================
   關閉快速列表
===================================================== */

closeQuickModal.addEventListener(
  "click",
  () =>
    quickModal.classList.remove(
      "show"
    )
);


quickModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      quickModal
    ){

      quickModal.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   關閉詳細資料
===================================================== */

closeModal.addEventListener(
  "click",
  () =>
    modal.classList.remove(
      "show"
    )
);


modal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      modal
    ){

      modal.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   啟動
===================================================== */

loadData();

</script>

</body>
</html>
