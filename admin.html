<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">

  <title>KFC｜車輛巡檢後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --red:#c8102e;
      --black:#242424;
      --gray:#77736d;
      --linen:#f4f0e8;
      --paper:#fff;
      --line:#ddd8ce;

      --green:#356b4b;
      --green-bg:#eef5f0;

      --danger:#b42318;
      --danger-bg:#fff0ee;

      --yellow:#9a6b00;
      --yellow-bg:#fff8df;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--linen);
      color:var(--black);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
      text-align:center;
    }

    button,input {
      font-family:inherit;
    }

    .page {
      width:100%;
      max-width:900px;
      margin:auto;
      padding-bottom:50px;
    }

    .header {
      background:var(--paper);
      padding:30px 20px 26px;
      border-bottom:1px solid var(--line);
      text-align:center;
    }

    .eyebrow {
      color:var(--gray);
      font-size:12px;
      letter-spacing:4px;
      margin-bottom:8px;
    }

    .title-row {
      display:flex;
      justify-content:center;
      align-items:center;
      gap:15px;
    }

    .title {
      margin:0;
      font-size:34px;
      font-weight:800;
    }

    .kfc {
      color:var(--red);
      font-size:28px;
      font-weight:900;
    }

    .date {
      margin-top:10px;
      color:var(--gray);
      font-size:14px;
    }

    .section {
      padding:22px 16px 0;
    }

    .section-title {
      margin-bottom:14px;
      font-size:20px;
      font-weight:800;
      text-align:center;
    }

    .summary {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    .summary-card {
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px 8px;
      text-align:center;
    }

    .summary-label {
      color:var(--gray);
      font-size:13px;
      margin-bottom:8px;
    }

    .summary-number {
      font-size:30px;
      font-weight:800;
    }

    .summary-card.done .summary-number {
      color:var(--green);
    }

    .summary-card.abnormal .summary-number {
      color:var(--danger);
    }

    .summary-card.oil .summary-number {
      color:var(--yellow);
    }

    .search-box {
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
    }

    .search-input {
      width:100%;
      height:54px;
      border:2px solid #d8d3ca;
      border-radius:14px;
      padding:0 16px;
      font-size:18px;
      text-align:center;
      outline:none;
    }

    .search-input:focus {
      border-color:var(--red);
    }

    .vehicle-list {
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .vehicle-card {
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      cursor:pointer;
      text-align:center;
      transition:.12s ease;
    }

    .vehicle-card:hover {
      box-shadow:0 4px 14px rgba(0,0,0,.06);
    }

    .vehicle-card:active {
      transform:scale(.99);
    }

    .vehicle-card.is-abnormal {
      border:2px solid #e2aaa4;
      background:#fffafa;
    }

    .vehicle-card.oil-warning {
      border:2px solid #e1c66e;
      background:#fffdf5;
    }

    .vehicle-card.oil-danger {
      border:2px solid #d9958d;
      background:#fffafa;
    }

    .vehicle-top {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:9px;
    }

    .plate {
      font-size:22px;
      font-weight:800;
      letter-spacing:1px;
      text-align:center;
    }

    .status {
      display:inline-flex;
      justify-content:center;
      align-items:center;
      padding:6px 13px;
      border-radius:20px;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .status-normal {
      background:var(--green-bg);
      color:var(--green);
    }

    .status-abnormal {
      background:var(--danger-bg);
      color:var(--danger);
    }

    .status-none {
      background:#f1eee8;
      color:var(--gray);
    }

    .oil-status {
      display:inline-flex;
      justify-content:center;
      align-items:center;
      margin-top:3px;
      padding:6px 12px;
      border-radius:20px;
      font-size:13px;
      font-weight:800;
    }

    .oil-normal {
      background:var(--green-bg);
      color:var(--green);
    }

    .oil-warning-status {
      background:var(--yellow-bg);
      color:var(--yellow);
    }

    .oil-danger-status {
      background:var(--danger-bg);
      color:var(--danger);
    }

    .oil-none {
      background:#f1eee8;
      color:var(--gray);
    }

    .vehicle-info {
      display:grid;
      grid-template-columns:1fr 1fr;
      margin-top:15px;
      gap:8px;
      color:var(--gray);
      font-size:14px;
      text-align:center;
    }

    .vehicle-info > div {
      padding:8px 4px;
    }

    .vehicle-info strong {
      display:block;
      margin-top:4px;
      color:var(--black);
      font-size:15px;
      text-align:center;
    }

    .empty,
    .loading {
      padding:40px 20px;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:18px;
      color:var(--gray);
      text-align:center;
    }

    .modal {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:none;
      justify-content:center;
      align-items:flex-end;
      z-index:1000;
    }

    .modal.show {
      display:flex;
    }

    .modal-content {
      width:100%;
      max-width:700px;
      max-height:88vh;
      overflow-y:auto;
      background:var(--paper);
      border-radius:25px 25px 0 0;
      padding:24px 18px 35px;
      text-align:center;
    }

    .modal-title {
      font-size:25px;
      font-weight:800;
    }

    .modal-subtitle {
      color:var(--gray);
      margin-top:5px;
      font-size:14px;
    }

    .history {
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:20px;
    }

    .history-card {
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      background:#faf9f6;
      text-align:center;
    }

    .history-top {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:8px;
    }

    .history-date {
      font-size:14px;
      color:var(--gray);
    }

    .history-mileage {
      margin-top:12px;
      font-size:18px;
      font-weight:800;
    }

    .history-abnormal {
      margin-top:10px;
      padding:12px;
      border-radius:11px;
      background:var(--danger-bg);
      color:var(--danger);
      font-size:14px;
      line-height:1.6;
      white-space:pre-wrap;
    }

    .history-normal {
      margin-top:10px;
      padding:10px;
      border-radius:11px;
      background:var(--green-bg);
      color:var(--green);
      font-size:14px;
      font-weight:700;
    }

    .oil-panel {
      margin-top:18px;
      padding:18px;
      border-radius:18px;
      background:#faf9f6;
      border:1px solid var(--line);
    }

    .oil-panel-title {
      font-size:17px;
      font-weight:800;
      margin-bottom:10px;
    }

    .oil-panel-info {
      color:var(--gray);
      font-size:14px;
      line-height:1.7;
    }

    .oil-panel-status {
      margin-top:10px;
      font-size:17px;
      font-weight:800;
    }

    .oil-action {
      width:100%;
      height:50px;
      margin-top:14px;
      border:0;
      border-radius:14px;
      background:var(--red);
      color:#fff;
      font-size:16px;
      font-weight:800;
    }

    .oil-action:disabled {
      opacity:.5;
    }

    .close-btn {
      width:100%;
      height:52px;
      margin-top:20px;
      border:0;
      border-radius:15px;
      background:var(--black);
      color:#fff;
      font-size:17px;
      font-weight:700;
    }

    @media(max-width:600px) {

      .summary {
        grid-template-columns:repeat(2,1fr);
      }

      .summary-number {
        font-size:27px;
      }

      .title {
        font-size:28px;
      }

      .kfc {
        font-size:24px;
      }

      .plate {
        font-size:20px;
      }

    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">

    <div class="eyebrow">
      KFC DELIVERY CENTER
    </div>

    <div class="title-row">

      <h1 class="title">
        車輛巡檢後台
      </h1>

      <div class="kfc">
        KFC
      </div>

    </div>

    <div id="todayDate" class="date"></div>

  </header>


  <section class="section">

    <div class="section-title">
      今日巡檢
    </div>

    <div class="summary">

      <div class="summary-card">

        <div class="summary-label">
          車輛總數
        </div>

        <div id="totalCount" class="summary-number">
          —
        </div>

      </div>


      <div class="summary-card done">

        <div class="summary-label">
          已巡檢
        </div>

        <div id="doneCount" class="summary-number">
          —
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          未巡檢
        </div>

        <div id="pendingCount" class="summary-number">
          —
        </div>

      </div>


      <div class="summary-card abnormal">

        <div class="summary-label">
          今日異常
        </div>

        <div id="abnormalCount" class="summary-number">
          —
        </div>

      </div>

    </div>

  </section>


  <section class="section">

    <div class="section-title">
      查詢車輛
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        type="text"
        inputmode="text"
        placeholder="輸入車牌搜尋"
        autocomplete="off">

    </div>

  </section>


  <section class="section">

    <div class="section-title">
      車輛列表
    </div>

    <div id="vehicleList" class="vehicle-list">

      <div class="loading">
        載入車輛資料中…
      </div>

    </div>

  </section>

</div>


<div id="modal" class="modal">

  <div class="modal-content">

    <div class="modal-title" id="modalTitle"></div>

    <div class="modal-subtitle" id="modalSubtitle"></div>


    <div id="oilPanel"></div>


    <div id="history" class="history"></div>


    <button id="closeModal" class="close-btn">
      關閉
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const OIL_INTERVAL = 1500;
const OIL_WARNING_DISTANCE = 300;


const vehicleList =
  document.getElementById("vehicleList");

const searchInput =
  document.getElementById("searchInput");

const totalCount =
  document.getElementById("totalCount");

const doneCount =
  document.getElementById("doneCount");

const pendingCount =
  document.getElementById("pendingCount");

const abnormalCount =
  document.getElementById("abnormalCount");

const todayDate =
  document.getElementById("todayDate");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalSubtitle =
  document.getElementById("modalSubtitle");

const oilPanel =
  document.getElementById("oilPanel");

const historyContainer =
  document.getElementById("history");

const closeModal =
  document.getElementById("closeModal");


let vehicles = [];
let todayReports = [];
let latestReports = [];


const now = new Date();

const todayStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

const tomorrowStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + 1
  );


todayDate.textContent =
  now.toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"long"
    }
  );


async function loadData() {

  vehicleList.innerHTML = `
    <div class="loading">
      載入資料中…
    </div>
  `;

  try {

    const vehicleResult =
      await db
        .from("vehicles")
        .select("*")
        .eq("active",true)
        .order("plate4",{
          ascending:true
        });


    if(vehicleResult.error)
      throw vehicleResult.error;


    vehicles =
      vehicleResult.data || [];


    const todayResult =
      await db
        .from("inspection_reports")
        .select("*")
        .gte(
          "reported_at",
          todayStart.toISOString()
        )
        .lt(
          "reported_at",
          tomorrowStart.toISOString()
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(todayResult.error)
      throw todayResult.error;


    todayReports =
      todayResult.data || [];


    const latestResults =
      await Promise.all(
        vehicles.map(
          async vehicle => {

            const result =
              await db
                .from("inspection_reports")
                .select("*")
                .eq(
                  "vehicle_id",
                  vehicle.id
                )
                .order(
                  "reported_at",
                  {
                    ascending:false
                  }
                )
                .limit(1);


            if(
              result.error ||
              !result.data ||
              result.data.length === 0
            ) {

              return null;

            }

            return result.data[0];

          }
        )
      );


    latestReports =
      latestResults.filter(
        x => x !== null
      );


    updateSummary();
    renderVehicles();


  } catch(error) {

    console.error(error);

    vehicleList.innerHTML = `
      <div class="empty">

        <strong>
          資料讀取失敗
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}

      </div>
    `;

  }

}


function updateSummary() {

  const total =
    vehicles.length;


  const todayMap =
    new Map();


  todayReports.forEach(
    report => {

      if(
        !todayMap.has(
          report.vehicle_id
        )
      ) {

        todayMap.set(
          report.vehicle_id,
          report
        );

      }

    }
  );


  const done =
    todayMap.size;


  const pending =
    Math.max(
      total - done,
      0
    );


  let abnormal = 0;


  todayMap.forEach(
    report => {

      if(
        report.overall_status ===
        "abnormal"
      ) {

        abnormal++;

      }

    }
  );


  totalCount.textContent =
    total;

  doneCount.textContent =
    done;

  pendingCount.textContent =
    pending;

  abnormalCount.textContent =
    abnormal;

}


function getTodayReport(vehicle) {

  return todayReports.find(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


function getLatestReport(vehicle) {

  return latestReports.find(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


function getOilStatus(vehicle) {

  const latest =
    getLatestReport(vehicle);


  const currentMileage =
    latest
      ? Number(latest.mileage || 0)
      : null;


  const lastOil =
    vehicle.last_oil_change_mileage;


  if(
    lastOil === null ||
    lastOil === undefined
  ) {

    return {
      type:"none",
      order:4,
      text:"尚未設定換油基準",
      currentMileage,
      lastOil:null,
      remaining:null
    };

  }


  if(
    currentMileage === null
  ) {

    return {
      type:"none",
      order:4,
      text:"等待里程",
      currentMileage:null,
      lastOil:Number(lastOil),
      remaining:null
    };

  }


  const used =
    currentMileage -
    Number(lastOil);


  const remaining =
    OIL_INTERVAL -
    used;


  if(
    remaining <= 0
  ) {

    return {
      type:"danger",
      order:1,
      text:`需要換油 ${Math.abs(remaining)} km`,
      currentMileage,
      lastOil:Number(lastOil),
      remaining
    };

  }


  if(
    remaining <= OIL_WARNING_DISTANCE
  ) {

    return {
      type:"warning",
      order:2,
      text:`距離換油 ${remaining} km`,
      currentMileage,
      lastOil:Number(lastOil),
      remaining
    };

  }


  return {
    type:"normal",
    order:3,
    text:`距離換油 ${remaining} km`,
    currentMileage,
    lastOil:Number(lastOil),
    remaining
  };

}


function getVehicleSortStatus(vehicle) {

  const today =
    getTodayReport(vehicle);

  const oil =
    getOilStatus(vehicle);


  /*
    排序優先：

    1. 機油已到期
    2. 今日異常
    3. 機油即將到期
    4. 未巡檢
    5. 正常
  */


  if(
    oil.type === "danger"
  ) {

    return 1;

  }


  if(
    today &&
    today.overall_status ===
    "abnormal"
  ) {

    return 2;

  }


  if(
    oil.type === "warning"
  ) {

    return 3;

  }


  if(!today) {

    return 4;

  }


  return 5;

}


function renderVehicles() {

  const keyword =
    searchInput.value
      .trim()
      .toUpperCase();


  const filtered =
    vehicles.filter(
      vehicle => {

        if(!keyword)
          return true;


        return (

          String(
            vehicle.plate4 || ""
          )
          .toUpperCase()
          .includes(keyword)

          ||

          String(
            vehicle.full_plate || ""
          )
          .toUpperCase()
          .includes(keyword)

        );

      }
    );


  filtered.sort(
    (a,b) => {

      const statusA =
        getVehicleSortStatus(a);

      const statusB =
        getVehicleSortStatus(b);


      if(
        statusA !== statusB
      ) {

        return statusA - statusB;

      }


      return String(
        a.plate4 || ""
      ).localeCompare(
        String(
          b.plate4 || ""
        )
      );

    }
  );


  if(
    filtered.length === 0
  ) {

    vehicleList.innerHTML = `
      <div class="empty">
        找不到符合的車輛
      </div>
    `;

    return;

  }


  vehicleList.innerHTML = "";


  filtered.forEach(
    vehicle => {

      const today =
        getTodayReport(vehicle);

      const latest =
        getLatestReport(vehicle);

      const oil =
        getOilStatus(vehicle);


      let statusClass =
        "status-none";

      let statusText =
        "今日未巡檢";


      if(today) {

        if(
          today.overall_status ===
          "abnormal"
        ) {

          statusClass =
            "status-abnormal";

          statusText =
            "今日異常";

        } else {

          statusClass =
            "status-normal";

          statusText =
            "今日正常";

        }

      }


      let oilClass =
        "oil-none";


      if(
        oil.type === "normal"
      ) {

        oilClass =
          "oil-normal";

      }

      if(
        oil.type === "warning"
      ) {

        oilClass =
          "oil-warning-status";

      }

      if(
        oil.type === "danger"
      ) {

        oilClass =
          "oil-danger-status";

      }


      const mileage =
        latest
          ? `${Number(
              latest.mileage
            ).toLocaleString()} km`
          : "尚無資料";


      const lastTime =
        latest
          ? formatDateTime(
              latest.reported_at
            )
          : "尚無紀錄";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "vehicle-card";


      if(
        today &&
        today.overall_status ===
        "abnormal"
      ) {

        card.classList.add(
          "is-abnormal"
        );

      }


      if(
        oil.type === "warning"
      ) {

        card.classList.add(
          "oil-warning"
        );

      }


      if(
        oil.type === "danger"
      ) {

        card.classList.add(
          "oil-danger"
        );

      }


      card.innerHTML = `

        <div class="vehicle-top">

          <div class="plate">

            ${escapeHtml(
              vehicle.full_plate ||
              vehicle.plate4 ||
              ""
            )}

          </div>


          <div class="status ${statusClass}">

            ${statusText}

          </div>


          <div class="oil-status ${oilClass}">

            🛢️ ${escapeHtml(
              oil.text
            )}

          </div>

        </div>


        <div class="vehicle-info">

          <div>

            最新里程

            <strong>
              ${mileage}
            </strong>

          </div>


          <div>

            最近巡檢

            <strong>
              ${lastTime}
            </strong>

          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        () => {
          openHistory(vehicle);
        }
      );


      vehicleList.appendChild(
        card
      );

    }
  );

}


async function openHistory(vehicle) {

  modalTitle.textContent =
    vehicle.full_plate ||
    vehicle.plate4 ||
    "";


  modalSubtitle.textContent =
    "巡檢歷史紀錄";


  renderOilPanel(
    vehicle
  );


  historyContainer.innerHTML = `
    <div class="loading">
      載入歷史紀錄中…
    </div>
  `;


  modal.classList.add(
    "show"
  );


  try {

    const result =
      await db
        .from(
          "inspection_reports"
        )
        .select("*")
        .eq(
          "vehicle_id",
          vehicle.id
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(result.error)
      throw result.error;


    const reports =
      result.data || [];


    if(
      reports.length === 0
    ) {

      historyContainer.innerHTML = `
        <div class="empty">
          尚無巡檢紀錄
        </div>
      `;

      return;

    }


    historyContainer.innerHTML = "";


    reports.forEach(
      report => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        const abnormal =
          report.overall_status ===
          "abnormal";


        let abnormalText =
          "";


        if(
          report.abnormal_items
        ) {

          abnormalText =
            Array.isArray(
              report.abnormal_items
            )

              ? report.abnormal_items.join(
                  "\n"
                )

              : String(
                  report.abnormal_items
                );

        }


        card.innerHTML = `

          <div class="history-top">

            <div class="history-date">

              ${formatDateTime(
                report.reported_at
              )}

            </div>


            <div class="status ${
              abnormal
                ? "status-abnormal"
                : "status-normal"
            }">

              ${
                abnormal
                  ? "異常"
                  : "正常"
              }

            </div>

          </div>


          <div class="history-mileage">

            里程：

            ${Number(
              report.mileage || 0
            ).toLocaleString()}

            km

          </div>


          ${
            abnormal

              ? `

                <div class="history-abnormal">

                  <strong>
                    異常項目
                  </strong>

                  <br>

                  ${escapeHtml(
                    abnormalText ||
                    "未填寫異常說明"
                  )}

                </div>

              `

              : `

                <div class="history-normal">

                  本次巡檢全部正常

                </div>

              `
          }

        `;


        historyContainer.appendChild(
          card
        );

      }
    );


  } catch(error) {

    historyContainer.innerHTML = `
      <div class="empty">

        歷史紀錄讀取失敗

        <br><br>

        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}

      </div>
    `;

  }

}


function renderOilPanel(vehicle) {

  const oil =
    getOilStatus(vehicle);


  let statusText =
    oil.text;


  let statusColor =
    "var(--gray)";


  if(
    oil.type === "normal"
  ) {

    statusColor =
      "var(--green)";

  }


  if(
    oil.type === "warning"
  ) {

    statusColor =
      "var(--yellow)";

  }


  if(
    oil.type === "danger"
  ) {

    statusColor =
      "var(--danger)";

  }


  const lastOilText =
    oil.lastOil !== null
      ? `${Number(
          oil.lastOil
        ).toLocaleString()} km`
      : "尚未設定";


  const currentText =
    oil.currentMileage !== null
      ? `${Number(
          oil.currentMileage
        ).toLocaleString()} km`
      : "尚無巡檢里程";


  oilPanel.innerHTML = `

    <div class="oil-panel">

      <div class="oil-panel-title">
        🛢️ 機油保養
      </div>


      <div class="oil-panel-info">

        上次換油里程：
        <strong>
          ${lastOilText}
        </strong>

        <br>

        目前里程：
        <strong>
          ${currentText}
        </strong>

        <br>

        換油週期：
        <strong>
          ${OIL_INTERVAL.toLocaleString()} km
        </strong>

      </div>


      <div
        class="oil-panel-status"
        style="color:${statusColor};">

        ${escapeHtml(
          statusText
        )}

      </div>


      <button
        class="oil-action"
        onclick="confirmOilChange('${vehicle.id}')">

        🔧 已更換機油

      </button>

    </div>

  `;

}


async function confirmOilChange(
  vehicleId
) {

  const vehicle =
    vehicles.find(
      v =>
        v.id ===
        vehicleId
    );


  if(!vehicle)
    return;


  const latest =
    getLatestReport(
      vehicle
    );


  if(!latest) {

    alert(
      "這台車目前沒有巡檢里程，無法設定換油基準。"
    );

    return;

  }


  const mileage =
    Number(
      latest.mileage
    );


  const confirmed =
    confirm(
      `確認已更換機油？\n\n目前里程：${mileage.toLocaleString()} km\n\n系統會以 ${mileage.toLocaleString()} km 作為下一次換油基準。`
    );


  if(!confirmed)
    return;


  try {

    const result =
      await db
        .from("vehicles")
        .update({
          last_oil_change_mileage:
            mileage
        })
        .eq(
          "id",
          vehicleId
        );


    if(result.error)
      throw result.error;


    vehicle.last_oil_change_mileage =
      mileage;


    renderOilPanel(
      vehicle
    );


    renderVehicles();


    alert(
      `完成！\n下一次換油里程：${(mileage + OIL_INTERVAL).toLocaleString()} km`
    );


  } catch(error) {

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}


function formatDateTime(
  value
) {

  if(!value)
    return "尚無紀錄";


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "日期錯誤";

  }


  return date.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


searchInput.addEventListener(
  "input",
  renderVehicles
);


closeModal.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "show"
    );

  }
);


modal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      modal
    ) {

      modal.classList.remove(
        "show"
      );

    }

  }
);


loadData();

</script>
