<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f0e8">
<title>KFC｜車輛巡檢後台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#c8102e;
  --black:#242424;
  --gray:#77736d;
  --linen:#f4f0e8;
  --paper:#fff;
  --line:#ddd8ce;
  --green:#356b4b;
  --green-bg:#eef5f0;
  --danger:#b42318;
  --danger-bg:#fff0ee;
  --yellow:#9a6b00;
  --yellow-bg:#fff8df;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--linen);
  color:var(--black);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Helvetica Neue",
    Arial,
    sans-serif;
  text-align:center;
}

button,
input,
textarea{
  font-family:inherit;
}

.page{
  width:100%;
  max-width:900px;
  margin:auto;
  padding-bottom:50px;
}

/* =========================
   Header
========================= */

.header{
  background:var(--paper);
  padding:30px 20px 26px;
  border-bottom:1px solid var(--line);
  text-align:center;
}

.eyebrow{
  color:var(--gray);
  font-size:12px;
  letter-spacing:4px;
  margin-bottom:8px;
}

.title-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
}

.title{
  margin:0;
  font-size:34px;
  font-weight:800;
}

.kfc{
  color:var(--red);
  font-size:28px;
  font-weight:900;
}

.date{
  margin-top:10px;
  color:var(--gray);
  font-size:14px;
}

/* =========================
   Section
========================= */

.section{
  padding:22px 16px 0;
}

.section-title{
  margin-bottom:14px;
  font-size:20px;
  font-weight:800;
}

/* =========================
   Summary
========================= */

.summary{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.summary-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 8px;
}

.summary-card.clickable{
  cursor:pointer;
  transition:.12s;
}

.summary-card.clickable:active{
  transform:scale(.98);
  background:#faf8f3;
}

.summary-label{
  color:var(--gray);
  font-size:13px;
  margin-bottom:8px;
}

.summary-number{
  font-size:30px;
  font-weight:800;
}

.summary-card.done .summary-number{
  color:var(--green);
}

.summary-card.abnormal .summary-number{
  color:var(--danger);
}

/* =========================
   Search
========================= */

.search-box{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}

.search-input{
  width:100%;
  height:54px;
  border:2px solid #d8d3ca;
  border-radius:14px;
  padding:0 16px;
  font-size:18px;
  text-align:center;
  outline:none;
}

.search-input:focus{
  border-color:var(--red);
}

/* =========================
   Vehicle List
========================= */

.vehicle-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.vehicle-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  text-align:center;
  transition:.12s;
}

.vehicle-card:active{
  transform:scale(.99);
}

.vehicle-card.is-abnormal{
  border:2px solid #e2aaa4;
  background:#fffafa;
}

.vehicle-card.has-unresolved{
  border:2px solid var(--danger);
  background:#fffafa;
}

.vehicle-card.oil-warning{
  border:2px solid #e1c66e;
  background:#fffdf5;
}

.vehicle-card.oil-danger{
  border:2px solid #d9958d;
  background:#fffafa;
}

.vehicle-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.plate{
  font-size:22px;
  font-weight:800;
  letter-spacing:1px;
}

.center{
  font-size:14px;
  color:var(--gray);
  font-weight:700;
}

.status,
.oil-status{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:6px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.status-normal,
.oil-normal{
  background:var(--green-bg);
  color:var(--green);
}

.status-abnormal,
.oil-danger{
  background:var(--danger-bg);
  color:var(--danger);
}

.status-none,
.oil-none{
  background:#f1eee8;
  color:var(--gray);
}

.oil-warning{
  background:var(--yellow-bg);
  color:var(--yellow);
}

.vehicle-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:15px;
  gap:8px;
  color:var(--gray);
  font-size:14px;
}

.vehicle-info>div{
  padding:8px 4px;
}

.vehicle-info strong{
  display:block;
  margin-top:4px;
  color:var(--black);
  font-size:15px;
}

.unresolved-badge{
  margin-top:6px;
  padding:6px 12px;
  border-radius:20px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:13px;
  font-weight:800;
}

/* =========================
   Empty / Loading
========================= */

.empty,
.loading{
  padding:40px 20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  color:var(--gray);
}

/* =========================
   Modal
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:25px 25px 0 0;
  padding:24px 18px 35px;
}

.modal-title{
  font-size:25px;
  font-weight:800;
}

.modal-subtitle{
  color:var(--gray);
  margin-top:5px;
  font-size:14px;
}

/* =========================
   Oil
========================= */

.oil-panel{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#faf9f6;
  border:1px solid var(--line);
}

.oil-panel-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px;
}

.oil-panel-info{
  color:var(--gray);
  font-size:14px;
  line-height:1.8;
}

.oil-panel-status{
  margin-top:10px;
  font-size:17px;
  font-weight:800;
}

.oil-action{
  width:100%;
  height:50px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

/* =========================
   History
========================= */

.history{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}

.history-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:#faf9f6;
}

.history-top{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.history-date{
  font-size:14px;
  color:var(--gray);
}

.history-mileage{
  margin-top:12px;
  font-size:18px;
  font-weight:800;
}

.history-abnormal{
  margin-top:10px;
  padding:12px;
  border-radius:11px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

.history-normal{
  margin-top:10px;
  padding:10px;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  font-weight:700;
}

/* =========================
   Unresolved
========================= */

.unresolved-box{
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.7;
}

.resolution-note{
  width:100%;
  min-height:90px;
  margin-top:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  resize:vertical;
  text-align:center;
  font-size:15px;
  outline:none;
  background:#fff;
}

.resolution-note:focus{
  border-color:var(--red);
}

.resolve-btn{
  width:100%;
  height:48px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

.resolved-box{
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  line-height:1.8;
}

/* =========================
   Close
========================= */

.close-btn{
  width:100%;
  height:52px;
  margin-top:20px;
  border:0;
  border-radius:15px;
  background:var(--black);
  color:#fff;
  font-size:17px;
  font-weight:700;
}

/* =========================
   Mobile
========================= */

@media(max-width:700px){

  .summary{
    grid-template-columns:repeat(2,1fr);
  }

  .summary-card:first-child{
    grid-column:span 2;
  }

  .summary-number{
    font-size:27px;
  }

  .title{
    font-size:28px;
  }

  .kfc{
    font-size:24px;
  }

  .plate{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- =====================
       Header
  ====================== -->

  <header class="header">

    <div class="eyebrow">
      KFC DELIVERY CENTER
    </div>

    <div class="title-row">

      <h1 class="title">
        車輛巡檢後台
      </h1>

      <div class="kfc">
        KFC
      </div>

    </div>

    <div
      id="todayDate"
      class="date">
    </div>

  </header>


  <!-- =====================
       Summary
  ====================== -->

  <section class="section">

    <div class="section-title">
      今日巡檢
    </div>

    <div class="summary">

      <div class="summary-card">

        <div class="summary-label">
          車輛總數
        </div>

        <div
          id="totalCount"
          class="summary-number">
          —
        </div>

      </div>


      <div class="summary-card done">

        <div class="summary-label">
          已巡檢
        </div>

        <div
          id="doneCount"
          class="summary-number">
          —
        </div>

      </div>


      <!-- 待處理異常 -->

      <div
        id="unresolvedCard"
        class="summary-card abnormal clickable">

        <div class="summary-label">
          待處理異常
        </div>

        <div
          id="unresolvedCount"
          class="summary-number">
          —
        </div>

      </div>


      <!-- 未巡檢 -->

      <div
        id="pendingCard"
        class="summary-card clickable">

        <div class="summary-label">
          未巡檢
        </div>

        <div
          id="pendingCount"
          class="summary-number">
          —
        </div>

      </div>


      <!-- 今日異常 -->

      <div
        id="abnormalCard"
        class="summary-card abnormal clickable">

        <div class="summary-label">
          今日異常
        </div>

        <div
          id="abnormalCount"
          class="summary-number">
          —
        </div>

      </div>

    </div>

  </section>


  <!-- =====================
       Search
  ====================== -->

  <section class="section">

    <div class="section-title">
      查詢車輛
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        type="text"
        inputmode="text"
        placeholder="輸入車牌搜尋"
        autocomplete="off">

    </div>

  </section>


  <!-- =====================
       Vehicle List
  ====================== -->

  <section class="section">

    <div class="section-title">
      車輛列表
    </div>

    <div
      id="vehicleList"
      class="vehicle-list">

      <div class="loading">
        載入車輛資料中…
      </div>

    </div>

  </section>

</div>


<!-- =========================
     Quick List Modal
========================= -->

<div
  id="quickModal"
  class="modal">

  <div class="modal-content">

    <div
      id="quickModalTitle"
      class="modal-title">
    </div>

    <div
      id="quickModalSubtitle"
      class="modal-subtitle">
    </div>

    <div
      id="quickList"
      class="history">
    </div>

    <button
      id="closeQuickModal"
      class="close-btn">
      關閉
    </button>

  </div>

</div>


<!-- =========================
     Detail Modal
========================= -->

<div
  id="modal"
  class="modal">

  <div class="modal-content">

    <div
      id="modalTitle"
      class="modal-title">
    </div>

    <div
      id="modalSubtitle"
      class="modal-subtitle">
    </div>

    <div id="oilPanel"></div>

    <div
      id="history"
      class="history">
    </div>

    <button
      id="closeModal"
      class="close-btn">
      關閉
    </button>

  </div>

</div>


<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   系統設定
===================================================== */

const OIL_INTERVAL = 1500;

const OIL_WARNING_DISTANCE = 300;


/* =====================================================
   DOM
===================================================== */

const vehicleList =
  document.getElementById("vehicleList");

const searchInput =
  document.getElementById("searchInput");

const totalCount =
  document.getElementById("totalCount");

const doneCount =
  document.getElementById("doneCount");

const pendingCount =
  document.getElementById("pendingCount");

const abnormalCount =
  document.getElementById("abnormalCount");

const unresolvedCount =
  document.getElementById("unresolvedCount");

const unresolvedCard =
  document.getElementById("unresolvedCard");

const pendingCard =
  document.getElementById("pendingCard");

const abnormalCard =
  document.getElementById("abnormalCard");

const todayDate =
  document.getElementById("todayDate");


/* Quick Modal */

const quickModal =
  document.getElementById("quickModal");

const quickModalTitle =
  document.getElementById("quickModalTitle");

const quickModalSubtitle =
  document.getElementById("quickModalSubtitle");

const quickList =
  document.getElementById("quickList");

const closeQuickModal =
  document.getElementById("closeQuickModal");


/* Detail Modal */

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalSubtitle =
  document.getElementById("modalSubtitle");

const oilPanel =
  document.getElementById("oilPanel");

const historyContainer =
  document.getElementById("history");

const closeModal =
  document.getElementById("closeModal");


/* =====================================================
   全域資料
===================================================== */

let vehicles = [];

let todayReports = [];

let latestReports = [];

let unresolvedReports = [];


/* =====================================================
   今日日期
===================================================== */

const now = new Date();

const todayStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

const tomorrowStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + 1
  );


todayDate.textContent =
  now.toLocaleDateString(
    "zh-TW",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"long"
    }
  );


/* =====================================================
   載入全部資料
===================================================== */

async function loadData(){

  vehicleList.innerHTML =
    '<div class="loading">載入資料中…</div>';

  try{

    /* -------------------------
       1. 車輛
    ------------------------- */

    const vehicleResult =
      await db
        .from("vehicles")
        .select("*")
        .eq("active", true)
        .order(
          "plate4",
          {
            ascending:true
          }
        );


    if(vehicleResult.error){

      throw vehicleResult.error;

    }


    vehicles =
      vehicleResult.data || [];


    /* -------------------------
       2. 今日巡檢
    ------------------------- */

    const todayResult =
      await db
        .from("inspection_reports")
        .select("*")
        .gte(
          "reported_at",
          todayStart.toISOString()
        )
        .lt(
          "reported_at",
          tomorrowStart.toISOString()
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(todayResult.error){

      throw todayResult.error;

    }


    todayReports =
      todayResult.data || [];


    /* -------------------------
       3. 每台車最新紀錄
    ------------------------- */

    latestReports = [];

    for(
      const vehicle
      of vehicles
    ){

      const result =
        await db
          .from("inspection_reports")
          .select("*")
          .eq(
            "vehicle_id",
            vehicle.id
          )
          .order(
            "reported_at",
            {
              ascending:false
            }
          )
          .limit(1);


      if(
        !result.error &&
        result.data &&
        result.data.length
      ){

        latestReports.push(
          result.data[0]
        );

      }

    }


    /* -------------------------
       4. 待處理異常
       
       pending：
       尚未結案

       null：
       舊資料沒有 resolution_status
       也視為待處理
    ------------------------- */

    const unresolvedResult =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "overall_status",
          "abnormal"
        )
        .or(
          "resolution_status.eq.pending,resolution_status.is.null"
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(unresolvedResult.error){

      throw unresolvedResult.error;

    }


    unresolvedReports =
      unresolvedResult.data || [];


    updateSummary();

    renderVehicles();

  }

  catch(error){

    console.error(error);

    vehicleList.innerHTML = `

      <div class="empty">

        <strong>
          資料讀取失敗
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}

      </div>

    `;

  }

}


/* =====================================================
   更新上方統計
===================================================== */

function updateSummary(){

  const todayMap =
    new Map();


  /*
    同一台車今天可能填寫多次
    只算一台
  */

  todayReports.forEach(

    report => {

      if(
        !todayMap.has(
          report.vehicle_id
        )
      ){

        todayMap.set(
          report.vehicle_id,
          report
        );

      }

    }

  );


  totalCount.textContent =
    vehicles.length;


  doneCount.textContent =
    todayMap.size;


  pendingCount.textContent =
    Math.max(
      vehicles.length -
      todayMap.size,
      0
    );


  let abnormal = 0;


  todayMap.forEach(

    report => {

      if(
        report.overall_status ===
        "abnormal"
      ){

        abnormal++;

      }

    }

  );


  abnormalCount.textContent =
    abnormal;


  /*
    待處理異常是跨日期的
  */

  unresolvedCount.textContent =
    unresolvedReports.length;

}


/* =====================================================
   取得今日巡檢
===================================================== */

function todayReport(vehicle){

  return todayReports.find(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


/* =====================================================
   取得最新巡檢
===================================================== */

function latestReport(vehicle){

  return latestReports.find(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


/* =====================================================
   取得該車所有待處理異常
===================================================== */

function unresolvedForVehicle(vehicle){

  return unresolvedReports.filter(
    report =>
      report.vehicle_id ===
      vehicle.id
  );

}


/* =====================================================
   取得該車最新待處理異常
===================================================== */

function latestUnresolved(vehicle){

  const list =
    unresolvedForVehicle(
      vehicle
    );


  return list.length
    ? list[0]
    : null;

}


/* =====================================================
   機油狀態
===================================================== */

function oilStatus(vehicle){

  const latest =
    latestReport(
      vehicle
    );


  const current =
    latest
      ? Number(
          latest.mileage || 0
        )
      : null;


  const last =
    vehicle.last_oil_change_mileage;


  /*
    尚未設定換油基準
  */

  if(
    last === null ||
    last === undefined
  ){

    return {

      type:"none",

      text:"尚未設定換油基準",

      current,

      last:null,

      remaining:null

    };

  }


  /*
    有換油基準
    但沒有巡檢里程
  */

  if(current === null){

    return {

      type:"none",

      text:"等待里程",

      current,

      last:Number(last),

      remaining:null

    };

  }


  const remaining =
    OIL_INTERVAL -
    (
      current -
      Number(last)
    );


  /*
    已到換油
  */

  if(
    remaining <= 0
  ){

    return {

      type:"danger",

      text:
        `需要換油 ${Math.abs(remaining)} km`,

      current,

      last:Number(last),

      remaining

    };

  }


  /*
    300 km 內
  */

  if(
    remaining <=
    OIL_WARNING_DISTANCE
  ){

    return {

      type:"warning",

      text:
        `距離換油 ${remaining} km`,

      current,

      last:Number(last),

      remaining

    };

  }


  /*
    正常
  */

  return {

    type:"normal",

    text:
      `距離換油 ${remaining} km`,

    current,

    last:Number(last),

    remaining

  };

}


/* =====================================================
   車輛排序
===================================================== */

function sortOrder(vehicle){

  const unresolved =
    unresolvedForVehicle(
      vehicle
    );


  const oil =
    oilStatus(
      vehicle
    );


  const today =
    todayReport(
      vehicle
    );


  /*
    1. 待處理異常
    2. 已到換油
    3. 今日異常
    4. 即將換油
    5. 未巡檢
    6. 正常
  */

  if(
    unresolved.length
  ){

    return 1;

  }


  if(
    oil.type ===
    "danger"
  ){

    return 2;

  }


  if(
    today &&
    today.overall_status ===
    "abnormal"
  ){

    return 3;

  }


  if(
    oil.type ===
    "warning"
  ){

    return 4;

  }


  if(!today){

    return 5;

  }


  return 6;

}


/* =====================================================
   快速列表
===================================================== */

function openQuickList(type){

  const isUnresolved =
    type ===
    "unresolved";


  const isAbnormal =
    type ===
    "abnormal";


  let list = [];


  /*
    待處理異常
  */

  if(isUnresolved){

    list =
      vehicles.filter(
        vehicle =>
          unresolvedForVehicle(
            vehicle
          ).length > 0
      );

  }


  /*
    今日異常
  */

  else if(isAbnormal){

    list =
      vehicles.filter(
        vehicle => {

          const report =
            todayReport(
              vehicle
            );


          return (
            report &&
            report.overall_status ===
            "abnormal"
          );

        }
      );

  }


  /*
    未巡檢
  */

  else{

    list =
      vehicles.filter(
        vehicle =>
          !todayReport(
            vehicle
          )
      );

  }


  /* 標題 */

  if(isUnresolved){

    quickModalTitle.textContent =
      "待處理異常車輛";

  }
  else if(isAbnormal){

    quickModalTitle.textContent =
      "今日異常車輛";

  }
  else{

    quickModalTitle.textContent =
      "尚未巡檢車輛";

  }


  quickModalSubtitle.textContent =
    `共 ${list.length} 台｜點選車輛查看詳細紀錄`;

  if(!list.length){

    quickList.innerHTML = `

      <div class="empty">

    list.sort(

            b.plate4 || ""
          )
        )
    );


    quickList.innerHTML =
      "";


    list.forEach(

      vehicle => {

        const latest =
          latestReport(
            vehicle
          );


        const oil =
          oilStatus(
            vehicle
          );


        const unresolved =
          latestUnresolved(
            vehicle
          );


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        card.style.cursor =
          "pointer";


        let abnormalText =
          "";


        if(
          isUnresolved &&
          unresolved

          abnormalText =
            getAbnormalText(
              unresolved
            );

        }


        card.innerHTML = `

          <div class="history-top">

            <div class="plate">

              ${escapeHtml(
                vehicle.full_plate ||
                vehicle.plate4 ||
                ""
              )}

            </div>


            <div class="center">

              CENTER｜
              ${escapeHtml(
                vehicle.center ||
                "未設定"
              )}

            </div>


            <div class="status ${
              isUnresolved ||
              isAbnormal
                ? "status-abnormal"
                : "status-none"
            }">

              ${
                isUnresolved
                  ? "待處理異常"
                  : isAbnormal
                    ? "今日異常"
                    : "今日未巡檢"
              }

            </div>

          ${

                <div class="unresolved-box">

                  <strong>

                  </strong>

                  <br>

                  ${escapeHtml(

                </div>

          <div class="vehicle-info">

                ${

/* =====================================================
   車輛列表
===================================================== */

function renderVehicles(){

  const keyword =
    searchInput.value
      .trim()
      .toUpperCase();


  let list =
    vehicles.filter(

      vehicle => {

        if(!keyword){

          return true;

        }


        return (

          String(
            vehicle.plate4 || ""
          )
          .toUpperCase()
          .includes(
            keyword
          )

          ||

          String(
            vehicle.full_plate || ""
          )
          .toUpperCase()
          .includes(
            keyword
          )

        );

      }

    );


  /*
    排序
  */

  list.sort(

    (a,b) => {

      const order =
        sortOrder(a) -
        sortOrder(b);


      if(order !== 0){

        return order;

      }


      return String(
        a.plate4 || ""
      ).localeCompare(
        String(
          b.plate4 || ""
        )
      );

    }

  );


  if(!list.length){

    vehicleList.innerHTML =
      '<div class="empty">找不到符合的車輛</div>';

    return;

  }


  vehicleList.innerHTML =
    "";


  list.forEach(

    vehicle => {

      const today =
        todayReport(
          vehicle
        );


      const latest =
        latestReport(
          vehicle
        );


      const oil =
        oilStatus(
          vehicle
        );


      const unresolved =
        unresolvedForVehicle(
          vehicle
        );


      /*
        巡檢狀態
      */

      const statusClass =
        today

          ? (
              today.overall_status ===
              "abnormal"

                ? "status-abnormal"

                : "status-normal"
            )

          : "status-none";


      const statusText =
        today

          ? (
              today.overall_status ===
              "abnormal"

                ? "今日異常"

                : "今日正常"
            )

          : "今日未巡檢";


      /*
        機油狀態
      */

      const oilClass =
        oil.type ===
        "danger"

          ? "oil-danger"

          : oil.type ===
            "warning"

            ? "oil-warning"

            : oil.type ===
              "normal"

              ? "oil-normal"

              : "oil-none";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "vehicle-card"

        +

        (
          unresolved.length
            ? " has-unresolved"
            : ""
        )

        +

        (
          today &&
          today.overall_status ===
          "abnormal"

            ? " is-abnormal"
            : ""
        )

        +

        (
          oil.type ===
          "warning"

            ? " oil-warning"
            : ""
        )

        +

        (
          oil.type ===
          "danger"

            ? " oil-danger"
            : ""
        );


      card.innerHTML = `

        <div class="vehicle-top">

          <div class="plate">

            ${escapeHtml(
              vehicle.full_plate ||
              vehicle.plate4 ||
              ""
            )}

          </div>


          <div class="center">

            CENTER｜
            ${escapeHtml(
              vehicle.center ||
              "未設定"
            )}

          </div>


          <div class="status ${statusClass}">

            ${statusText}

          </div>


          ${
            unresolved.length

              ? `

                <div class="unresolved-badge">

                  🔴 待處理異常
                  ${unresolved.length > 1
                    ? ` × ${unresolved.length}`
                    : ""
                  }

                </div>

              `

              : ""
          }


          <div class="oil-status ${oilClass}">

            🛢️
            ${escapeHtml(
              oil.text
            )}

          </div>

        </div>


        <div class="vehicle-info">

          <div>

            最新里程

            <strong>

              ${
                latest

                  ? Number(
                      latest.mileage ||
                      0
                    ).toLocaleString()
                    + " km"

                  : "尚無資料"
              }

            </strong>

          </div>


          <div>

            最近巡檢

            <strong>

              ${
                latest

                  ? formatDateTime(
                      latest.reported_at
                    )

                  : "尚無紀錄"
              }

            </strong>

          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        () =>
          openHistory(
            vehicle
          )
      );


      vehicleList.appendChild(
        card
      );

    }

  );

}


/* =====================================================
   車輛詳細歷史
===================================================== */

async function openHistory(vehicle){

  modalTitle.textContent =
    vehicle.full_plate ||
    vehicle.plate4 ||
    "";


  modalSubtitle.textContent =
    `CENTER｜${
      vehicle.center ||
      "未設定"
    }　・　巡檢歷史紀錄`;


  renderOilPanel(
    vehicle
  );


  historyContainer.innerHTML =
    '<div class="loading">載入歷史紀錄中…</div>';


  modal.classList.add(
    "show"
  );


  try{

    const result =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "vehicle_id",
          vehicle.id
        )
        .order(
          "reported_at",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    const reports =
      result.data || [];


    if(!reports.length){

      historyContainer.innerHTML =
        '<div class="empty">尚無巡檢紀錄</div>';

      return;

    }


    historyContainer.innerHTML =
      "";


    reports.forEach(

      report => {

        const abnormal =
          report.overall_status ===
          "abnormal";


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        card.innerHTML = `

          <div class="history-top">

            <div class="history-date">

              ${formatDateTime(
                report.reported_at
              )}

            </div>


            <div class="status ${
              abnormal
                ? "status-abnormal"
                : "status-normal"
            }">

              ${
                abnormal
                  ? "異常"
                  : "正常"
              }

            </div>

          </div>


          <div class="history-mileage">

            里程：
            ${Number(
              report.mileage ||
              0
            ).toLocaleString()}
            km

          </div>


          ${
            abnormal

              ? renderAbnormalHistory(
                  report
                )

              : `

                <div class="history-normal">

                  本次巡檢全部正常

                </div>

              `
          }

        `;


        historyContainer.appendChild(
          card
        );

      }

    );

  }

  catch(error){

    historyContainer.innerHTML = `

      <div class="empty">

        歷史紀錄讀取失敗

        <br><br>

        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}

      </div>

    `;

  }

}


/* =====================================================
   異常歷史區塊
===================================================== */

function renderAbnormalHistory(
  report
){

  const abnormalText =
    getAbnormalText(
      report
    );


  /*
    已解決
  */

  if(
    report.resolution_status ===
    "resolved"
  ){

    return `

      <div class="history-abnormal">

        <strong>
          異常項目
        </strong>

        <br>

        ${escapeHtml(
          abnormalText
        )}

      </div>


      <div class="resolved-box">

        🟢 <strong>已解決</strong>

        <br>

        處理時間：
        ${formatDateTime(
          report.resolved_at
        )}

        ${
          report.resolution_note

            ? `

              <br>

              處理備註：
              ${escapeHtml(
                report.resolution_note
              )}

            `

            : ""
        }

      </div>

    `;

  }


  /*
    尚未解決
  */

  return `

    <div class="history-abnormal">

      <strong>
        異常項目
      </strong>

      <br>

      ${escapeHtml(
        abnormalText
      )}

    </div>


    <div class="unresolved-box">

      🔴 <strong>待處理異常</strong>

      <br>

      此異常尚未結案。

    </div>


    <textarea
      id="note-${report.id}"
      class="resolution-note"
      placeholder="處理備註，例如：已更換前輪胎、已調整煞車、已送修">
    </textarea>


    <button
      class="resolve-btn"
      onclick="resolveReport('${report.id}')">

      ✅ 標記已解決

    </button>

  `;

}


/* =====================================================
   異常內容
===================================================== */

function getAbnormalText(
  report
){

  if(
    !report ||
    !report.abnormal_items
  ){

    return "異常未填寫";

  }


  if(
    Array.isArray(
      report.abnormal_items
    )
  ){

    return report.abnormal_items.join(
      "、"
    );

  }


  return String(
    report.abnormal_items
  );

}


/* =====================================================
   標記異常已解決
===================================================== */

async function resolveReport(
  reportId
){

  const noteElement =
    document.getElementById(
      `note-${reportId}`
    );


  const note =
    noteElement
      ? noteElement.value.trim()
      : "";


  const confirmed =
    confirm(
      "確認這筆異常已經處理完成嗎？"
    );


  if(!confirmed){

    return;

  }


  try{

    const result =
      await db
        .from("inspection_reports")
        .update({

          resolution_status:
            "resolved",

          resolved_at:
            new Date().toISOString(),

          resolution_note:
            note || null

        })
        .eq(
          "id",
          reportId
        );


    if(result.error){

      throw result.error;

    }


    /*
      從待處理清單移除
    */

    unresolvedReports =
      unresolvedReports.filter(
        report =>
          report.id !==
          reportId
      );


    updateSummary();

    renderVehicles();


    /*
      找回這筆紀錄的車輛
    */

    const report =
      latestReports.find(
        item =>
          item.id ===
          reportId
      );


    /*
      如果不是該車最新紀錄
      再從目前資料裡找
    */

    let vehicle = null;


    if(report){

      vehicle =
        vehicles.find(
          item =>
            item.id ===
            report.vehicle_id
        );

    }


    if(!vehicle){

      for(
        const v
        of vehicles
      ){

        const check =
          await db
            .from("inspection_reports")
            .select("vehicle_id")
            .eq(
              "id",
              reportId
            )
            .limit(1);


        if(
          !check.error &&
          check.data &&
          check.data.length
        ){

          vehicle =
            vehicles.find(
              item =>
                item.id ===
                check.data[0].vehicle_id
            );

        }

        break;

      }

    }


    if(vehicle){

      await openHistory(
        vehicle
      );

    }


    alert(
      "✅ 已標記為解決"
    );

  }

  catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}

              : "尚未設定"

        </strong>

        <br>


        目前里程：
        <strong>

          ${
            oil.current !== null

              ? Number(

              : "尚無巡檢里程"
          }

        </strong>

        <br>

        <strong>

/* =====================================================
   確認換機油
===================================================== */

async function confirmOilChange(
  vehicleId
){

  const vehicle =
    vehicles.find(
      item =>
        item.id ===
        vehicleId
    );


  const latest =
    vehicle
      ? latestReport(
          vehicle
        )
      : null;


  if(
    !vehicle ||
    !latest
  ){

    alert(
      "這台車目前沒有巡檢里程，無法設定換油基準。"
    );

    return;

  }


  const mileage =
    Number(
      latest.mileage ||
      0
    );


  const confirmed =
    confirm(

      `確認已更換機油？

CENTER：
${
        vehicle.center ||
        "未設定"
      }

目前里程：
${
        mileage.toLocaleString()
      } km

系統會以 ${
        mileage.toLocaleString()
      } km 作為新的換油基準。`

    );


  if(!confirmed){

    return;

  }


  try{

    const result =
      await db
        .from("vehicles")
        .update({

          last_oil_change_mileage:
            mileage

        })
        .eq(
          "id",
          vehicleId
        );


    if(result.error){

      throw result.error;

    }


    vehicle.last_oil_change_mileage =
      mileage;


    renderOilPanel(
      vehicle
    );

    renderVehicles();


    alert(

      `完成！

下一次換油里程：
${
        (
          mileage +
          OIL_INTERVAL
        ).toLocaleString()
      } km`

    );

  }

  catch(error){

    alert(
      "更新失敗：\n" +
      (
        error.message ||
        "未知錯誤"
      )
    );

  }

}


/* =====================================================
   日期格式
===================================================== */

function formatDateTime(
  value
){

  if(!value){

    return "尚無紀錄";

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "日期錯誤";

  }


  return date.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   HTML 安全處理
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
