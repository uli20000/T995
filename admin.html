<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">

  <title>KFC｜車輛巡檢後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --red: #c8102e;
      --black: #242424;
      --gray: #77736d;
      --linen: #f4f0e8;
      --paper: #ffffff;
      --line: #ddd8ce;
      --green: #356b4b;
      --green-bg: #eef5f0;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --yellow: #9a6b00;
      --yellow-bg: #fff8df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--linen);
      color: var(--black);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding-bottom: 50px;
    }

    .header {
      background: var(--paper);
      padding: 30px 20px 26px;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .eyebrow {
      color: var(--gray);
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .title-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .title {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
    }

    .kfc {
      color: var(--red);
      font-size: 28px;
      font-weight: 900;
    }

    .date {
      margin-top: 10px;
      color: var(--gray);
      font-size: 14px;
    }

    .section {
      padding: 22px 16px 0;
    }

    .section-title {
      margin-bottom: 14px;
      font-size: 20px;
      font-weight: 800;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 8px;
      text-align: center;
    }

    .summary-label {
      color: var(--gray);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-number {
      font-size: 30px;
      font-weight: 800;
    }

    .summary-card.done .summary-number {
      color: var(--green);
    }

    .summary-card.abnormal .summary-number {
      color: var(--danger);
    }

    .search-box {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .search-input {
      width: 100%;
      height: 54px;
      border: 2px solid #d8d3ca;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--red);
    }

    .vehicle-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vehicle-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 17px;
      cursor: pointer;
    }

    .vehicle-card:active {
      transform: scale(.99);
    }

    .vehicle-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .plate {
      font-size: 20px;
      font-weight: 800;
    }

    .status {
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-normal {
      background: var(--green-bg);
      color: var(--green);
    }

    .status-abnormal {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .status-none {
      background: #f1eee8;
      color: var(--gray);
    }

    .vehicle-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 12px;
      gap: 8px;
      color: var(--gray);
      font-size: 14px;
    }

    .vehicle-info strong {
      color: var(--black);
      font-size: 15px;
    }

    .empty,
    .loading {
      padding: 40px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--gray);
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 700px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--paper);
      border-radius: 25px 25px 0 0;
      padding: 24px 18px 35px;
    }

    .modal-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 25px;
      font-weight: 800;
    }

    .modal-subtitle {
      color: var(--gray);
      margin-top: 5px;
      font-size: 14px;
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #faf9f6;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .history-date {
      font-size: 14px;
      color: var(--gray);
    }

    .history-mileage {
      margin-top: 9px;
      font-size: 18px;
      font-weight: 800;
    }

    .history-abnormal {
      margin-top: 10px;
      padding: 10px;
      border-radius: 11px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .history-normal {
      margin-top: 10px;
      padding: 10px;
      border-radius: 11px;
      background: var(--green-bg);
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
    }

    .close-btn {
      width: 100%;
      height: 52px;
      margin-top: 20px;
      border: 0;
      border-radius: 15px;
      background: var(--black);
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .summary-number {
        font-size: 27px;
      }

      .title {
        font-size: 28px;
      }

      .kfc {
        font-size: 24px;
      }

      .vehicle-top {
        align-items: flex-start;
      }

      .plate {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">
    <div class="eyebrow">
      KFC DELIVERY CENTER
    </div>

    <div class="title-row">
      <h1 class="title">
        車輛巡檢後台
      </h1>

      <div class="kfc">
        KFC
      </div>
    </div>

    <div id="todayDate" class="date"></div>
  </header>


  <section class="section">

    <div class="section-title">
      今日巡檢
    </div>

    <div class="summary">

      <div class="summary-card">
        <div class="summary-label">
          車輛總數
        </div>

        <div id="totalCount" class="summary-number">
          —
        </div>
      </div>


      <div class="summary-card done">
        <div class="summary-label">
          已巡檢
        </div>

        <div id="doneCount" class="summary-number">
          —
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          未巡檢
        </div>

        <div id="pendingCount" class="summary-number">
          —
        </div>
      </div>


      <div class="summary-card abnormal">
        <div class="summary-label">
          今日異常
        </div>

        <div id="abnormalCount" class="summary-number">
          —
        </div>
      </div>

    </div>
  </section>


  <section class="section">

    <div class="section-title">
      查詢車輛
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        type="text"
        inputmode="text"
        placeholder="輸入車牌搜尋"
        autocomplete="off"
      >

    </div>

  </section>


  <section class="section">

    <div class="section-title">
      車輛列表
    </div>

    <div id="vehicleList" class="vehicle-list">

      <div class="loading">
        載入車輛資料中…
      </div>

    </div>

  </section>

</div>


<div id="modal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <div id="modalTitle" class="modal-title"></div>

      <div id="modalSubtitle" class="modal-subtitle"></div>

    </div>


    <div id="history" class="history"></div>


    <button id="closeModal" class="close-btn">
      關閉
    </button>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   DOM
===================================================== */

const vehicleList =
  document.getElementById("vehicleList");

const searchInput =
  document.getElementById("searchInput");

const totalCount =
  document.getElementById("totalCount");

const doneCount =
  document.getElementById("doneCount");

const pendingCount =
  document.getElementById("pendingCount");

const abnormalCount =
  document.getElementById("abnormalCount");

const todayDate =
  document.getElementById("todayDate");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalSubtitle =
  document.getElementById("modalSubtitle");

const historyContainer =
  document.getElementById("history");

const closeModal =
  document.getElementById("closeModal");


let vehicles = [];
let todayReports = [];
let latestReports = [];


/* =====================================================
   TODAY
===================================================== */

const now = new Date();

const todayStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate(),
    0,
    0,
    0
  );

const tomorrowStart =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + 1,
    0,
    0,
    0
  );


todayDate.textContent =
  now.toLocaleDateString(
    "zh-TW",
    {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    }
  );


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

  vehicleList.innerHTML = `
    <div class="loading">
      載入資料中…
    </div>
  `;

  try {

    /* 取得啟用車輛 */

    const vehicleResult =
      await db
        .from("vehicles")
        .select("*")
        .eq("active", true)
        .order("plate4", {
          ascending: true
        });


    if (vehicleResult.error) {
      throw vehicleResult.error;
    }


    vehicles =
      vehicleResult.data || [];


    /* 取得今日巡檢 */

    const todayResult =
      await db
        .from("inspection_reports")
        .select("*")
        .gte(
          "reported_at",
          todayStart.toISOString()
        )
        .lt(
          "reported_at",
          tomorrowStart.toISOString()
        )
        .order(
          "reported_at",
          {
            ascending: false
          }
        );


    if (todayResult.error) {
      throw todayResult.error;
    }


    todayReports =
      todayResult.data || [];


    /* 取得所有車輛最近紀錄 */

    latestReports = [];


    const latestResults =
      await Promise.all(
        vehicles.map(
          async vehicle => {

            const result =
              await db
                .from("inspection_reports")
                .select("*")
                .eq(
                  "vehicle_id",
                  vehicle.id
                )
                .order(
                  "reported_at",
                  {
                    ascending: false
                  }
                )
                .limit(1);


            if (
              result.error ||
              !result.data ||
              result.data.length === 0
            ) {
              return null;
            }


            return result.data[0];

          }
        )
      );


    latestReports =
      latestResults.filter(
        item => item !== null
      );


    updateSummary();

    renderVehicles();

  } catch (error) {

    console.error(
      "ADMIN ERROR:",
      error
    );


    vehicleList.innerHTML = `
      <div class="empty">

        <strong>
          資料讀取失敗
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}

      </div>
    `;

  }

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary() {

  const total =
    vehicles.length;


  const todayMap =
    new Map();


  todayReports.forEach(
    report => {

      if (
        !todayMap.has(
          report.vehicle_id
        )
      ) {

        todayMap.set(
          report.vehicle_id,
          report
        );

      }

    }
  );


  const done =
    todayMap.size;


  const pending =
    Math.max(
      total - done,
      0
    );


  let abnormal = 0;


  todayMap.forEach(
    report => {

      if (
        report.overall_status ===
        "abnormal"
      ) {

        abnormal++;

      }

    }
  );


  totalCount.textContent =
    total;

  doneCount.textContent =
    done;

  pendingCount.textContent =
    pending;

  abnormalCount.textContent =
    abnormal;

}


/* =====================================================
   RENDER VEHICLES
===================================================== */

function renderVehicles() {

  const keyword =
    searchInput.value
      .trim()
      .toUpperCase();


  const todayMap =
    new Map();


  todayReports.forEach(
    report => {

      if (
        !todayMap.has(
          report.vehicle_id
        )
      ) {

        todayMap.set(
          report.vehicle_id,
          report
        );

      }

    }
  );


  const filtered =
    vehicles.filter(
      vehicle => {

        if (!keyword) {
          return true;
        }


        return (
          String(
            vehicle.plate4 || ""
          )
          .toUpperCase()
          .includes(keyword)

          ||

          String(
            vehicle.full_plate || ""
          )
          .toUpperCase()
          .includes(keyword)
        );

      }
    );


  if (
    filtered.length === 0
  ) {

    vehicleList.innerHTML = `
      <div class="empty">
        找不到符合的車輛
      </div>
    `;

    return;

  }


  vehicleList.innerHTML = "";


  filtered.forEach(
    vehicle => {

      const todayReport =
        todayMap.get(
          vehicle.id
        );


      const latest =
        latestReports.find(
          report =>
            report.vehicle_id ===
            vehicle.id
        );


      let statusClass =
        "status-none";

      let statusText =
        "今日未巡檢";


      if (todayReport) {

        if (
          todayReport.overall_status ===
          "abnormal"
        ) {

          statusClass =
            "status-abnormal";

          statusText =
            "今日異常";

        } else {

          statusClass =
            "status-normal";

          statusText =
            "今日正常";

        }

      }


      const mileage =
        latest
          ? `${Number(latest.mileage).toLocaleString()} km`
          : "尚無資料";


      const lastTime =
        latest
          ? formatDateTime(
              latest.reported_at
            )
          : "尚無紀錄";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "vehicle-card";


      card.innerHTML = `

        <div class="vehicle-top">

          <div class="plate">
            ${escapeHtml(
              vehicle.full_plate ||
              vehicle.plate4 ||
              ""
            )}
          </div>

          <div class="status ${statusClass}">
            ${statusText}
          </div>

        </div>


        <div class="vehicle-info">

          <div>
            最新里程<br>
            <strong>
              ${mileage}
            </strong>
          </div>

          <div>
            最近巡檢<br>
            <strong>
              ${lastTime}
            </strong>
          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        () => {
          openHistory(vehicle);
        }
      );


      vehicleList.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   HISTORY
===================================================== */

async function openHistory(
  vehicle
) {

  modalTitle.textContent =
    vehicle.full_plate ||
    vehicle.plate4 ||
    "";


  modalSubtitle.textContent =
    "巡檢歷史紀錄";


  historyContainer.innerHTML = `
    <div class="loading">
      載入歷史紀錄中…
    </div>
  `;


  modal.classList.add(
    "show"
  );


  try {

    const result =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "vehicle_id",
          vehicle.id
        )
        .order(
          "reported_at",
          {
            ascending: false
          }
        );


    if (result.error) {
      throw result.error;
    }


    const reports =
      result.data || [];


    if (
      reports.length === 0
    ) {

      historyContainer.innerHTML = `
        <div class="empty">
          尚無巡檢紀錄
        </div>
      `;

      return;

    }


    historyContainer.innerHTML = "";


    reports.forEach(
      report => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        const isAbnormal =
          report.overall_status ===
          "abnormal";


        let abnormalText = "";


        if (
          report.abnormal_items
        ) {

          if (
            Array.isArray(
              report.abnormal_items
            )
          ) {

            abnormalText =
              report.abnormal_items.join(
                "\n"
              );

          } else {

            abnormalText =
              String(
                report.abnormal_items
              );

          }

        }


        card.innerHTML = `

          <div class="history-top">

            <div class="history-date">
              ${formatDateTime(
                report.reported_at
              )}
            </div>

            <div class="status ${
              isAbnormal
                ? "status-abnormal"
                : "status-normal"
            }">

              ${
                isAbnormal
                  ? "異常"
                  : "正常"
              }

            </div>

          </div>


          <div class="history-mileage">
            里程：
            ${Number(
              report.mileage || 0
            ).toLocaleString()}
            km
          </div>


          ${
            isAbnormal

              ? `

                <div class="history-abnormal">

                  <strong>
                    異常項目
                  </strong>

                  <br>

                  ${escapeHtml(
                    abnormalText ||
                    "未填寫異常說明"
                  )}

                </div>

              `

              : `

                <div class="history-normal">
                  本次巡檢全部正常
                </div>

              `
          }

        `;


        historyContainer.appendChild(
          card
        );

      }
    );


  } catch (error) {

    historyContainer.innerHTML = `
      <div class="empty">
        歷史紀錄讀取失敗
        <br><br>
        ${escapeHtml(
          error.message ||
          "未知錯誤"
        )}
      </div>
    `;

  }

}


/* =====================================================
   UTILITIES
===================================================== */

function formatDateTime(
  value
) {

  if (!value) {
    return "尚無紀錄";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "日期錯誤";

  }


  return date.toLocaleString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   EVENTS
===================================================== */

searchInput.addEventListener(
  "input",
  renderVehicles
);


closeModal.addEventListener(
  "click",
  () => {
    modal.classList.remove(
      "show"
    );
  }
);


modal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      modal
    ) {

      modal.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   START
===================================================== */

loadData();

</script>

</body>
</html>
