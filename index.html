<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">

  <title>KFC｜車輛管理</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --red: #c8102e;
      --black: #242424;
      --gray: #77736d;
      --linen: #f4f0e8;
      --paper: #ffffff;
      --line: #ddd8ce;
      --green: #356b4b;
      --green-bg: #eef5f0;
      --danger: #b42318;
      --danger-bg: #fff0ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--linen);
      color: var(--black);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
      text-align: center;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    /* =========================
       Header
    ========================= */

    .header {
      background: var(--paper);
      padding: 40px 20px 34px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .title {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .kfc {
      color: var(--red);
      font-size: 32px;
      font-weight: 900;
    }

    .intro {
      padding: 32px 20px 16px;
    }

    .intro h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .intro p {
      margin: 0;
      color: var(--gray);
      font-size: 16px;
    }

    /* =========================
       Card
    ========================= */

    .card {
      margin: 14px 16px;
      padding: 26px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .035);
    }

    .section-number {
      color: var(--red);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 2px solid #d8d3ca;
      border-radius: 15px;
      background: #fff;
      color: var(--black);
      outline: none;
      transition: .2s;
    }

    input {
      height: 62px;
      padding: 0 15px;
      font-size: 20px;
      text-align: center;
    }

    textarea {
      min-height: 90px;
      padding: 14px;
      font-size: 17px;
      text-align: left;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200, 16, 46, .08);
    }

    input::placeholder,
    textarea::placeholder {
      color: #aaa;
    }

    /* =========================
       Vehicle
    ========================= */

    .vehicle-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .vehicle-input {
      flex: 1;
      min-width: 0;
    }

    .read-btn {
      min-width: 112px;
      border: 2px solid var(--black);
      border-radius: 15px;
      background: #fff;
      color: #1683df;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .read-btn:disabled {
      opacity: .5;
    }

    .vehicle-success {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--green-bg);
      color: var(--green);
      font-size: 16px;
      font-weight: 700;
    }

    .vehicle-success.show {
      display: block;
    }

    /* =========================
       Previous record
    ========================= */

    .previous {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #f8f6f1;
      border-radius: 15px;
      border: 1px solid var(--line);
    }

    .previous.show {
      display: block;
    }

    .previous-title {
      color: var(--gray);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .previous-main {
      font-size: 17px;
      font-weight: 700;
    }

    .previous-detail {
      margin-top: 6px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.7;
    }

    /* =========================
       Checks
    ========================= */

    .checks {
      text-align: center;
    }

    .check-item {
      padding: 20px 0;
      border-bottom: 1px solid #ebe7df;
    }

    .check-item:last-child {
      border-bottom: 0;
    }

    .check-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .option {
      width: 110px;
      height: 48px;
      border: 2px solid #ddd8ce;
      border-radius: 25px;
      background: #fff;
      color: var(--gray);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .option.normal.selected {
      border-color: #a7c4b0;
      background: var(--green-bg);
      color: var(--green);
    }

    .option.abnormal.selected {
      border-color: #e4aaa4;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .abnormal-box {
      display: none;
      margin-top: 14px;
    }

    .abnormal-box.show {
      display: block;
    }

    .required {
      margin-top: 6px;
      color: var(--danger);
      font-size: 13px;
    }

    /* =========================
       Status
    ========================= */

    .status-card {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      line-height: 1.6;
    }

    .status-card.show {
      display: block;
    }

    .status-abnormal {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* =========================
       Save
    ========================= */

    .save-btn {
      width: calc(100% - 32px);
      margin: 20px 16px 0;
      height: 64px;
      border: 0;
      border-radius: 18px;
      background: var(--red);
      color: white;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(200, 16, 46, .18);
    }

    .save-btn:disabled {
      opacity: .5;
    }

    .hint {
      padding: 18px 28px 0;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       Mode Menu
    ========================= */

    .mode-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 18px 16px 22px;
    }

    .mode-btn {
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      color: var(--black);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .035);
      cursor: pointer;
      padding: 18px;
    }

    .mode-btn .mode-icon {
      display: block;
      font-size: 34px;
      margin-bottom: 8px;
    }

    .mode-btn .mode-name {
      display: block;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .mode-btn .mode-sub {
      display: block;
      margin-top: 5px;
      color: var(--gray);
      font-size: 13px;
    }

    .mode-page {
      display: none;
    }

    /* =========================
       Claim
    ========================= */

    .select-wrap select {
      height: 62px;
      padding: 0 15px;
      font-size: 18px;
      text-align: center;
    }

    .claim-options {
      display: grid;
      gap: 10px;
    }

    .claim-option {
      position: relative;
    }

    .claim-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .claim-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 10px 14px;
      border: 2px solid #ddd8ce;
      border-radius: 15px;
      background: #fff;
      color: var(--gray);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .claim-option input:checked + label {
      border-color: var(--red);
      background: var(--danger-bg);
      color: var(--red);
    }

    .claim-vehicle-info {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 15px;
      background: var(--green-bg);
      color: var(--green);
      font-weight: 700;
      line-height: 1.7;
    }

    .claim-vehicle-info.show {
      display: block;
    }

    .last-claim {
      display: none;
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 12px;
      background: #f8f6f1;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
    }

    .last-claim.show {
      display: block;
    }

    /* =========================
       Success
    ========================= */

    .success-panel {
      display: none;
      margin: 18px 16px 0;
      padding: 28px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .035);
      text-align: center;
    }

    .success-panel.show {
      display: block;
    }

    .success-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .success-title {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .success-data {
      text-align: left;
      padding: 16px;
      border-radius: 15px;
      background: #f8f6f1;
      line-height: 2;
      font-size: 16px;
    }

    .success-greeting {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.8;
    }

    .success-greeting .small {
      display: block;
      margin-top: 5px;
      color: var(--gray);
      font-size: 14px;
      font-weight: 500;
    }

    .back-home-btn {
      width: calc(100% - 32px);
      margin: 14px 16px 0;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: var(--black);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 500px) {

      .title {
        font-size: 36px;
      }

      .kfc {
        font-size: 29px;
      }

      .vehicle-row {
        flex-direction: column;
      }

      .read-btn {
        height: 56px;
      }

      .mode-menu {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<div class="page">

  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <div class="eyebrow">
      DELIVERY CENTER
    </div>

    <div class="header-row">

      <h1 class="title" id="pageTitle">
        車輛管理
      </h1>

      <div class="kfc">
        KFC
      </div>

    </div>

  </header>


  <!-- =========================
       INTRO
  ========================= -->

  <section class="intro">

    <h2 id="introTitle">
      上班領車・下班還車
    </h2>

    <p id="introText">
      上班先領車，下班完成還車巡檢。
    </p>

  </section>


  <!-- =========================
       MODE MENU
  ========================= -->

  <div id="modeMenu" class="mode-menu">

    <button
      id="claimModeBtn"
      class="mode-btn"
      type="button"
    >
      <span class="mode-icon">🚗</span>
      <span class="mode-name">領車</span>
      <span class="mode-sub">開始上班</span>
    </button>

    <button
      id="returnModeBtn"
      class="mode-btn"
      type="button"
    >
      <span class="mode-icon">🏠</span>
      <span class="mode-name">還車</span>
      <span class="mode-sub">完成下班巡檢</span>
    </button>

  </div>


  <!-- =========================
       CLAIM PAGE
  ========================= -->

  <section
    id="claimPage"
    class="mode-page"
  >

    <div id="claimForm">

      <!-- 領車人 -->

      <section class="card">

        <div class="section-number">
          01・領車人
        </div>

        <label class="label">
          領車人
        </label>

        <input
          id="claimantName"
          type="text"
          maxlength="3"
          placeholder="請輸入姓名"
          autocomplete="name"
        >

        <div
          class="hint"
          style="padding:10px 0 0;"
        >
          限填 3 個中文字
        </div>

      </section>


      <!-- 領車點 -->

      <section class="card">

        <div class="section-number">
          02・領車點
        </div>

        <label class="label">
          領車點
        </label>

        <div class="select-wrap">

          <select id="claimPoint">

            <option value="">
              請選擇領車點
            </option>

            <option>新竹中正</option>
            <option>新竹民生</option>
            <option>新竹光復</option>
            <option>新竹竹北</option>
            <option>新竹新豐</option>
            <option>龍潭北龍</option>
            <option>楊梅中山</option>
            <option>桃園大溪</option>
            <option>桃園大竹</option>
            <option>桃園大興西</option>
            <option>桃園萬壽</option>
            <option>桃園中山二</option>
            <option>林口文化</option>
            <option>南崁中正</option>
            <option>中壢中正</option>
            <option>中壢環中東</option>

          </select>

        </div>

      </section>


      <!-- 車輛 -->

      <section class="card">

        <div class="section-number">
          03・車輛
        </div>

        <label class="label">
          車牌
        </label>

        <div class="vehicle-row">

          <div class="vehicle-input">

            <input
              id="claimPlate"
              type="text"
              inputmode="numeric"
              maxlength="8"
              placeholder="輸入車牌四碼"
              autocomplete="off"
            >

          </div>

          <button
            id="claimReadBtn"
            class="read-btn"
            type="button"
          >
            讀取
          </button>

        </div>

        <div
          id="claimVehicleInfo"
          class="claim-vehicle-info"
        ></div>

        <div
          id="lastClaim"
          class="last-claim"
        ></div>

      </section>


      <!-- 行車紀錄器 -->

      <section class="card">

        <div class="section-number">
          04・行車紀錄器
        </div>

        <label class="label">
          行車紀錄器號碼
        </label>

        <input
          id="recorderNumber"
          type="text"
          maxlength="100"
          placeholder="請輸入紀錄器號碼"
          autocomplete="off"
        >

        <div
          class="hint"
          style="padding:10px 0 0;"
        >
          數字、英文、英數混合或自備皆可
        </div>

      </section>


      <!-- 油卡 -->

      <section class="card">

        <div class="section-number">
          05・油卡
        </div>

        <label class="label">
          油卡確認
        </label>

        <div class="claim-options">

          <div class="claim-option">

            <input
              id="oilCardReceived"
              type="radio"
              name="oilCardStatus"
              value="已領油卡"
            >

            <label for="oilCardReceived">
              已領油卡
            </label>

          </div>


          <div class="claim-option">

            <input
              id="oilCardLost"
              type="radio"
              name="oilCardStatus"
              value="油卡遺失"
            >

            <label for="oilCardLost">
              油卡遺失
            </label>

          </div>


          <div class="claim-option">

            <input
              id="oilCardElectric"
              type="radio"
              name="oilCardStatus"
              value="電車無油卡"
            >

            <label for="oilCardElectric">
              電車無油卡
            </label>

          </div>

        </div>

      </section>


      <button
        id="claimSaveBtn"
        class="save-btn"
        type="button"
      >
        送出領車紀錄
      </button>


      <button
        id="claimBackBtn"
        class="back-home-btn"
        type="button"
      >
        返回首頁
      </button>

    </div>


    <!-- 領車成功 -->

    <div
      id="claimSuccess"
      class="success-panel"
    >

      <div class="success-icon">
        ✓
      </div>

      <div class="success-title">
        領車成功
      </div>

      <div
        id="claimSuccessData"
        class="success-data"
      ></div>

      <div class="success-greeting">

        準備出發！今天也請安全騎車，順利完成每一趟配送 💪

        <span class="small">
          確認車況後再出發，祝你一路平安。
        </span>

      </div>

      <button
        id="claimSuccessHomeBtn"
        class="back-home-btn"
        type="button"
      >
        返回首頁
      </button>

    </div>

  </section>


  <!-- =========================
       INSPECTION / RETURN PAGE
  ========================= -->

  <section
    id="inspectionPage"
    class="mode-page"
  >

    <div id="inspectionForm">


      <!-- =========================
           01 車輛
      ========================= -->

      <section class="card">

        <div class="section-number">
          01・車輛
        </div>

        <label class="label">
          車牌
        </label>

        <div class="vehicle-row">

          <div class="vehicle-input">

            <input
              id="plate"
              type="text"
              inputmode="numeric"
              maxlength="8"
              placeholder="輸入車牌四碼"
              autocomplete="off"
            >

          </div>

          <button
            id="readBtn"
            class="read-btn"
            type="button"
          >
            讀取
          </button>

        </div>


        <div
          id="vehicleSuccess"
          class="vehicle-success"
        ></div>


        <div
          id="previousRecord"
          class="previous"
        >

          <div class="previous-title">
            最近一次巡檢
          </div>

          <div
            id="previousMain"
            class="previous-main"
          ></div>

          <div
            id="previousDetail"
            class="previous-detail"
          ></div>

        </div>

      </section>


      <!-- =========================
           02 里程
      ========================= -->

      <section class="card">

        <div class="section-number">
          02・里程
        </div>

        <label class="label">
          目前里程
        </label>

        <input
          id="mileage"
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="請輸入目前里程"
        >

      </section>


      <!-- =========================
           03 填表人
      ========================= -->

      <section class="card">

        <div class="section-number">
          03・填表人
        </div>

        <label class="label">
          填表人
        </label>

        <input
          id="reporterName"
          type="text"
          maxlength="3"
          placeholder="請輸入姓名"
          autocomplete="name"
        >

        <div
          class="hint"
          style="padding:10px 0 0;"
        >
          限填 3 個中文字
        </div>

      </section>


      <!-- =========================
           04 CHECK
      ========================= -->

      <section class="card">

        <div class="section-number">
          04・CHECK
        </div>

        <div
          id="checks"
          class="checks"
        ></div>


        <div
          id="statusCard"
          class="status-card"
        ></div>

      </section>


      <!-- =========================
           SAVE
      ========================= -->

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        儲存巡檢紀錄
      </button>


      <div class="hint">
        每次巡檢都會新增一筆紀錄，不會覆蓋過去資料。
      </div>

    </div>


    <!-- 還車成功 -->

    <div
      id="inspectionSuccess"
      class="success-panel"
    >

      <div class="success-icon">
        ✓
      </div>

      <div class="success-title">
        還車完成
      </div>

      <div
        id="inspectionSuccessData"
        class="success-data"
      ></div>

      <div class="success-greeting">

        今天辛苦了，安全回家 ❤️

        <span class="small">
          謝謝你完成今日巡檢，辛苦了！
        </span>

      </div>

      <button
        id="inspectionSuccessHomeBtn"
        class="back-home-btn"
        type="button"
      >
        返回首頁
      </button>

    </div>

  </section>

</div>

function getClaimPlate4() {

    );

  }


  return "";

}


/* =====================================================
   TODAY RANGE
   ===================================================== */

function getTodayRange() {

  const now =
    new Date();

  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      0,
      0,
      0,
      0
    );

  const end =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1,
      0,
      0,
      0,
      0
    );


  return {

    start:
      start.toISOString(),

    end:
      end.toISOString()

  };

}


/* =====================================================
   CLAIM - READ VEHICLE
   ===================================================== */

async function loadClaimVehicle() {

  const plate4 =
    getClaimPlate4();


  if (
    plate4.length !== 4
  ) {

    alert(
      "請輸入正確的車牌四碼。"
    );

    claimPlateInput.focus();

    return;

  }


  claimReadBtn.disabled =
    true;

  claimReadBtn.textContent =
    "讀取中…";


  claimVehicleInfo
    .classList
    .remove("show");

  lastClaim
    .classList
    .remove("show");

  currentClaimVehicle = null;


  try {

    const result =
      await db
        .from("vehicles")
        .select("*")
        .eq(
          "plate4",
          plate4
        )
        .eq(
          "active",
          true
        )
        .maybeSingle();


    if (result.error) {

      console.error(
        "CLAIM VEHICLE ERROR:",
        result.error
      );

      alert(
        "讀取失敗\n\n" +
        "錯誤代碼：" +
        (result.error.code || "無") +
        "\n\n" +
        "錯誤訊息：" +
        (result.error.message || "無")
      );

      return;

    }


    const vehicle =
      result.data;


    if (!vehicle) {

      alert(
        `讀取失敗\n\n查無車牌 ${plate4}\n\n請確認這台車是否在系統內。`
      );

      return;

    }


    currentClaimVehicle =
      vehicle;


    claimPlateInput.value =
      vehicle.full_plate ||
      plate4;


    claimPlateInput.dataset.plate4 =
      plate4;


    claimVehicleInfo.innerHTML =
      `✓ 車輛讀取成功<br>` +
      `車牌：${escapeHtml(
        vehicle.full_plate || plate4
      )}` +
      (
        vehicle.center
          ? `<br>CENTER：${escapeHtml(
              vehicle.center
            )}`
          : ""
      );


    claimVehicleInfo
      .classList
      .add("show");


    /* 查詢今天最後一筆領車 */

    const range =
      getTodayRange();


    const claimResult =
      await db
        .from("claim_records")
        .select(
          "claimant_name, claimed_at"
        )
        .eq(
          "vehicle_id",
          vehicle.id
        )
        .gte(
          "claimed_at",
          range.start
        )
        .lt(
          "claimed_at",
          range.end
        )
        .order(
          "claimed_at",
          {
            ascending: false
          }
        )
        .limit(1);


    if (claimResult.error) {

      console.error(
        "CLAIM HISTORY ERROR:",
        claimResult.error
      );

      alert(
        "車輛讀取成功，但今日領車紀錄讀取失敗。\n\n" +
        "錯誤訊息：" +
        (
          claimResult.error.message ||
          "無"
        )
      );

      return;

    }


    if (
      claimResult.data &&
      claimResult.data.length > 0
    ) {

      const last =
        claimResult.data[0];


      const time =
        new Date(
          last.claimed_at
        )
        .toLocaleTimeString(
          "zh-TW",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      lastClaim.textContent =
        `上次領車：${last.claimant_name}｜${time}`;


      lastClaim
        .classList
        .add("show");

    }

  } catch (error) {

    console.error(
      "CLAIM VEHICLE UNEXPECTED ERROR:",
      error
    );

    alert(
      "讀取失敗\n\n" +
      "錯誤：" +
      (error.message || error)
    );

  } finally {

    claimReadBtn.disabled =
      false;

    claimReadBtn.textContent =
      "重新讀取";

  }

}

/* =====================================================

function validateClaimForm() {

  const claimantName =
    claimantNameInput.value.trim();


  if (
    !/^[\u4e00-\u9fff]{3}$/.test(
      claimantName
    )
  ) {

    alert(
      "請輸入正確的領車人姓名。\n\n" +
      "限 3 個中文字，例如：王小明"
    );

    claimantNameInput.focus();

    return false;

  }


  if (
    !claimPointInput.value
  ) {

    alert(
      "請選擇領車點。"
    );

    claimPointInput.focus();

    return false;

  }


  if (
    !currentClaimVehicle
  ) {

    alert(
      "請先輸入車牌並按「讀取」。"
    );

    claimPlateInput.focus();

    return false;

  }


  if (
    !recorderNumberInput.value.trim()
  ) {

    alert(
      "請輸入行車紀錄器號碼。"
    );

    recorderNumberInput.focus();

    return false;

  }


  if (
    !getSelectedOilCardStatus()
  ) {

    alert(
      "請確認油卡狀態。"
    );

    return false;

  }


  return true;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

function renderChecks() {

  checksContainer.innerHTML = "";


  checkItems.forEach(item => {

    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.className =
      "check-item";


    wrapper.innerHTML = `

      <div class="check-name">
        ${item.name}
      </div>

      <div class="options">

        <button
          type="button"
          class="option normal"
          data-key="${item.key}"
          data-status="normal"
        >
          正常
        </button>

        <button
          type="button"
          class="option abnormal"
          data-key="${item.key}"
          data-status="abnormal"
        >
          異常
        </button>

      </div>


      <div
        class="abnormal-box"
        id="note-${item.key}"
      >

        <textarea
          placeholder="請輸入${item.name}異常狀況"
        ></textarea>

        <div class="required">
          異常時請填寫說明
        </div>

      </div>

    `;


    checksContainer
      .appendChild(
        wrapper
      );

  });


  document
    .querySelectorAll(".option")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const key =
            this.dataset.key;

          const status =
            this.dataset.status;


          checkState[key].status =
            status;


          const parent =
            this.closest(
              ".check-item"
            );


          parent
            .querySelectorAll(
              ".option"
            )
            .forEach(btn => {

              btn.classList.remove(
                "selected"
              );

            });


          this.classList.add(
            "selected"
          );


          const noteBox =
            document.getElementById(
              `note-${key}`
            );


          if (
            status === "abnormal"
          ) {

            noteBox
              .classList
              .add("show");

          } else {

            noteBox
              .classList
              .remove("show");


            const textarea =
              noteBox.querySelector(
                "textarea"
              );


            textarea.value = "";

            checkState[key].note =
              "";

          }


          updateStatus();

        }
      );

    });


  document
    .querySelectorAll(
      ".abnormal-box textarea"
    )
    .forEach(textarea => {

      textarea.addEventListener(
        "input",
        function() {

          const key =
            this.closest(
              ".abnormal-box"
            )
            .id
            .replace(
              "note-",
              ""
            );


          checkState[key].note =
            this.value;

        }
      );

    });

}

function updateStatus() {

  const abnormalItems =
    checkItems
      .filter(item =>
        checkState[
          item.key
        ].status === "abnormal"
      )
      .map(item =>
        item.name
      );


  if (
    abnormalItems.length === 0
  ) {

    statusCard.className =
      "status-card";

    statusCard.textContent =
      "";

    return;

  }


  statusCard.className =
    "status-card show status-abnormal";


  statusCard.textContent =
    `⚠ ${abnormalItems.length} 項異常：${abnormalItems.join("、")}`;

}


/* =====================================================
   VALIDATE INSPECTION
   ===================================================== */

function validateForm() {

  if (!currentVehicle) {

    alert(
      "請先輸入車牌並按「讀取」。"
    );

    return false;

  }


  const mileage =
    Number(
      mileageInput.value
    );


  if (
    !mileageInput.value ||
    !Number.isFinite(mileage) ||
    mileage < 0
  ) {

    alert(
      "請輸入目前里程。"
    );

    mileageInput.focus();

    return false;

  }


  const reporterName =
    reporterNameInput.value.trim();


  if (
    !/^[\u4e00-\u9fff]{3}$/.test(
      reporterName
    )
  ) {

    alert(
      "請輸入正確的填表人姓名。\n\n" +
      "限 3 個中文字，例如：王小明"
    );

    reporterNameInput.focus();

    return false;

  }


  for (
    const item of checkItems
  ) {

    const state =
      checkState[
        item.key
      ];


    if (!state.status) {

      alert(
        `請完成「${item.name}」檢查。`
      );

      return false;

    }


    if (
      state.status === "abnormal" &&
      !state.note.trim()
    ) {

      alert(
        `「${item.name}」選擇異常，請填寫異常說明。`
      );


      const textarea =
        document.querySelector(
          `#note-${item.key} textarea`
        );


      if (textarea) {

        textarea.focus();

      }


      return false;

    }

  }


  return true;

}


/* =====================================================
   SAVE INSPECTION
   ===================================================== */

async function saveRecord() {

  if (
    !validateForm()
  ) {

    return;

  }


  const mileage =
    Number(
      mileageInput.value
    );


  const abnormalItems =
    checkItems
      .filter(item =>
        checkState[
          item.key
        ].status === "abnormal"
      )
      .map(item => {

        if (
          checkState[
            item.key
          ].note.trim()
        ) {

          return (
            `${item.name}：` +
            `${checkState[item.key].note.trim()}`
          );

        }


        return item.name;

      });


  const overallStatus =
    abnormalItems.length > 0
      ? "abnormal"
      : "normal";


  const record = {

    vehicle_id:
      currentVehicle.id,

    mileage:
      mileage,

    reporter_name:
      reporterNameInput.value.trim(),

    oil_light:
      checkState.oil_light.status,

    front_tire:
      checkState.front_tire.status,

    rear_tire:
      checkState.rear_tire.status,

    brake:
      checkState.brake.status,

    headlight:
      checkState.headlight.status,

    brake_light:
      checkState.brake_light.status,

    other:
      checkState.other.status,

    overall_status:
      overallStatus,

    abnormal_items:
      abnormalItems

  };


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "儲存中…";


  try {

    const result =
      await db
        .from(
          "inspection_reports"
        )
        .insert(
          record
        );


    if (
      result.error
    ) {

      console.error(
        "SAVE ERROR:",
        result.error
      );


      alert(
        "儲存失敗\n\n" +
        "錯誤代碼：" +
        (
          result.error.code ||
          "無"
        ) +
        "\n\n" +
        "錯誤訊息：" +
        (
          result.error.message ||
          "無"
        ) +
        "\n\n" +
        "詳細：" +
        (
          result.error.details ||
          "無"
        )
      );


      return;

    }


    /* =========================
       還車成功
    ========================= */

    const fullPlate =
      currentVehicle.full_plate ||
      plateInput.dataset.plate4 ||
      plateInput.value;


    const time =
      new Date()
        .toLocaleString(
          "zh-TW",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }
        );


    inspectionSuccessData.innerHTML =

      `<strong>車牌：</strong>` +
      `${escapeHtml(
        fullPlate
      )}<br>` +

      `<strong>里程：</strong>` +
      `${mileage.toLocaleString()} km<br>` +

      `<strong>填表人：</strong>` +
      `${escapeHtml(
        reporterNameInput.value.trim()
      )}<br>` +

      `<strong>整體狀態：</strong>` +
      `${
        overallStatus === "abnormal"
          ? "異常"
          : "正常"
      }<br>` +

      `<strong>完成時間：</strong>` +
      `${escapeHtml(
        time
      )}`;


    inspectionForm.style.display =
      "none";


    inspectionSuccess
      .classList
      .add("show");


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  } catch (error) {

    console.error(
      "SAVE UNEXPECTED ERROR:",
      error
    );


    alert(
      "儲存失敗\n\n" +
      "錯誤：" +
      (error.message || error)
    );


  } finally {

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "儲存巡檢紀錄";

  }

}


/* =====================================================
   SAVE BUTTON
   ===================================================== */

saveBtn.addEventListener(
  "click",
  saveRecord
);

</script>

</body>
</html>
