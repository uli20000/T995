<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">

  <title>KFC｜車輛管理</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --red: #c8102e;
      --black: #242424;
      --gray: #77736d;
      --linen: #f4f0e8;
      --paper: #ffffff;
      --line: #ddd8ce;
      --green: #356b4b;
      --green-bg: #eef5f0;
      --danger: #b42318;
      --danger-bg: #fff0ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--linen);
      color: var(--black);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
      text-align: center;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    .header {
      background: var(--paper);
      padding: 40px 20px 34px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .title {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .kfc {
      color: var(--red);
      font-size: 32px;
      font-weight: 900;
    }

    .intro {
      padding: 32px 20px 16px;
    }

    .intro h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .intro p {
      margin: 0;
      color: var(--gray);
      font-size: 16px;
    }

    .mode-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 10px 16px 0;
    }

    .mode-btn {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      min-height: 150px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,.035);
    }

    .mode-btn .icon {
      display: block;
      font-size: 42px;
      margin-bottom: 12px;
    }

    .mode-btn .main {
      display: block;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .mode-btn .sub {
      display: block;
      color: var(--gray);
      font-size: 14px;
    }

    .mode-page {
      display: none;
    }

    .card {
      margin: 14px 16px;
      padding: 26px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .035);
    }

    .section-number {
      color: var(--red);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 2px solid #d8d3ca;
      border-radius: 15px;
      background: #fff;
      color: var(--black);
      outline: none;
      transition: .2s;
    }

    input,
    select {
      height: 62px;
      padding: 0 15px;
      font-size: 20px;
      text-align: center;
    }

    textarea {
      min-height: 90px;
      padding: 14px;
      font-size: 17px;
      text-align: left;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200,16,46,.08);
    }

    input::placeholder,
    textarea::placeholder {
      color: #aaa;
    }

    .vehicle-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .vehicle-input {
      flex: 1;
      min-width: 0;
    }

    .read-btn {
      min-width: 112px;
      border: 2px solid var(--black);
      border-radius: 15px;
      background: #fff;
      color: #1683df;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .read-btn:disabled {
      opacity: .5;
    }

    .vehicle-success {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--green-bg);
      color: var(--green);
      font-size: 16px;
      font-weight: 700;
    }

    .vehicle-success.show {
      display: block;
    }

    .previous {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #f8f6f1;
      border-radius: 15px;
      border: 1px solid var(--line);
    }

    .previous.show {
      display: block;
    }

    .previous-title {
      color: var(--gray);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .previous-main {
      font-size: 17px;
      font-weight: 700;
    }

    .previous-detail {
      margin-top: 6px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.7;
    }

    .claim-vehicle-info {
      margin-top: 12px;
      color: var(--green);
      font-weight: 700;
      line-height: 1.7;
    }

    .last-claim {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: #f8f6f1;
      border: 1px solid var(--line);
      line-height: 1.7;
    }

    .last-claim.show {
      display: block;
    }

    .claim-options {
      display: grid;
      gap: 10px;
    }

    .claim-option {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .claim-option input {
      display: none;
    }

    .claim-option label {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd8ce;
      border-radius: 15px;
      background: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .claim-option input:checked + label {
      border-color: var(--red);
      color: var(--red);
      background: var(--danger-bg);
    }

    .checks {
      text-align: center;
    }

    .check-item {
      padding: 20px 0;
      border-bottom: 1px solid #ebe7df;
    }

    .check-item:last-child {
      border-bottom: 0;
    }

    .check-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .option {
      width: 110px;
      height: 48px;
      border: 2px solid #ddd8ce;
      border-radius: 25px;
      background: #fff;
      color: var(--gray);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .option.normal.selected {
      border-color: #a7c4b0;
      background: var(--green-bg);
      color: var(--green);
    }

    .option.abnormal.selected {
      border-color: #e4aaa4;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .abnormal-box {
      display: none;
      margin-top: 14px;
    }

    .abnormal-box.show {
      display: block;
    }

    .required {
      margin-top: 6px;
      color: var(--danger);
      font-size: 13px;
    }

    .status-card {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      line-height: 1.6;
    }

    .status-card.show {
      display: block;
    }

    .status-abnormal {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .save-btn {
      width: calc(100% - 32px);
      margin: 20px 16px 0;
      height: 64px;
      border: 0;
      border-radius: 18px;
      background: var(--red);
      color: white;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(200,16,46,.18);
    }

    .save-btn:disabled {
      opacity: .5;
    }

    .back-home-btn {
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      height: 56px;
      border: 2px solid #d8d3ca;
      border-radius: 18px;
      background: #fff;
      color: var(--black);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-home-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .hint {
      padding: 18px 28px 0;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.7;
    }

    .success-panel {
      display: none;
      margin: 20px 16px;
      padding: 30px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.035);
    }

    .success-panel.show {
      display: block;
    }

    .success-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--green-bg);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
    }

    .success-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .success-data {
      padding: 18px;
      background: #f8f6f1;
      border-radius: 15px;
      line-height: 2;
      text-align: left;
    }

    .success-greeting {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.7;
    }

    .success-greeting .small {
      display: block;
      margin-top: 6px;
      color: var(--gray);
      font-size: 14px;
      font-weight: 400;
    }

    @media (max-width: 500px) {
      .title {
        font-size: 36px;
      }

      .kfc {
        font-size: 29px;
      }

      .mode-menu {
        grid-template-columns: 1fr;
      }

      .vehicle-row {
        flex-direction: column;
      }

      .read-btn {
        height: 56px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">
    <div class="eyebrow">DELIVERY CENTER</div>

    <div class="header-row">
      <h1 id="pageTitle" class="title">車輛管理</h1>
      <div class="kfc">KFC</div>
    </div>
  </header>

  <section class="intro">
    <h2 id="introTitle">上班領車・下班還車</h2>
  </section>

  <!-- =========================
       首頁
  ========================= -->

  <div id="modeMenu" class="mode-menu">

    <button id="claimModeBtn" class="mode-btn" type="button">
      <span class="icon">🚗</span>
      <span class="main">領車</span>
      <span class="sub">開始上班</span>
    </button>

    <button id="returnModeBtn" class="mode-btn" type="button">
      <span class="icon">🏠</span>
      <span class="main">還車</span>
      <span class="sub">下班前完成巡檢</span>
    </button>

  </div>


  <!-- =========================
       領車
  ========================= -->

  <section id="claimPage" class="mode-page">

    <div id="claimForm">

      <section class="card">
        <div class="section-number">01・領車人</div>

        <label class="label">領車人</label>

        <input
          id="claimantName"
          type="text"
          maxlength="3"
          placeholder="請輸入姓名"
          autocomplete="name"
        >

        <div class="hint" style="padding:10px 0 0;">
          限填 3 個中文字
        </div>
      </section>


      <section class="card">
        <div class="section-number">02・領車點</div>

        <label class="label">領車點</label>

        <div>
          <select id="claimPoint">
            <option value="">請選擇領車點</option>
            <option>新竹中正</option>
            <option>新竹民生</option>
            <option>新竹光復</option>
            <option>新竹竹北</option>
            <option>新竹新豐</option>
            <option>龍潭北龍</option>
            <option>楊梅中山</option>
            <option>桃園大溪</option>
            <option>桃園大竹</option>
            <option>桃園大興西</option>
            <option>桃園萬壽</option>
            <option>桃園中山二</option>
            <option>林口文化</option>
            <option>南崁中正</option>
            <option>中壢中正</option>
            <option>中壢環中東</option>
          </select>
        </div>
      </section>


      <section class="card">
        <div class="section-number">03・車輛</div>

        <label class="label">車牌</label>

        <div class="vehicle-row">

          <div class="vehicle-input">
            <input
              id="claimPlate"
              type="text"
              inputmode="numeric"
              maxlength="8"
              placeholder="輸入車牌四碼"
              autocomplete="off"
            >
          </div>

          <button
            id="claimReadBtn"
            class="read-btn"
            type="button"
          >
            讀取
          </button>

        </div>

        <div id="claimVehicleInfo" class="claim-vehicle-info"></div>

        <div id="lastClaim" class="last-claim"></div>

      </section>


      <section class="card">
        <div class="section-number">04・行車紀錄器</div>

        <label class="label">
          行車紀錄器號碼
        </label>

        <input
          id="recorderNumber"
          type="text"
          maxlength="100"
          placeholder="請輸入紀錄器號碼"
          autocomplete="off"
        >

        <div class="hint" style="padding:10px 0 0;">
          數字、英文、英數混合或自備皆可
        </div>
      </section>


      <section class="card">
        <div class="section-number">05・油卡</div>

        <label class="label">
          油卡確認
        </label>

        <div class="claim-options">

          <div class="claim-option">
            <input
              id="oilCardReceived"
              type="radio"
              name="oilCardStatus"
              value="已領油卡"
            >
            <label for="oilCardReceived">
              已領油卡
            </label>
          </div>

          <div class="claim-option">
            <input
              id="oilCardLost"
              type="radio"
              name="oilCardStatus"
              value="油卡遺失"
            >
            <label for="oilCardLost">
              油卡遺失
            </label>
          </div>

          <div class="claim-option">
            <input
              id="oilCardElectric"
              type="radio"
              name="oilCardStatus"
              value="電車無油卡"
            >
            <label for="oilCardElectric">
              電車無油卡
            </label>
          </div>

        </div>
      </section>


      <button
        id="claimSaveBtn"
        class="save-btn claim-submit"
        type="button"
      >
        送出領車紀錄
      </button>

      <button
        id="claimBackBtn"
        class="back-home-btn"
        type="button"
      >
        返回首頁
      </button>

    </div>


    <div id="claimSuccess" class="success-panel">

      <div class="success-icon">✓</div>

      <div class="success-title">
        領車成功
      </div>

      <div
        id="claimSuccessData"
        class="success-data"
      ></div>

      <div class="success-greeting">
        準備出發！今天也請安全騎車，順利完成每一趟配送 💪
        <span class="small">
          確認車況後再出發，祝你一路平安。
        </span>
      </div>

      <button
        id="claimSuccessHomeBtn"
        class="back-home-btn"
        type="button"
      >
        返回首頁
      </button>

    </div>

  </section>


  <!-- =========================
       還車
  ========================= -->

  <section id="inspectionPage" class="mode-page">

    <div id="inspectionForm">

      <!-- =========================
           01 車輛
      ========================= -->

      <section class="card">

        <div class="section-number">
          01・車輛
        </div>

        <label class="label">
          車牌
        </label>

        <div class="vehicle-row">

          <div class="vehicle-input">

            <input
              id="plate"
              type="text"
              inputmode="numeric"
              maxlength="8"
              placeholder="輸入車牌四碼"
              autocomplete="off"
            >

          </div>

          <button
            id="readBtn"
            class="read-btn"
            type="button"
          >
            讀取
          </button>

        </div>


        <div
          id="vehicleSuccess"
          class="vehicle-success"
        ></div>


        <div
          id="previousRecord"
          class="previous"
        >

          <div class="previous-title">
            最近一次巡檢
          </div>

          <div
            id="previousMain"
            class="previous-main"
          ></div>

          <div
            id="previousDetail"
            class="previous-detail"
          ></div>

        </div>

      </section>


      <!-- =========================
           02 里程
      ========================= -->

      <section class="card">

        <div class="section-number">
          02・里程
        </div>

        <label class="label">
          目前里程
        </label>

        <input
          id="mileage"
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="請輸入目前里程"
        >

      </section>


      <!-- =========================
           03 CHECK
      ========================= -->

      <section class="card">

        <div class="section-number">
          03・CHECK
        </div>

        <div
          id="checks"
          class="checks"
        ></div>


        <div
          id="statusCard"
          class="status-card"
        ></div>

      </section>


      <!-- =========================
           04 填寫人
      ========================= -->

      <section class="card">

        <div class="section-number">
          04・填寫人
        </div>

        <label class="label">
          巡檢人
        </label>

        <input
          id="reporterName"
          type="text"
          maxlength="3"
          placeholder="請輸入姓名"
          autocomplete="name"
        >

        <div class="hint" style="padding:10px 0 0;">
          限填 3 個中文字
        </div>

      </section>


      <!-- =========================
           SAVE
      ========================= -->

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        儲存巡檢紀錄
      </button>


      <!-- 新增：還車頁返回首頁 -->

      <button
        id="inspectionBackBtn"
        class="back-home-btn"
        type="button"
      >
        返回首頁
      </button>


      <div class="hint">
        每次巡檢都會新增一筆紀錄，不會覆蓋過去資料。
      </div>

    </div>


    <div
      id="inspectionSuccess"
      class="success-panel"
    >

      <div class="success-icon">
        ✓
      </div>

      <div class="success-title">
        還車完成
      </div>

      <div
        id="inspectionSuccessData"
        class="success-data"
      ></div>

      <div class="success-greeting">
        今天辛苦了，安全回家 ❤️
        <span class="small">
          謝謝你完成今日巡檢，辛苦了！
        </span>
      </div>

      <button
        id="inspectionSuccessHomeBtn"
        class="back-home-btn"
        type="button"
      >
        返回首頁
      </button>

    </div>

  </section>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51cm5ib3F3aGN0eXN3Y3Vma3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjE5MjMsImV4cCI6MjEwNTQ5NzkyM30.-OYo96FZ3Yz3tCsKDG0KqhUgQuxXUAGPHbtDXcd0yB8";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   CHECK ITEMS
   ===================================================== */

const checkItems = [

  {
    key: "oil_light",
    name: "機油燈"
  },

  {
    key: "front_tire",
    name: "前輪"
  },

  {
    key: "rear_tire",
    name: "後輪"
  },

  {
    key: "brake",
    name: "煞車"
  },

  {
    key: "headlight",
    name: "大燈"
  },

  {
    key: "brake_light",
    name: "煞車燈"
  },

  {
    key: "other",
    name: "其他"
  }

];


/* =====================================================
   STATE
   ===================================================== */

const checkState = {};

checkItems.forEach(item => {

  checkState[item.key] = {

    status: null,

    note: ""

  };

});


let currentVehicle = null;


/* =====================================================
   DOM
   ===================================================== */

const plateInput =
  document.getElementById("plate");

const readBtn =
  document.getElementById("readBtn");

const mileageInput =
  document.getElementById("mileage");

const reporterNameInput =
  document.getElementById("reporterName");

const vehicleSuccess =
  document.getElementById("vehicleSuccess");

const previousRecord =
  document.getElementById("previousRecord");

const previousMain =
  document.getElementById("previousMain");

const previousDetail =
  document.getElementById("previousDetail");

const checksContainer =
  document.getElementById("checks");

const statusCard =
  document.getElementById("statusCard");

const saveBtn =
  document.getElementById("saveBtn");


/* =====================================================
   RENDER CHECKS
   ===================================================== */

function renderChecks() {

  checksContainer.innerHTML = "";


  checkItems.forEach(item => {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "check-item";


    wrapper.innerHTML = `

      <div class="check-name">
        ${item.name}
      </div>

          type="button"
          class="option abnormal"
          data-key="${item.key}"
          data-status="abnormal"
        >
          異常
        </button>

      </div>


      <div
        class="abnormal-box"
        id="note-${item.key}"
      >

        <textarea
          placeholder="請輸入${item.name}異常狀況"
        ></textarea>

        <div class="required">
          異常時請填寫說明
        </div>

      </div>

    `;


    checksContainer.appendChild(wrapper);

  });


  document
    .querySelectorAll(".option")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const key =
            this.dataset.key;

          const status =
            this.dataset.status;


          checkState[key].status =
            status;


          const parent =
            this.closest(".check-item");


          parent
            .querySelectorAll(".option")
            .forEach(btn => {

              btn.classList.remove(
                "selected"
              );

            });


          this.classList.add(
            "selected"
          );


          const noteBox =
            document.getElementById(
              `note-${key}`
            );


          if (status === "abnormal") {

            noteBox.classList.add(
              "show"
            );

          } else {

            noteBox.classList.remove(
              "show"
            );


            const textarea =
              noteBox.querySelector(
                "textarea"
              );

            textarea.value = "";

            checkState[key].note =
              "";

          }


          updateStatus();

        }
      );

    });


  document
    .querySelectorAll(
      ".abnormal-box textarea"
    )
    .forEach(textarea => {

      textarea.addEventListener(
        "input",
        function() {

          const key =
            this.closest(
              ".abnormal-box"
            )
            .id
            .replace(
              "note-",
              ""
            );


          checkState[key].note =
            this.value;

        }
      );

    });

}

/* =====================================================
   GET PLATE
   ===================================================== */

function getPlate4() {

  const value =
    plateInput.value
      .trim()
      .toUpperCase();


  const numbers =
    value.replace(
      /\D/g,
      ""
    );


  if (
    numbers.length >= 4
  ) {

    return numbers.slice(-4);

  }


  return "";

}


/* =====================================================
   READ VEHICLE
   ===================================================== */

async function loadVehicle() {

  const plate4 =
    getPlate4();


  if (
    plate4.length !== 4
  ) {

    alert(
      "請輸入正確的車牌四碼。"
    );

    plateInput.focus();

    return;

  }


  readBtn.disabled = true;

  readBtn.textContent =
    "讀取中…";


  vehicleSuccess
    .classList
    .remove("show");


  previousRecord
    .classList
    .remove("show");


  currentVehicle = null;


  try {

    const result =
      await db
        .from("vehicles")
        .select("*")
        .eq(
          "plate4",
          plate4
        )
        .eq(
          "active",
          true
        )
        .maybeSingle();


    const vehicle =
      result.data;

    const error =
      result.error;


    if (error) {

      console.error(error);

      alert(
        "讀取車輛資料失敗，請稍後再試。"
      );

      return;

    }


    if (!vehicle) {

      alert(
        "查無此車牌，請確認輸入是否正確。"
      );

      return;

    }


    currentVehicle =
      vehicle;


    plateInput.value =
      vehicle.full_plate ||
      plate4;


    vehicleSuccess.innerHTML =
      `車牌確認成功：${vehicle.full_plate || plate4}`;

    vehicleSuccess
      .classList
      .add("show");


    const previous =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "vehicle_id",
          vehicle.id
        )
        .order(
          "reported_at",
          {
            ascending: false
          }
        )
        .limit(1)
        .maybeSingle();


    if (
      previous.error
    ) {

      console.error(
        previous.error
      );

    }


    if (
      previous.data
    ) {

      const record =
        previous.data;


      previousMain.textContent =
        `${record.mileage || 0} km・${record.overall_status === "normal" ? "正常" : "異常"}`;


      previousDetail.textContent =
        `巡檢時間：${formatDateTime(record.reported_at)}`;


      previousRecord
        .classList
        .add("show");

    }

  } catch (error) {

    console.error(error);

    alert(
      "系統發生錯誤，請稍後再試。"
    );

  } finally {

    readBtn.disabled = false;

    readBtn.textContent =
      "讀取";

  }

}

/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

  const abnormalItems =
    checkItems.filter(
      item =>
        checkState[item.key].status ===
        "abnormal"
    );


  if (
    abnormalItems.length === 0
  ) {

    statusCard
      .classList
      .remove("show");

    statusCard.textContent = "";

    return;

  }


  statusCard.innerHTML =
    `目前有 ${abnormalItems.length} 項異常，請確認異常說明。`;

  statusCard.className =
    "status-card show status-abnormal";

}


/* =====================================================
   DATE
   ===================================================== */

function formatDateTime(value) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  return date.toLocaleString(
    "zh-TW",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}

/* =====================================================
   VALIDATE INSPECTION
   ===================================================== */

function validateInspection() {

  if (!currentVehicle) {

    alert(
      "請先輸入車牌並按「讀取」。"
    );

    return false;

  }


  const mileage =
    Number(
      mileageInput.value
    );


  if (
    !mileageInput.value ||
    Number.isNaN(mileage) ||
    mileage < 0
  ) {

    alert(
      "請輸入目前里程。"
    );

    mileageInput.focus();

    return false;

  }


  const reporter =
    reporterNameInput.value.trim();


  if (
    !/^[\u4e00-\u9fff]{3}$/.test(
      reporter
    )
  ) {

    alert(
      "巡檢人請填寫 3 個中文字。"
    );

    reporterNameInput.focus();

    return false;

  }


  for (
    const item of checkItems
  ) {

    const state =
      checkState[item.key];


    if (!state.status) {

      alert(
        `請完成「${item.name}」檢查。`
      );

      return false;

    }


    if (
      state.status ===
      "abnormal" &&
      !state.note.trim()
    ) {

      alert(
        `「${item.name}」異常時，請填寫異常說明。`
      );

      const note =
        document.getElementById(
          `note-${item.key}`
        );


      const textarea =
        note.querySelector(
          "textarea"
        );


      textarea.focus();

      return false;

    }

  }


  return true;

}


/* =====================================================
   SAVE INSPECTION
   ===================================================== */

async function saveInspection() {

  if (
    !validateInspection()
  ) {

    return;

  }


  saveBtn.disabled = true;

  saveBtn.textContent =
    "儲存中…";


  try {

    const mileage =
      Number(
        mileageInput.value
      );


    const abnormalItems =
      checkItems
        .filter(
          item =>
            checkState[item.key].status ===
            "abnormal"
        )
        .map(
          item => {

            const note =
              checkState[item.key].note
                .trim();


            return note
              ? `${item.name}：${note}`
              : item.name;

          }
        );


    const overallStatus =
      abnormalItems.length > 0
        ? "abnormal"
        : "normal";


    const record = {

      vehicle_id:
        currentVehicle.id,

      mileage,

      oil_light:
        checkState.oil_light.status,

      front_tire:
        checkState.front_tire.status,

      rear_tire:
        checkState.rear_tire.status,

      brake:
        checkState.brake.status,

      headlight:
        checkState.headlight.status,

      brake_light:
        checkState.brake_light.status,

      other:
        checkState.other.status,

      overall_status:
        overallStatus,

      abnormal_items:
        abnormalItems,

      reporter_name:
        reporterNameInput.value.trim(),

      resolution_status:
        overallStatus === "abnormal"
          ? "pending"
          : null

    };


    const result =
      await db
        .from(
          "inspection_reports"
        )
        .insert(record)
        .select()
        .single();


    if (result.error) {

      console.error(
        result.error
      );

      alert(
        "巡檢紀錄儲存失敗，請確認資料庫欄位是否完整。"
      );

      return;

    }


    const saved =
      result.data;


    const successData =
      document.getElementById(
        "inspectionSuccessData"
      );


    successData.innerHTML = `

      <div>
        <strong>車牌：</strong>

        <strong>CENTER：</strong>

      <div>
        <strong>結果：</strong>
        ${
          overallStatus === "normal"
            ? "正常"
            : "異常"
        }
      </div>

      ${
        abnormalItems.length
          ? `
            <div>
              <strong>異常項目：</strong>
              ${abnormalItems.join("<br>")}
            </div>
          `
          : ""
      }

    `;

    document
      .getElementById(
        "inspectionSuccess"
      )
      .classList
      .add("show");


  } catch (error) {

    console.error(error);

    alert(
      "系統發生錯誤，請稍後再試。"
    );

  } finally {

    saveBtn.disabled = false;

    saveBtn.textContent =
      "儲存巡檢紀錄";

  }

}
