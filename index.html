<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">

  <title>KFC｜車輛巡檢</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --red: #c8102e;
      --black: #242424;
      --gray: #77736d;
      --light-gray: #aaa69f;
      --linen: #f4f0e8;
      --paper: #ffffff;
      --line: #ddd8ce;
      --green: #356b4b;
      --green-bg: #eef5f0;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --yellow: #9a6b00;
      --yellow-bg: #fff8df;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--linen);
      color: var(--black);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
      text-align: center;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    /* Header */
    .header {
      background: var(--paper);
      padding: 42px 24px 36px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .title {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .kfc {
      color: var(--red);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .intro {
      padding: 34px 24px 18px;
    }

    .intro h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .intro p {
      margin: 0;
      color: var(--gray);
      font-size: 16px;
    }

    /* Card */
    .card {
      margin: 14px 18px;
      padding: 26px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.035);
    }

    .section-number {
      color: var(--red);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .vehicle-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .vehicle-input {
      flex: 1;
      min-width: 0;
    }

    input,
    textarea {
      width: 100%;
      border: 2px solid #d8d3ca;
      border-radius: 15px;
      background: #fff;
      color: var(--black);
      font-size: 20px;
      outline: none;
      text-align: center;
      transition: .2s;
    }

    input {
      height: 64px;
      padding: 0 16px;
    }

    textarea {
      min-height: 90px;
      padding: 15px;
      resize: vertical;
      font-size: 17px;
      text-align: left;
    }

    input:focus,
    textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200,16,46,.08);
    }

    input::placeholder,
    textarea::placeholder {
      color: #aaa;
    }

    .read-btn {
      min-width: 116px;
      border: 2px solid var(--black);
      border-radius: 15px;
      background: #fff;
      color: #1683df;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .read-btn:active {
      transform: scale(.98);
    }

    .read-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .vehicle-success {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: var(--green-bg);
      color: var(--green);
      font-size: 16px;
      font-weight: 700;
    }

    .vehicle-success.show {
      display: block;
    }

    /* Previous record */
    .previous {
      display: none;
      margin-top: 18px;
      padding: 16px;
      background: #f8f6f1;
      border-radius: 15px;
      border: 1px solid var(--line);
    }

    .previous.show {
      display: block;
    }

    .previous-title {
      color: var(--gray);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .previous-main {
      font-size: 17px;
      font-weight: 700;
    }

    .previous-detail {
      margin-top: 6px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Mileage */
    .mileage-card {
      margin-top: 20px;
    }

    /* Checks */
    .checks {
      text-align: left;
    }

    .check-item {
      padding: 18px 0;
      border-bottom: 1px solid #ebe7df;
    }

    .check-item:last-child {
      border-bottom: 0;
    }

    .check-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .check-name {
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
    }

    .options {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .option {
      min-width: 70px;
      height: 46px;
      padding: 0 12px;
      border: 2px solid #ddd8ce;
      border-radius: 24px;
      background: #fff;
      color: var(--gray);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .option.normal.selected {
      border-color: #a7c4b0;
      background: var(--green-bg);
      color: var(--green);
    }

    .option.abnormal.selected {
      border-color: #e4aaa4;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .abnormal-box {
      display: none;
      margin-top: 13px;
    }

    .abnormal-box.show {
      display: block;
    }

    .abnormal-box textarea {
      border-color: #e4aaa4;
      background: #fffafa;
    }

    .required {
      color: var(--red);
      font-size: 13px;
      margin-top: 6px;
      text-align: center;
    }

    /* Status */
    .status-card {
      display: none;
      padding: 18px;
      border-radius: 15px;
      margin-top: 20px;
      font-weight: 800;
    }

    .status-card.show {
      display: block;
    }

    .status-normal {
      background: var(--green-bg);
      color: var(--green);
    }

    .status-abnormal {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* Save */
    .save-btn {
      width: calc(100% - 36px);
      margin: 20px 18px 0;
      height: 64px;
      border: 0;
      border-radius: 18px;
      background: var(--red);
      color: white;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(200,16,46,.18);
    }

    .save-btn:active {
      transform: scale(.99);
    }

    .save-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .hint {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.7;
      padding: 18px 30px 0;
    }

    /* Mobile */
    @media (max-width: 500px) {
      .header {
        padding-top: 35px;
      }

      .title {
        font-size: 38px;
      }

      .kfc {
        font-size: 30px;
      }

      .vehicle-row {
        flex-direction: column;
      }

      .read-btn {
        height: 56px;
      }

      .check-top {
        flex-direction: column;
        align-items: center;
      }

      .check-name {
        margin-bottom: 4px;
      }

      .options {
        width: 100%;
        justify-content: center;
      }

      .option {
        flex: 1;
        max-width: 120px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">
    <div class="eyebrow">DELIVERY CENTER</div>

    <div class="header-row">
      <h1 class="title">車輛巡檢</h1>
      <div class="kfc">KFC</div>
    </div>
  </header>

  <section class="intro">
    <h2>每日安全確認</h2>
    <p>輸入車牌與里程，快速完成七項檢查。</p>
  </section>

  <!-- 車輛 -->
  <section class="card">

    <div class="section-number">01・車輛</div>

    <label class="label" for="plate">車牌</label>

    <div class="vehicle-row">

      <div class="vehicle-input">
        <input
          id="plate"
          type="text"
          inputmode="numeric"
          maxlength="8"
          placeholder="輸入車牌四碼"
          autocomplete="off"
        >
      </div>

      <button
        id="readBtn"
        class="read-btn"
        type="button"
      >
        讀取
      </button>

    </div>

    <div id="vehicleSuccess" class="vehicle-success"></div>

    <div id="previousRecord" class="previous">
      <div class="previous-title">最近一次巡檢</div>
      <div id="previousMain" class="previous-main"></div>
      <div id="previousDetail" class="previous-detail"></div>
    </div>

  </section>


  <!-- 里程 -->
  <section class="card mileage-card">

    <div class="section-number">02・里程</div>

    <label class="label" for="mileage">目前里程</label>

    <input
      id="mileage"
      type="number"
      inputmode="numeric"
      min="0"
      placeholder="請輸入目前里程"
    >

  </section>


  <!-- 檢查 -->
  <section class="card">

    <div class="section-number">03・CHECK</div>

    <div id="checks"></div>

    <div id="statusCard" class="status-card"></div>

  </section>


  <button
    id="saveBtn"
    class="save-btn"
    type="button"
  >
    儲存巡檢紀錄
  </button>

  <div class="hint">
    每次巡檢都會新增一筆紀錄，不會覆蓋過去資料。
  </div>

</div>


<script>

  /* ==========================================
     SUPABASE 設定
     ========================================== */

  const SUPABASE_URL =
    "https://nurnboqwhctyswcufkyk.supabase.co";

  const SUPABASE_KEY =
    "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoibnVybmJvcXd1Y3R5c3djdWZreWt5IiwiaWF0IjoxNzg5OTIxOTIzLCJleHAiOjIxMDU0OTc5MjN9.-OYo96FZ3Yz3tCsKDG0KqhUgQuxXUAGPHbtDXcd0yB8";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* ==========================================
     檢查項目
     ========================================== */

  const checkItems = [
    {
      key: "oil_light",
      name: "機油燈"
    },
    {
      key: "front_tire",
      name: "前輪"
    },
    {
      key: "rear_tire",
      name: "後輪"
    },
    {
      key: "brake",
      name: "煞車"
    },
    {
      key: "headlight",
      name: "大燈"
    },
    {
      key: "brake_light",
      name: "煞車燈"
    },
    {
      key: "other",
      name: "其他"
    }
  ];


  const checkState = {};

  checkItems.forEach(item => {
    checkState[item.key] = {
      status: null,
      note: ""
    };
  });


  /* ==========================================
     DOM
     ========================================== */

  const plateInput = document.getElementById("plate");
  const readBtn = document.getElementById("readBtn");
  const mileageInput = document.getElementById("mileage");

  const vehicleSuccess =
    document.getElementById("vehicleSuccess");

  const previousRecord =
    document.getElementById("previousRecord");

  const previousMain =
    document.getElementById("previousMain");

  const previousDetail =
    document.getElementById("previousDetail");

  const checksContainer =
    document.getElementById("checks");

  const statusCard =
    document.getElementById("statusCard");

  const saveBtn =
    document.getElementById("saveBtn");


  let currentVehicle = null;


  /* ==========================================
     建立檢查項目
     ========================================== */

  function renderChecks() {

    checksContainer.innerHTML = "";

    checkItems.forEach(item => {

      const wrapper = document.createElement("div");

      wrapper.className = "check-item";

      wrapper.innerHTML = `
        <div class="check-top">

          <div class="check-name">
            ${item.name}
          </div>

          <div class="options">

            <button
              type="button"
              class="option normal"
              data-key="${item.key}"
              data-status="normal"
            >
              正常
            </button>

            <button
              type="button"
              class="option abnormal"
              data-key="${item.key}"
              data-status="abnormal"
            >
              異常
            </button>

          </div>

        </div>

        <div
          class="abnormal-box"
          id="note-${item.key}"
        >

          <textarea
            placeholder="請輸入 ${item.name} 異常狀況"
          ></textarea>

          <div class="required">
            異常時請填寫說明
          </div>

        </div>
      `;

      checksContainer.appendChild(wrapper);
    });


    document
      .querySelectorAll(".option")
      .forEach(button => {

        button.addEventListener("click", () => {

          const key =
            button.dataset.key;

          const status =
            button.dataset.status;

          checkState[key].status = status;

          const parent =
            button.closest(".check-item");

          parent
            .querySelectorAll(".option")
            .forEach(btn => {
              btn.classList.remove("selected");
            });

          button.classList.add("selected");


          const noteBox =
            document.getElementById(`note-${key}`);

          if (status === "abnormal") {

            noteBox.classList.add("show");

          } else {

            noteBox.classList.remove("show");

            const textarea =
              noteBox.querySelector("textarea");

            textarea.value = "";

            checkState[key].note = "";
          }

          updateStatus();
        });
      });


    document
      .querySelectorAll(".abnormal-box textarea")
      .forEach(textarea => {

        textarea.addEventListener("input", event => {

          const key =
            event.target
              .closest(".abnormal-box")
              .id
              .replace("note-", "");

          checkState[key].note =
            event.target.value;
        });

      });
  }


  renderChecks();


  /* ==========================================
     車牌格式
     ========================================== */

  function getPlate4() {

    let value =
      plateInput.value
        .trim()
        .toUpperCase();

    /*
      如果目前顯示完整車牌，例如 ABC-1234，
      自動取最後四碼。
    */

    const numbers =
      value.replace(/\D/g, "");

    if (numbers.length >= 4) {
      return numbers.slice(-4);
    }

    return "";
  }


  /* ==========================================
     讀取車輛
     ========================================== */

  async function loadVehicle() {

    const plate4 = getPlate4();

    if (plate4.length !== 4) {

      alert("請輸入正確的車牌四碼。");

      plateInput.focus();

      return;
    }


    readBtn.disabled = true;
    readBtn.textContent = "讀取中…";

    vehicleSuccess.classList.remove("show");
    previousRecord.classList.remove("show");


    try {

      const {
        data: vehicle,
        error
      } = await db
        .from("vehicles")
        .select("*")
        .eq("plate4", plate4)
        .eq("active", true)
        .maybeSingle();


      if (error) {
        throw error;
      }


      if (!vehicle) {

        currentVehicle = null;

        alert(
          `讀取失敗：查無車牌 ${plate4}，請確認車牌四碼。`
        );

        return;
      }


      currentVehicle = vehicle;


      /*
        成功後直接在車牌欄位顯示完整車牌
      */

      plateInput.value =
        vehicle.full_plate || plate4;

      plateInput.dataset.plate4 =
        plate4;


      vehicleSuccess.textContent =
        "✓ 車輛讀取成功";

      vehicleSuccess.classList.add("show");


      /*
        讀取最近一次巡檢
      */

      const {
        data: records,
        error: reportError
      } = await db
        .from("inspection_reports")
        .select("*")
        .eq("vehicle_id", vehicle.id)
        .order("reported_at", {
          ascending: false
        })
        .limit(1);


      if (reportError) {
        throw reportError;
      }


      if (records && records.length > 0) {

        const last = records[0];

        const date =
          new Date(last.reported_at)
            .toLocaleString("zh-TW", {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            });


        previousMain.textContent =
          `里程 ${Number(last.mileage).toLocaleString()} km`;


        let abnormalText =
          "上次檢查：全部正常";

        if (
          last.abnormal_items &&
          last.abnormal_items.length > 0
        ) {

          abnormalText =
            "上次異常：" +
            last.abnormal_items.join("、");
        }


        previousDetail.innerHTML =
          `${date}<br>${abnormalText}`;

        previousRecord.classList.add("show");

      } else {

        previousMain.textContent =
          "目前沒有巡檢紀錄";

        previousDetail.textContent =
          "這是第一次巡檢";

        previousRecord.classList.add("show");
      }


    } catch (error) {

      console.error(error);

      currentVehicle = null;

      alert(
        "讀取失敗：目前無法連線雲端資料庫，請稍後再試。"
      );

    } finally {

      readBtn.disabled = false;
      readBtn.textContent = "重新讀取";
    }
  }


  readBtn.addEventListener(
    "click",
    loadVehicle
  );


  /* ==========================================
     狀態判斷
     ========================================== */

  function updateStatus() {

    const abnormalItems =
      checkItems
        .filter(item =>
          checkState[item.key].status === "abnormal"
        )
        .map(item => item.name);


    if (abnormalItems.length === 0) {

      statusCard.className =
        "status-card";

      statusCard.textContent = "";

      return;
    }


    statusCard.className =
      "status-card show status-abnormal";

    statusCard.textContent =
      `⚠ 目前有 ${abnormalItems.length} 項異常：${abnormalItems.join("、")}`;
  }


  /* ==========================================
     儲存前檢查
     ========================================== */

  function validateForm() {

    if (!currentVehicle) {

      alert("請先輸入車牌並按「讀取」。");

      return false;
    }


    const mileage =
      Number(mileageInput.value);

    if (
      !mileageInput.value ||
      !Number.isFinite(mileage) ||
      mileage < 0
    ) {

      alert("請輸入目前里程。");

      mileageInput.focus();

      return false;
    }


    for (const item of checkItems) {

      const state =
        checkState[item.key];


      if (!state.status) {

        alert(
          `請完成「${item.name}」檢查。`
        );

        return false;
      }


      if (
        state.status === "abnormal" &&
        !state.note.trim()
      ) {

        alert(
          `「${item.name}」選擇異常，請填寫異常說明。`
        );

        const noteBox =
          document.querySelector(
            `#note-${item.key} textarea`
          );

        noteBox.focus();

        return false;
      }
    }


    return true;
  }


  /* ==========================================
     儲存
     ========================================== */

  async function saveRecord() {

    if (!validateForm()) {
      return;
    }


    const mileage =
      Number(mileageInput.value);


    const abnormalItems =
      checkItems
        .filter(item =>
          checkState[item.key].status === "abnormal"
        )
        .map(item => item.name);


    const overallStatus =
      abnormalItems.length > 0
        ? "abnormal"
        : "normal";


    const record = {

      vehicle_id:
        currentVehicle.id,

      mileage,

      oil_light:
        checkState.oil_light.status,

      front_tire:
        checkState.front_tire.status,

      rear_tire:
        checkState.rear_tire.status,

      brake:
        checkState.brake.status,

      headlight:
        checkState.headlight.status,

      brake_light:
        checkState.brake_light.status,

      overall_status:
        overallStatus,

      abnormal_items:
        abnormalItems

    };


    /*
      其他項目的說明，
      先併入 abnormal_items，
      保留目前資料庫結構相容性。
    */

    if (
      checkState.other.status === "abnormal"
    ) {

      record.abnormal_items = [
        ...record.abnormal_items,
        `其他：${checkState.other.note.trim()}`
      ];
    }


    saveBtn.disabled = true;
    saveBtn.textContent = "儲存中…";


    try {

      const {
        error
      } = await db
        .from("inspection_reports")
        .insert(record);


      if (error) {
        throw error;
      }


      alert("✓ 巡檢紀錄已成功儲存到雲端。");


      /*
        清除本次檢查狀態
      */

      mileageInput.value = "";

      checkItems.forEach(item => {

        checkState[item.key].status = null;
        checkState[item.key].note = "";

      });


      renderChecks();

      updateStatus();


      /*
        重新讀取最新紀錄
      */

      await loadVehicle();


    } catch (error) {

      console.error(error);

      alert(
        "儲存失敗：請確認網路連線後再試一次。"
      );

    } finally {

      saveBtn.disabled = false;
      saveBtn.textContent = "儲存巡檢紀錄";
    }
  }


  saveBtn.addEventListener(
    "click",
    saveRecord
  );

</script>

</body>
</html>
