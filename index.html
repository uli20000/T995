<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">

  <title>KFC｜車輛巡檢</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --red: #c8102e;
      --black: #242424;
      --gray: #77736d;
      --linen: #f4f0e8;
      --paper: #ffffff;
      --line: #ddd8ce;
      --green: #356b4b;
      --green-bg: #eef5f0;
      --danger: #b42318;
      --danger-bg: #fff0ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--linen);
      color: var(--black);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
      text-align: center;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    /* =========================
       Header
    ========================= */

    .header {
      background: var(--paper);
      padding: 40px 20px 34px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .title {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .kfc {
      color: var(--red);
      font-size: 32px;
      font-weight: 900;
    }

    .intro {
      padding: 32px 20px 16px;
    }

    .intro h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .intro p {
      margin: 0;
      color: var(--gray);
      font-size: 16px;
    }

    /* =========================
       Card
    ========================= */

    .card {
      margin: 14px 16px;
      padding: 26px 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .035);
    }

    .section-number {
      color: var(--red);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    /* =========================
       Vehicle
    ========================= */

    .vehicle-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .vehicle-input {
      flex: 1;
      min-width: 0;
    }

    input,
    textarea {
      width: 100%;
      border: 2px solid #d8d3ca;
      border-radius: 15px;
      background: #fff;
      color: var(--black);
      outline: none;
      transition: .2s;
    }

    input {
      height: 62px;
      padding: 0 15px;
      font-size: 20px;
      text-align: center;
    }

    textarea {
      min-height: 90px;
      padding: 14px;
      font-size: 17px;
      text-align: left;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200, 16, 46, .08);
    }

    input::placeholder,
    textarea::placeholder {
      color: #aaa;
    }

    .read-btn {
      min-width: 112px;
      border: 2px solid var(--black);
      border-radius: 15px;
      background: #fff;
      color: #1683df;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .read-btn:disabled {
      opacity: .5;
    }

    .vehicle-success {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--green-bg);
      color: var(--green);
      font-size: 16px;
      font-weight: 700;
    }

    .vehicle-success.show {
      display: block;
    }

    /* =========================
       Previous record
    ========================= */

    .previous {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #f8f6f1;
      border-radius: 15px;
      border: 1px solid var(--line);
    }

    .previous.show {
      display: block;
    }

    .previous-title {
      color: var(--gray);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .previous-main {
      font-size: 17px;
      font-weight: 700;
    }

    .previous-detail {
      margin-top: 6px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.7;
    }

    /* =========================
       Checks
    ========================= */

    .checks {
      text-align: center;
    }

    .check-item {
      padding: 20px 0;
      border-bottom: 1px solid #ebe7df;
    }

    .check-item:last-child {
      border-bottom: 0;
    }

    .check-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .option {
      width: 110px;
      height: 48px;
      border: 2px solid #ddd8ce;
      border-radius: 25px;
      background: #fff;
      color: var(--gray);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .option.normal.selected {
      border-color: #a7c4b0;
      background: var(--green-bg);
      color: var(--green);
    }

    .option.abnormal.selected {
      border-color: #e4aaa4;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .abnormal-box {
      display: none;
      margin-top: 14px;
    }

    .abnormal-box.show {
      display: block;
    }

    .required {
      margin-top: 6px;
      color: var(--danger);
      font-size: 13px;
    }

    /* =========================
       Status
    ========================= */

    .status-card {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      line-height: 1.6;
    }

    .status-card.show {
      display: block;
    }

    .status-abnormal {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* =========================
       Save
    ========================= */

    .save-btn {
      width: calc(100% - 32px);
      margin: 20px 16px 0;
      height: 64px;
      border: 0;
      border-radius: 18px;
      background: var(--red);
      color: white;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(200, 16, 46, .18);
    }

    .save-btn:disabled {
      opacity: .5;
    }

    .hint {
      padding: 18px 28px 0;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 500px) {

      .title {
        font-size: 36px;
      }

      .kfc {
        font-size: 29px;
      }

      .vehicle-row {
        flex-direction: column;
      }

      .read-btn {
        height: 56px;
      }

    }
  </style>
</head>

<body>

<div class="page">

  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <div class="eyebrow">
      DELIVERY CENTER
    </div>

    <div class="header-row">

      <h1 class="title">
        車輛巡檢
      </h1>

      <div class="kfc">
        KFC
      </div>

    </div>

  </header>


  <!-- =========================
       INTRO
  ========================= -->

  <section class="intro">

    <h2>
      每日安全確認
    </h2>

    <p>
      輸入車牌與里程，快速完成七項檢查。
    </p>

  </section>


  <!-- =========================
       01 車輛
  ========================= -->

  <section class="card">

    <div class="section-number">
      01・車輛
    </div>

    <label class="label">
      車牌
    </label>

    <div class="vehicle-row">

      <div class="vehicle-input">

        <input
          id="plate"
          type="text"
          inputmode="numeric"
          maxlength="8"
          placeholder="輸入車牌四碼"
          autocomplete="off"
        >

      </div>

      <button
        id="readBtn"
        class="read-btn"
        type="button"
      >
        讀取
      </button>

    </div>


    <div
      id="vehicleSuccess"
      class="vehicle-success"
    ></div>


    <div
      id="previousRecord"
      class="previous"
    >

      <div class="previous-title">
        最近一次巡檢
      </div>

      <div
        id="previousMain"
        class="previous-main"
      ></div>

      <div
        id="previousDetail"
        class="previous-detail"
      ></div>

    </div>

  </section>


  <!-- =========================
       02 里程
  ========================= -->

  <section class="card">

    <div class="section-number">
      02・里程
    </div>

    <label class="label">
      目前里程
    </label>

    <input
      id="mileage"
      type="number"
      inputmode="numeric"
      min="0"
      placeholder="請輸入目前里程"
    >

  </section>


  <!-- =========================
       03 填表人
  ========================= -->

  <section class="card">

    <div class="section-number">
      03・填表人
    </div>

    <label class="label">
      填表人
    </label>

    <input
      id="reporterName"
      type="text"
      maxlength="3"
      placeholder="請輸入姓名"
      autocomplete="name"
    >

    <div class="hint" style="padding:10px 0 0;">
      限填 3 個中文字，例如：王小明
    </div>

  </section>


  <!-- =========================
       04 CHECK
  ========================= -->

  <section class="card">

    <div class="section-number">
      03・CHECK
    </div>

    <div
      id="checks"
      class="checks"
    ></div>


    <div
      id="statusCard"
      class="status-card"
    ></div>

  </section>


  <!-- =========================
       SAVE
  ========================= -->

  <button
    id="saveBtn"
    class="save-btn"
    type="button"
  >
    儲存巡檢紀錄
  </button>


  <div class="hint">
    每次巡檢都會新增一筆紀錄，不會覆蓋過去資料。
  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://nurnboqwhctyswcufkyk.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51cm5ib3F3aGN0eXN3Y3Vma3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjE5MjMsImV4cCI6MjEwNTQ5NzkyM30.-OYo96FZ3Yz3tCsKDG0KqhUgQuxXUAGPHbtDXcd0yB8";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   CHECK ITEMS
   ===================================================== */

const checkItems = [

  {
    key: "oil_light",
    name: "機油燈"
  },

  {
    key: "front_tire",
    name: "前輪"
  },

  {
    key: "rear_tire",
    name: "後輪"
  },

  {
    key: "brake",
    name: "煞車"
  },

  {
    key: "headlight",
    name: "大燈"
  },

  {
    key: "brake_light",
    name: "煞車燈"
  },

  {
    key: "other",
    name: "其他"
  }

];


/* =====================================================
   STATE
   ===================================================== */

const checkState = {};

checkItems.forEach(item => {

  checkState[item.key] = {

    status: null,

    note: ""

  };

});


let currentVehicle = null;


/* =====================================================
   DOM
   ===================================================== */

const plateInput =
  document.getElementById("plate");

const readBtn =
  document.getElementById("readBtn");

const mileageInput =
  document.getElementById("mileage");

const reporterNameInput =
  document.getElementById("reporterName");

const vehicleSuccess =
  document.getElementById("vehicleSuccess");

const previousRecord =
  document.getElementById("previousRecord");

const previousMain =
  document.getElementById("previousMain");

const previousDetail =
  document.getElementById("previousDetail");

const checksContainer =
  document.getElementById("checks");

const statusCard =
  document.getElementById("statusCard");

const saveBtn =
  document.getElementById("saveBtn");


/* =====================================================
   RENDER CHECKS
   ===================================================== */

function renderChecks() {

  checksContainer.innerHTML = "";


  checkItems.forEach(item => {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "check-item";


    wrapper.innerHTML = `

      <div class="check-name">
        ${item.name}
      </div>

      <div class="options">

        <button
          type="button"
          class="option normal"
          data-key="${item.key}"
          data-status="normal"
        >
          正常
        </button>

        <button
          type="button"
          class="option abnormal"
          data-key="${item.key}"
          data-status="abnormal"
        >
          異常
        </button>

      </div>


      <div
        class="abnormal-box"
        id="note-${item.key}"
      >

        <textarea
          placeholder="請輸入${item.name}異常狀況"
        ></textarea>

        <div class="required">
          異常時請填寫說明
        </div>

      </div>

    `;


    checksContainer.appendChild(wrapper);

  });


  document
    .querySelectorAll(".option")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const key =
            this.dataset.key;

          const status =
            this.dataset.status;


          checkState[key].status =
            status;


          const parent =
            this.closest(".check-item");


          parent
            .querySelectorAll(".option")
            .forEach(btn => {

              btn.classList.remove(
                "selected"
              );

            });


          this.classList.add(
            "selected"
          );


          const noteBox =
            document.getElementById(
              `note-${key}`
            );


          if (status === "abnormal") {

            noteBox.classList.add(
              "show"
            );

          } else {

            noteBox.classList.remove(
              "show"
            );


            const textarea =
              noteBox.querySelector(
                "textarea"
              );

            textarea.value = "";

            checkState[key].note =
              "";

          }


          updateStatus();

        }
      );

    });


  document
    .querySelectorAll(
      ".abnormal-box textarea"
    )
    .forEach(textarea => {

      textarea.addEventListener(
        "input",
        function() {

          const key =
            this.closest(
              ".abnormal-box"
            )
            .id
            .replace(
              "note-",
              ""
            );


          checkState[key].note =
            this.value;

        }
      );

    });

}


renderChecks();


/* =====================================================
   GET PLATE
   ===================================================== */

function getPlate4() {

  const value =
    plateInput.value
      .trim()
      .toUpperCase();


  const numbers =
    value.replace(
      /\D/g,
      ""
    );


  if (
    numbers.length >= 4
  ) {

    return numbers.slice(-4);

  }


  return "";

}


/* =====================================================
   READ VEHICLE
   ===================================================== */

async function loadVehicle() {

  const plate4 =
    getPlate4();


  if (
    plate4.length !== 4
  ) {

    alert(
      "請輸入正確的車牌四碼。"
    );

    plateInput.focus();

    return;

  }


  readBtn.disabled = true;

  readBtn.textContent =
    "讀取中…";


  vehicleSuccess
    .classList
    .remove("show");


  previousRecord
    .classList
    .remove("show");


  currentVehicle = null;


  try {

    /*
      直接從 vehicles 查詢
    */

    const result =
      await db
        .from("vehicles")
        .select("*")
        .eq(
          "plate4",
          plate4
        )
        .eq(
          "active",
          true
        )
        .maybeSingle();


    const vehicle =
      result.data;

    const error =
      result.error;


    /*
      如果 Supabase 回傳錯誤
    */

    if (error) {

      console.error(
        "SUPABASE VEHICLE ERROR:",
        error
      );


      alert(
        "讀取失敗\n\n" +
        "錯誤代碼：" +
        (error.code || "無") +
        "\n\n" +
        "錯誤訊息：" +
        (error.message || "無") +
        "\n\n" +
        "詳細：" +
        (error.details || "無") +
        "\n\n" +
        "提示：" +
        (error.hint || "無")
      );


      return;

    }


    /*
      查不到車
    */

    if (!vehicle) {

      alert(
        `讀取失敗\n\n查無車牌 ${plate4}\n\n請確認 Supabase「vehicles」資料表是否有這台車。`
      );


      return;

    }


    /*
      成功
    */

    currentVehicle =
      vehicle;


    /*
      車牌欄位直接顯示完整車牌
    */

    plateInput.value =
      vehicle.full_plate ||
      plate4;


    plateInput.dataset.plate4 =
      plate4;


    vehicleSuccess.textContent =
      "✓ 車輛讀取成功";


    vehicleSuccess
      .classList
      .add("show");


    /*
      查詢最近一次巡檢
    */

    const reportResult =
      await db
        .from("inspection_reports")
        .select("*")
        .eq(
          "vehicle_id",
          vehicle.id
        )
        .order(
          "reported_at",
          {
            ascending: false
          }
        )
        .limit(1);


    if (reportResult.error) {

      console.error(
        "SUPABASE REPORT ERROR:",
        reportResult.error
      );


      alert(
        "車輛讀取成功，但巡檢紀錄讀取失敗\n\n" +
        "錯誤代碼：" +
        (reportResult.error.code || "無") +
        "\n\n" +
        "錯誤訊息：" +
        (reportResult.error.message || "無")
      );


      return;

    }


    const records =
      reportResult.data;


    /*
      有歷史紀錄
    */

    if (
      records &&
      records.length > 0
    ) {

      const last =
        records[0];


      const date =
        new Date(
          last.reported_at
        )
        .toLocaleString(
          "zh-TW",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      previousMain.textContent =
        `上次里程 ${Number(
          last.mileage
        ).toLocaleString()} km`;


      let abnormalText =
        "上次檢查：全部正常";


      if (
        last.abnormal_items &&
        last.abnormal_items.length > 0
      ) {

        abnormalText =
          "上次異常：" +
          last.abnormal_items.join(
            "、"
          );

      }


      previousDetail.innerHTML =
        `${date}<br>${abnormalText}`;


      previousRecord
        .classList
        .add("show");


    } else {

      previousMain.textContent =
        "目前沒有巡檢紀錄";


      previousDetail.textContent =
        "這是第一次巡檢";


      previousRecord
        .classList
        .add("show");

    }


  } catch (error) {

    console.error(
      "UNEXPECTED ERROR:",
      error
    );


    alert(
      "讀取失敗\n\n" +
      "錯誤：" +
      (error.message || error)
    );


  } finally {

    readBtn.disabled =
      false;

    readBtn.textContent =
      "重新讀取";

  }

}


/* =====================================================
   READ BUTTON
   ===================================================== */

readBtn.addEventListener(
  "click",
  loadVehicle
);


/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

  const abnormalItems =
    checkItems
      .filter(item =>
        checkState[
          item.key
        ].status === "abnormal"
      )
      .map(item =>
        item.name
      );


  if (
    abnormalItems.length === 0
  ) {

    statusCard.className =
      "status-card";

    statusCard.textContent =
      "";

    return;

  }


  statusCard.className =
    "status-card show status-abnormal";


  statusCard.textContent =
    `⚠ ${abnormalItems.length} 項異常：${abnormalItems.join("、")}`;

}


/* =====================================================
   VALIDATE
   ===================================================== */

function validateForm() {

  /*
    必須先讀取車輛
  */

  if (!currentVehicle) {

    alert(
      "請先輸入車牌並按「讀取」。"
    );

    return false;

  }


  /*
    里程
  */

  const mileage =
    Number(
      mileageInput.value
    );


  if (
    !mileageInput.value ||
    !Number.isFinite(mileage) ||
    mileage < 0
  ) {

    alert(
      "請輸入目前里程。"
    );

    mileageInput.focus();

    return false;

  }


  /*
    填表人
  */

  const reporterName =
    reporterNameInput.value.trim();

  if (!/^[\u4e00-\u9fff]{3}$/.test(reporterName)) {

    alert(
      "請輸入正確的填表人姓名。\n\n限 3 個中文字，例如：王小明"
    );

    reporterNameInput.focus();

    return false;

  }


  /*
    七項檢查
  */

  for (
    const item of checkItems
  ) {

    const state =
      checkState[
        item.key
      ];


    /*
      沒選
    */

    if (!state.status) {

      alert(
        `請完成「${item.name}」檢查。`
      );

      return false;

    }


    /*
      異常必須填寫
    */

    if (
      state.status ===
        "abnormal" &&
      !state.note.trim()
    ) {

      alert(
        `「${item.name}」選擇異常，請填寫異常說明。`
      );


      const textarea =
        document.querySelector(
          `#note-${item.key} textarea`
        );


      if (textarea) {
        textarea.focus();
      }


      return false;

    }

  }


  return true;

}


/* =====================================================
   SAVE
   ===================================================== */

async function saveRecord() {

  if (
    !validateForm()
  ) {

    return;

  }


  const mileage =
    Number(
      mileageInput.value
    );


  /*
    找出異常項目
  */

  const abnormalItems =
    checkItems
      .filter(item =>
        checkState[
          item.key
        ].status ===
        "abnormal"
      )
      .map(item => {

        if (
          checkState[
            item.key
          ].note.trim()
        ) {

          return `${item.name}：${checkState[item.key].note.trim()}`;

        }

        return item.name;

      });


  const overallStatus =
    abnormalItems.length > 0
      ? "abnormal"
      : "normal";


  /*
    建立資料
  */

  const record = {

    vehicle_id:
      currentVehicle.id,

    mileage:
      mileage,

    reporter_name:
      reporterNameInput.value.trim(),

    oil_light:
      checkState.oil_light.status,

    front_tire:
      checkState.front_tire.status,

    rear_tire:
      checkState.rear_tire.status,

    brake:
      checkState.brake.status,

    headlight:
      checkState.headlight.status,

    brake_light:
      checkState.brake_light.status,

    overall_status:
      overallStatus,

    abnormal_items:
      abnormalItems

  };


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "儲存中…";


  try {

    const result =
      await db
        .from(
          "inspection_reports"
        )
        .insert(
          record
        );


    if (result.error) {

      console.error(
        "SAVE ERROR:",
        result.error
      );


      alert(
        "儲存失敗\n\n" +
        "錯誤代碼：" +
        (result.error.code || "無") +
        "\n\n" +
        "錯誤訊息：" +
        (result.error.message || "無") +
        "\n\n" +
        "詳細：" +
        (result.error.details || "無")
      );


      return;

    }


    /*
      儲存成功
    */

    alert(
      "✓ 巡檢紀錄已成功儲存到雲端。"
    );


    /*
      清空里程
    */

    mileageInput.value =
      "";


    /*
      重設七項檢查
    */

    checkItems.forEach(
      item => {

        checkState[
          item.key
        ].status = null;

        checkState[
          item.key
        ].note = "";

      }
    );


    renderChecks();

    updateStatus();


    /*
      重新讀取最新紀錄
    */

    await loadVehicle();


  } catch (error) {

    console.error(
      "SAVE UNEXPECTED ERROR:",
      error
    );


    alert(
      "儲存失敗\n\n" +
      "錯誤：" +
      (error.message || error)
    );


  } finally {

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "儲存巡檢紀錄";

  }

}


/* =====================================================
   SAVE BUTTON
   ===================================================== */

saveBtn.addEventListener(
  "click",
  saveRecord
);

</script>

</body>
</html>
